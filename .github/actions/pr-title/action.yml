name: 'PR title contract'
description: >-
  PR タイトルの commit-message 契約(ADR-0031, docs/claude/pr-title-
  contract.md)を強制する required check の実体。ADR-591(docs/adr/591-
  ci-workflow-naming.md D3)により、以前の `workflow_call` reusable
  workflow から composite action へ置換した — reusable は必ず
  「呼び出し側 job 名 / 呼ばれる job 名」の連結名を作り、この連結ルールの
  誤解が required check context の不一致事故(#337)とテンプレートの
  権限・pin 不具合(#491)を生んだ。composite action はこの連結が発生
  しない(呼び出し側 job の `name:` だけが required check context になる)
  ため、その事故の型自体が構造的に無くなる。

  判定ロジックは全て tarotene/dotfiles に一元化されており(PR タイトル
  文法は crates/pr-title-check の Rust 実装、残りは scripts/ 配下の
  pr-merge-settings-check / rulesets-context-check / workflow-naming-
  check)、この action はその呼び出しに徹する。呼び出し
  元リポジトリの checkout 状態には依存しない — 常に別途 dotfiles を
  sparse-checkout する(dotfiles 自身の PR ではこの PR 自身の head SHA、
  他リポジトリでは main の安定版)。

inputs:
  title:
    description: 検査対象の PR タイトル(通常は github.event.pull_request.title)
    required: true

runs:
  using: composite
  steps:
    # 文法検査・宣言検査の単一ソース(scripts/*)を取得する。dotfiles 自身
    # のトリガー(github.repository == tarotene/dotfiles)では、この PR
    # 自身の head SHA から取得する — checker 自体を変更する PR を、まだ
    # main に乗っていない版で検査できる(旧 reusable workflow から引き継ぐ
    # 挙動、docs/claude/pr-title-contract.md 参照)。path をリポジトリ直下
    # ではなく専用ディレクトリにする — 呼び出し元リポジトリ自身の
    # checkout 内容(既に checkout 済みのはず)を上書きしないため。
    - uses: actions/checkout@v4
      with:
        repository: tarotene/dotfiles
        ref: ${{ github.repository == 'tarotene/dotfiles' && github.sha || 'main' }}
        # Cargo.toml は cargo が workspace root を見つけるために必要。
        # crates/* は glob メンバーなので、sparse で crates/pr-title-check
        # だけを取っても workspace は解決できる(存在するメンバーだけが
        # 対象になる)。pr-title-check は依存ゼロなので registry へ出ない。
        sparse-checkout: |
          /Cargo.toml
          /crates/pr-title-check/
          scripts/github-audit
          scripts/pr-merge-settings-check
          scripts/rulesets-context-check
          scripts/workflow-naming-check
        sparse-checkout-cone-mode: false
        path: .pr-title-tools

    # PR タイトル文法の検査(ADR-0031)。単一正本は crates/pr-title-check
    # (#415 で bash の scripts/pr-title-check から Rust へ移植)。
    # GitHub-hosted の ubuntu runner には cargo が入っている。無い runner
    # (self-hosted 等)では、黙って検査を飛ばさず明示的に落とす。
    - name: Validate PR title
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
      run: |
        set -euo pipefail
        if ! command -v cargo > /dev/null 2>&1; then
          echo "::error::cargo が見つかりません。PR タイトル検査(crates/pr-title-check)は Rust ツールチェーンを必要とします" >&2
          exit 1
        fi
        cargo build --release --quiet \
          --manifest-path .pr-title-tools/Cargo.toml -p pr-title-check
        .pr-title-tools/target/release/pr-title-check "$TITLE"

    # ADR-0031 Amendment: PR タイトル契約は squash merge 設定の上に乗った
    # proxy であり、その設定が drift すると契約全体が無声でバイパスされる。
    # ここで前提の生存を required check として検査する(旧 reusable
    # workflow から引き継ぐ挙動)。GITHUB_TOKEN の contents:write が要る
    # (呼び出し元ワークフロー側の job permissions で明示する必要がある —
    # 下記コメント参照)。
    - name: Validate merge settings prerequisite
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        chmod +x .pr-title-tools/scripts/pr-merge-settings-check
        .pr-title-tools/scripts/pr-merge-settings-check "${{ github.repository }}"

    # ADR-503: 呼び出し元(caller)リポジトリ
    # の .github/rulesets/quality.json 宣言と live な branch ruleset の
    # 両方を、この PR の head で実際に報告される job 名(Actions API)と
    # 突合する。`actions: read` が呼び出し元ワークフロー側の job
    # permissions に必要(下記コメント参照)。
    - name: Validate required-check contexts
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # ADR-591 の集約 job `CI passed` は `needs:` で束ねた重い job
        # (build-host 等、実測で数分)が全て完了するまで自身の check-run
        # すら報告しない。既定のポーリング窓(90s)はこの待ち時間より短く、
        # PR #596 で実際に「宣言の required context が報告されていない」
        # 誤検知(false failure — CI passed 自体は後で success する)を
        # 起こした。この呼び出しに限り窓を広げる(rulesets-context-check
        # 自体の既定値は他の呼び出し元のために変えない)。
        RULESETS_CONTEXT_CHECK_TIMEOUT: "1200"
        RULESETS_CONTEXT_CHECK_INTERVAL: "20"
      run: |
        set -euo pipefail
        chmod +x .pr-title-tools/scripts/rulesets-context-check
        .pr-title-tools/scripts/rulesets-context-check \
          "${{ github.repository }}" \
          "${{ github.event.pull_request.head.sha }}" \
          "${{ github.event.repository.default_branch }}"

    # ADR-591(docs/adr/591-ci-workflow-naming.md): CI workflow 命名基準
    # (集約 job・name: casing・ファイル名・quality.json 正本一致)の drift
    # を、この PR の head に対して検査する。
    - name: Validate workflow naming
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        chmod +x .pr-title-tools/scripts/workflow-naming-check
        .pr-title-tools/scripts/workflow-naming-check \
          "${{ github.repository }}" \
          --ref "${{ github.event.pull_request.head.sha }}"

# 呼び出し元ワークフロー側で必要な job permissions(この composite action
# 自体は permissions を宣言できない — job 単位でしか宣言できないため、
# caller テンプレート(config/claude/skills/repo-governance-common/
# templates/.github/workflows/pr-title.yml)側にコメントで明記する):
#   contents: write  — merge 設定フィールドの読み取り(GitHub REST API の
#                      仕様上、contents:read だけでは squash_merge_commit_
#                      title 等がレスポンスから欠落する)
#   actions: read    — Validate required-check contexts / Validate
#                      workflow naming が自 run の jobs を読むために必要
