name: 'API docs (Python)'
description: >-
  Python パッケージの API ドキュメントを Sphinx + autodoc で警告をエラー
  (`-W -n`)として strict にビルドし、doctest も実行する(スタック標準の docs
  必須化、ADR-640 stack-standard-api-docs)。composite action である理由と
  checkout の前提は docs-rust と同じ。

  `pyproject.toml` の `[project.optional-dependencies]` に `docs` があれば
  `pip install -e '.[docs]'` で入れる(myst-parser やテーマなど、docs/conf.py
  が使う拡張の依存をリポジトリ側で宣言するため)。無ければ `-e .` のまま。

  `docs/conf.py` があればそれを使う。無ければ sphinx-apidoc で最小構成を
  生成する(リポジトリ側に Sphinx の設定を強要しない)。生成する構成には、
  標準ライブラリの型参照を解決する intersphinx(Python 公式の目録)を含める。生成した conf.py は
  `doctest_global_setup` でパッケージを import する — sphinx.ext.doctest は
  autodoc 対象モジュールを自動 import しないため、これが無いと docstring の
  doctest が NameError で落ちる(fixture で実測)。

inputs:
  working-directory:
    description: pyproject.toml があるディレクトリ
    required: false
    default: '.'
  package-dir:
    description: >-
      sphinx-apidoc に渡すパッケージのディレクトリ。空なら `src/<pkg>`、無ければ
      直下の `__init__.py` を持つディレクトリを自動検出する。
    required: false
    default: ''
  python-version:
    description: >-
      setup-python に渡すバージョン。空なら working-directory の `.python-version`
      を使い、それも無ければ '3.x'(最新の Python)を使う。最新の Python は、
      依存が上限を持つリポジトリ(例: requires-python に現れない `Requires-Python <3.15`)
      で `pip install -e .` を落とすので、そうしたリポジトリは `.python-version` を
      置く(テスト job など他の job と版の正本を 1 つにできる)。明示した値は
      `.python-version` より優先する。
    required: false
    default: ''
  upload:
    description: 成果物を workflow artifact として残すか('true' / 'false')
    required: false
    default: 'true'

outputs:
  site-dir:
    description: Pages に載せる静的サイトのディレクトリ
    value: ${{ steps.build.outputs.dir }}

runs:
  using: composite
  steps:
    # setup-python 自身にも「入力が空なら .python-version を読む」機能があるが、
    # 読むのはカレントディレクトリ固定で working-directory を見ず、ファイルが無いと
    # PATH 上の Python に落ちる('3.x' の従来挙動と変わる)。そのためここで解決する。
    - name: Resolve the Python version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        v="$REQUESTED"
        if [ -z "$v" ] && [ -f .python-version ]; then
          v="$(tr -d '[:space:]' < .python-version)"
        fi
        echo "version=${v:-3.x}" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ steps.version.outputs.version }}

    - name: Install project and Sphinx
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # Sphinx の版は requirements.txt に pin してある(Renovate が追う、#645)。
        python -m pip install --quiet -r "$GITHUB_ACTION_PATH/requirements.txt"
        # pyproject.toml に `docs` extra があれば、それも入れる。docs/conf.py が
        # Sphinx 拡張(myst-parser など)やテーマを使うリポジトリの依存の正本は
        # pyproject.toml の 1 か所で、この action に入力を増やさない。
        extra=""
        if python -c 'import sys, tomllib; d = tomllib.load(open("pyproject.toml", "rb")); sys.exit(0 if "docs" in d.get("project", {}).get("optional-dependencies", {}) else 1)'; then
          extra="[docs]"
        fi
        python -m pip install --quiet -e ".${extra}"

    - name: Build docs (warnings are errors) and run doctests
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        set -euo pipefail
        src="docs"
        if [ ! -f docs/conf.py ]; then
          pkg="$PACKAGE_DIR"
          if [ -z "$pkg" ]; then
            if [ -d src ]; then
              pkg="$(find src -mindepth 2 -maxdepth 2 -name __init__.py -printf '%h\n' | sort | head -n1)"
            else
              pkg="$(find . -mindepth 2 -maxdepth 2 -name __init__.py -not -path './.*' -printf '%h\n' | sort | head -n1)"
            fi
          fi
          if [ -z "$pkg" ] || [ ! -d "$pkg" ]; then
            echo "::error::package directory not found; set the package-dir input" >&2
            exit 1
          fi
          src=".docs-gen"
          rm -rf "$src"
          name="$(basename "$pkg")"
          sphinx-apidoc --full --ext-doctest -H "$name" -A "$name" -o "$src" "$pkg"
          printf '\ndoctest_global_setup = "from %s import *"\n' "$name" >> "$src/conf.py"
          # nitpicky(-n)は標準ライブラリの型(pathlib.Path など)も未解決参照として
          # 警告にする。sphinx-apidoc の最小構成は intersphinx を持たないので、
          # 型注釈に標準ライブラリの型を書いただけで strict ビルドが落ちる(2026-10-18、
          # 実リポジトリで 42 件中 36 件がこれ)。Python 公式の目録を引いて解決する。
          printf '\nextensions.append("sphinx.ext.intersphinx")\nintersphinx_mapping = {"python": ("https://docs.python.org/3", None)}\n' >> "$src/conf.py"
        fi
        site="$PWD/.docs-site"
        rm -rf "$site"
        # -W: 警告をエラー、-n: nitpicky(未解決参照を警告にする)。
        sphinx-build -W -n -b html "$src" "$site"
        sphinx-build -W -b doctest "$src" "$PWD/.docs-doctest"
        echo "dir=$site" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: inputs.upload == 'true'
      with:
        name: docs-python
        path: ${{ steps.build.outputs.dir }}
        retention-days: 7
