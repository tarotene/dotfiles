name: 'Deploy a Worker'
description: >-
  静的アセットだけの Cloudflare Worker を wrangler で配信する共通部品
  (docs/agents/deploy-worker.md、ADR は同文書の「決定」節を参照)。
  `mode: deploy` は本番へ配信し、`mode: preview` は PR のプレビュー版
  (Worker の version)を上げて、その URL を PR にコメントする。

  この action が担うのは、サイトごとに複写されがちな 3 つだけである:
  token がないときは、失敗させずに警告して成功で終わること(token を渡す前に
  main を赤くしない)、本番と PR で wrangler の呼び方を揃えること、
  プレビュー URL を 1 つの PR コメントに上書きで載せること。
  wrangler 自体は、呼び出し側の lockfile で固定したものを `wrangler` 入力で
  呼ぶ。依存の導入とビルド成果物の取得(download-artifact)も呼び出し側が
  先に済ませる — token を持つ job で、この action が依存のスクリプトを
  走らせないため。

  入力を持つ private な Web アプリ(Worker + D1、docs/agents/personal-web-app.md)
  のために、次の 2 つを追加した。`d1-database` を渡すと、`mode: deploy` は配信の
  前に D1 のマイグレーションを適用し、失敗したら配信しない(スキーマが先、
  コードが後の順序を、呼び出し側の step の並びに任せない)。配信のあとは、
  リポジトリの About の Website 欄を読み戻し、空なら警告する(設定そのものは
  管理者権限が必要になるため、人かエージェントが `gh repo edit OWNER/REPO --homepage URL` で行う)。

  初回配信のために、さらに 3 つを追加した。(1) 新しい Worker の最初の配信は、アップロードと
  マイグレーションが成功したあとの `GET …/workers/workers/<名前>` が `10007`(Worker does
  not exist)で失敗することがある(cloudflare/workers-sdk#17069)ので、`10007` のときだけ、
  `wrangler triggers deploy` を間隔を空けて最大 6 回(合計約 10 分)再試行する。ほかの失敗は
  再試行しない。(2) `vars` を渡すと、`wrangler deploy` に `--var` として渡す(サイトの
  `wrangler.jsonc` に値を複写しない。値が空なら、アップロードの前に失敗させる)。(3)
  `access-login-check: 'true'` を渡すと、配信のあとで、ログインなしの要求が Cloudflare Access の
  ログインへ 302 で転送されることを確かめ、転送されなければ失敗させる。

inputs:
  mode:
    description: '`deploy`(本番へ配信)または `preview`(PR のプレビュー)'
    required: true
  api-token:
    description: >-
      Cloudflare の API token(Workers Scripts の編集権限)。空なら配信せず、
      警告を出して成功で終わる。
    required: false
    default: ''
  account-id:
    description: Cloudflare のアカウント ID
    required: false
    default: ''
  wrangler:
    description: >-
      呼び出し側の lockfile で固定した wrangler を呼ぶコマンド
      (例: `pnpm exec wrangler`、`npx --no-install wrangler`)。
    required: true
  working-directory:
    description: wrangler.jsonc があるディレクトリ
    required: false
    default: '.'
  d1-database:
    description: >-
      D1 のデータベース名(`wrangler.jsonc` の `database_name`)。渡すと、
      `mode: deploy` は配信の前に `wrangler d1 migrations apply <名前> --remote`
      を実行し、失敗したら配信しない。token には D1 の書き込み権限が必要になる。
      `mode: preview` では使えない(プレビューの version は本番と同じ binding を
      指す見込みで、未確認。personal-web-app.md)。
    required: false
    default: ''
  vars:
    description: >-
      配信時に `wrangler deploy --var` で渡す変数。1 行に 1 つ、`NAME=値` の形で書く
      (インフラのリポジトリが宣言する Actions 変数を、呼び出し側の workflow の `vars` コンテキストから受けて渡す。
      式の書き方は docs/agents/personal-web-app.md)。
      名前は英数字と `_` で、値が空の行は、アップロードの前に失敗させる(空の値を渡した
      Worker が、検証に必要な値を持たない状態で本番に出ないため)。同じ名前が
      `wrangler.jsonc` の `vars` にあれば、こちらが優先される(wrangler@4.166.0 の
      `deploy-helpers/src/deploy/deploy.ts`)。`mode: preview` では使えない。
    required: false
    default: ''
  access-login-check:
    description: >-
      `'true'` なら、`mode: deploy` の配信のあとで、配信した URL(`wrangler` の出力の
      workers.dev の URL)へログインなしで要求し、302 で `cloudflareaccess.com` のログインへ
      転送されることを確かめる。転送されなければ(門が開いている)失敗させる。公開の Worker には
      使わない。
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check the inputs
      id: ready
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        API_TOKEN: ${{ inputs.api-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        D1_DATABASE: ${{ inputs.d1-database }}
        VARS: ${{ inputs.vars }}
        ACCESS_LOGIN_CHECK: ${{ inputs.access-login-check }}
      run: |
        set -euo pipefail
        case "$MODE" in
          deploy) ;;
          preview)
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::mode: preview は pull_request のイベントでだけ使えます" >&2
              exit 1
            fi
            if [ -n "$D1_DATABASE" ]; then
              echo "::error::d1-database は mode: deploy でだけ使えます(プレビューの version が本番の D1 を指さないことを、確かめていません)" >&2
              exit 1
            fi
            if [ -n "$VARS" ]; then
              echo "::error::vars は mode: deploy でだけ使えます" >&2
              exit 1
            fi
            if [ "$ACCESS_LOGIN_CHECK" = "true" ]; then
              echo "::error::access-login-check は mode: deploy でだけ使えます" >&2
              exit 1
            fi
            ;;
          *)
            echo "::error::mode は deploy か preview です(受け取った値: ${MODE})" >&2
            exit 1
            ;;
        esac
        # 名前が `-` で始まると wrangler のオプションに読まれるので、英数字・`_`・`-` で、先頭は英数字に限る。
        if [ -n "$D1_DATABASE" ] && ! [[ "$D1_DATABASE" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
          echo "::error::d1-database は英数字・_・- だけで、先頭は英数字にしてください(受け取った値: ${D1_DATABASE})" >&2
          exit 1
        fi
        # `vars` は 1 行に 1 つの `NAME=値`。名前は英数字と `_`、値は空にしない。値が空だと、検証に必要な値を持たない
        # Worker が本番に出るので、token を渡す前(アップロードの前)に失敗させる。値そのものは、ここで出力しない。
        if [ -n "$VARS" ]; then
          line_no=0
          while IFS= read -r line; do
            line_no=$((line_no + 1))
            if [ -z "$line" ]; then
              continue
            fi
            name="${line%%=*}"
            value="${line#*=}"
            if [[ "$line" != *=* ]] || ! [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::vars の ${line_no} 行目が NAME=値 の形ではありません" >&2
              exit 1
            fi
            if [ -z "$value" ]; then
              echo "::error::vars の ${name} の値が空です(インフラのリポジトリが宣言する Actions 変数が、このリポジトリに届いているかを見てください)" >&2
              exit 1
            fi
          done <<< "$VARS"
        fi
        if [ -z "$API_TOKEN" ]; then
          echo "::warning::api-token is not set; skipped the ${MODE}."
          echo "registered=false" >> "$GITHUB_OUTPUT"
        else
          echo "registered=true" >> "$GITHUB_OUTPUT"
        fi

    # スキーマが先、コードが後(コードが先に新しくなって、古いスキーマを読むことを避ける)。
    # 失敗したら set -e でここで止まり、次の配信の step は走らない。
    - name: Apply the D1 migrations
      if: ${{ steps.ready.outputs.registered == 'true' && inputs.mode == 'deploy' && inputs.d1-database != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        WRANGLER: ${{ inputs.wrangler }}
        D1_DATABASE: ${{ inputs.d1-database }}
      run: |
        set -euo pipefail
        read -ra wrangler <<< "$WRANGLER"
        "${wrangler[@]}" d1 migrations apply "$D1_DATABASE" --remote

    - name: Deploy to Cloudflare Workers
      if: ${{ steps.ready.outputs.registered == 'true' && inputs.mode == 'deploy' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        WRANGLER: ${{ inputs.wrangler }}
        VARS: ${{ inputs.vars }}
      run: |
        set -euo pipefail
        read -ra wrangler <<< "$WRANGLER"
        # `--var NAME:値` は、最初の `:` だけで名前と値に分かれる(wrangler@4.166.0 の `utils/collectKeyValues.ts`)ので、
        # `https://…` を含む値も欠けない。検証は、上の step で済んでいる。
        var_args=()
        while IFS= read -r line; do
          if [ -n "$line" ]; then
            var_args+=(--var "${line%%=*}:${line#*=}")
          fi
        done <<< "$VARS"

        # 新しい Worker の最初の配信は、アップロードのあとの `GET …/workers/workers/<名前>` が `10007` で失敗することが
        # ある(Worker を作った直後の数分、そのエンドポイントが 404 を返す。cloudflare/workers-sdk#17069)。`wrangler` は
        # 5xx と 429 しか再試行しない。`10007` のときだけ、トリガー(workers.dev など)の配信を、間隔を空けて再試行する。
        # ほかの失敗は、その場で失敗させる。
        all_log="${RUNNER_TEMP}/deploy-worker-output.log"
        last_log="${RUNNER_TEMP}/deploy-worker-last.log"
        : > "$all_log"
        retry_unit="${DEPLOY_WORKER_RETRY_UNIT:-30}"
        max_attempts=6

        run_logged() {
          local rc=0
          "$@" 2>&1 | tee "$last_log" || rc=$?
          cat "$last_log" >> "$all_log"
          return "$rc"
        }

        if ! run_logged "${wrangler[@]}" deploy ${var_args[@]+"${var_args[@]}"}; then
          if ! grep -q 'code: 10007' "$last_log"; then
            exit 1
          fi
          attempt=1
          while :; do
            if [ "$attempt" -gt "$max_attempts" ]; then
              echo "::error::Worker の反映を ${max_attempts} 回待っても、10007 が続きました" >&2
              exit 1
            fi
            delay=$((retry_unit * (attempt < 5 ? attempt : 5)))
            echo "::notice::10007(Worker がまだ反映されていない)。${delay} 秒後に wrangler triggers deploy を再試行します(${attempt}/${max_attempts})。"
            sleep "$delay"
            if run_logged "${wrangler[@]}" triggers deploy; then
              break
            fi
            if ! grep -q 'code: 10007' "$last_log"; then
              exit 1
            fi
            attempt=$((attempt + 1))
          done
        fi

    # 配信の最後の段: リポジトリの About の Website 欄に、配信した URL を載せる(private → workers.dev の URL、
    # public → Pages の URL)。設定は管理者権限が必要になり、`GITHUB_TOKEN` は `administration` の権限を持てないので
    # (workflow の `permissions:` のキーにない)、ここは読み戻して空なら警告するだけにする(失敗にはしない)。
    # 設定は、人かエージェントが `gh repo edit OWNER/REPO --homepage <URL>` で行う(リポジトリは引数で、`-R` は取らない)。
    - name: Check the repository's Website field
      if: ${{ steps.ready.outputs.registered == 'true' && inputs.mode == 'deploy' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        if ! homepage=$(gh api "repos/${REPO}" --jq '.homepage // ""' 2>/dev/null); then
          echo "::warning::${REPO} の Website 欄を読めませんでした(確かめられていません)。"
        elif [ -z "$homepage" ]; then
          echo "::warning::${REPO} の About の Website 欄が空です。配信した URL を載せてください: gh repo edit ${REPO} --homepage <URL>"
        else
          echo "::notice::Website 欄: ${homepage}"
        fi

    # 門が閉じていることの確認: ログインなしの要求が、Access のログインへ 302 で転送される。新しい Worker は、
    # アカウント全体の門(全 Worker を本人だけに閉じる宣言)が働いて、配信した瞬間から閉じているはずで、開いていれば
    # 宣言が外れている。公開の Worker は、この確認を使わない(`access-login-check` の既定は false)。
    - name: Check that the Worker is behind the Access login
      if: ${{ steps.ready.outputs.registered == 'true' && inputs.mode == 'deploy' && inputs.access-login-check == 'true' }}
      shell: bash
      run: |
        set -uo pipefail
        all_log="${RUNNER_TEMP}/deploy-worker-output.log"
        url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$all_log" 2>/dev/null | head -n 1 || true)
        if [ -z "$url" ]; then
          echo "::warning::wrangler の出力に workers.dev の URL がなく、門が閉じていることを確かめられませんでした(確かめられていません)。"
          exit 0
        fi
        attempts=3
        for attempt in $(seq 1 "$attempts"); do
          code=""
          location=""
          read -r code location < <(curl -sS -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}\n' "$url" 2>/dev/null || true)
          if [ "$code" = "302" ] && [[ "$location" == https://*.cloudflareaccess.com/* ]]; then
            echo "::notice::${url} は Access のログイン(${location%%\?*})へ 302 で転送されます。"
            exit 0
          fi
          echo "::notice::${url} の応答: ${code:-なし}(${attempt}/${attempts})。"
          if [ "$attempt" -lt "$attempts" ]; then
            sleep "${DEPLOY_WORKER_ACCESS_CHECK_DELAY:-10}"
          fi
        done
        echo "::error::${url} が、ログインなしで Access のログインへ 302 で転送されません(最後の応答: ${code:-なし})。門が開いている可能性があります。インフラのリポジトリの、全 Worker を守る宣言と、この Worker の公開の宣言の有無を見てください。" >&2
        exit 1

    # PR のプレビュー: Worker の version を上げ、その URL を PR の 1 件のコメント
    # (マーカー付き)に上書きで載せる。呼び出し側の job には `pull-requests: write` が必要になる。
    - name: Upload a Worker version and comment its URL
      if: ${{ steps.ready.outputs.registered == 'true' && inputs.mode == 'preview' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        WRANGLER: ${{ inputs.wrangler }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO: ${{ github.repository }}
        WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
      run: |
        set -euo pipefail
        read -ra wrangler <<< "$WRANGLER"
        "${wrangler[@]}" versions upload \
          --preview-alias "pr-${PR_NUMBER}" \
          --message "PR #${PR_NUMBER} ${HEAD_SHA}"
        url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
        test -n "$url" && test "$url" != "null"
        {
          echo "<!-- wrangler-preview -->"
          echo "Preview: ${url}"
          echo
          echo "Commit: ${HEAD_SHA}"
        } > "${RUNNER_TEMP}/preview-comment.md"
        id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
          --jq '[.[] | select(.body | contains("<!-- wrangler-preview -->")) | .id][0] // empty')
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F "body=@${RUNNER_TEMP}/preview-comment.md" > /dev/null
        else
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${RUNNER_TEMP}/preview-comment.md"
        fi

# 呼び出し側の job で宣言する permissions(composite action は宣言できない):
#   contents: read        — checkout と、すべての mode
#   pull-requests: write  — mode: preview だけ(PR にコメントを載せる)
# token を持たせる env は、呼び出し側の job でなく、この action の入力
# (api-token、account-id)に渡す。secret を job 全体の env に置かない。
