name: Self-hosted Renovate

# pipeline-node: renovate-runner
on:
  workflow_call:
    inputs:
      client-id-secret-id:
        required: true
        type: string
      private-key-secret-id:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: true
    secrets:
      bws-access-token:
        required: true

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a private personal caller
        env:
          OWNER: ${{ github.repository_owner }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$OWNER" != "tarotene" || "$PRIVATE" != "true" ]]; then
            echo "This workflow requires a private repository owned by tarotene." >&2
            exit 1
          fi
      - name: Retrieve App credentials
        id: credentials
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.bws-access-token }}
          set_env: false
          secrets: |
            ${{ inputs.client-id-secret-id }} > RENOVATE_CLIENT_ID
            ${{ inputs.private-key-secret-id }} > RENOVATE_PRIVATE_KEY
      - name: Create personal installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.credentials.outputs.RENOVATE_CLIENT_ID }}
          private-key: ${{ steps.credentials.outputs.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Run Renovate
        uses: renovatebot/github-action@d4d64e217662707a793fed3ce8f836e201cd09ee
        with:
          # Renovate 44.190.1, official release job (retrieved 2026-10-28):
          # https://github.com/renovatebot/renovate/actions/runs/40621463231/job/122600939686
          renovate-image: ghcr.io/renovatebot/renovate@sha256:a0d1de588a9bda2e63a8b5b2a7d83eb893ef23aa6d5cb7748c075ff5544d0829
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: 'tarotene/*'
          RENOVATE_BRANCH_PREFIX: 'renovate-self-hosted/'
          RENOVATE_USERNAME: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
