name: Nix

# Path filters scope pushes to inputs that actually affect the build: the
# flake, the home-manager modules, and the literal config files they embed
# via xdg.configFile (plus this workflow itself).
#
# pull_request has NO path filter (unlike push above): these jobs are
# required status checks (pr-gate ruleset, docs/claude/pr-gate.md), and a required
# check that a path filter skips reporting on a docs-only PR leaves that PR's
# Stop gate permanently blocked on a check that will never exist.
on:
  push:
    branches: [ main, "feat/home-manager", "feat/hm-**" ]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "home/**"
      - "config/**"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-migration.toml"
      - "scripts/**"
      - ".github/workflows/nix.yml"
  pull_request:
    # Default activity types are opened/synchronize/reopened only (GitHub
    # Docs, "Events that trigger workflows", 取得 2026-09-25). `labeled` is
    # added so the `ci:full` manual escape hatch (stack-position job below)
    # actually re-triggers this workflow when applied to an already-open PR
    # — without it, labeling a stale-heavy intermediate stage would leave the
    # heavy jobs stuck at their last (skipped) conclusion.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Key the group on the commit SHA so the push and pull_request events for the
# same commit collapse into one run (avoids duplicate, occasionally flaky runs).
concurrency:
  group: nix-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # Stack-aware heavy-CI gate (ADR-468, docs/adr/468-stack-aware-heavy-ci.md,
  # #419). Skipping a JOB via `if:` is safe for required checks in a way that
  # skipping a WORKFLOW via `pull_request.paths` is not: GitHub Docs,
  # "Troubleshooting required status checks" (取得 2026-09-25) — "Successful
  # check statuses are `success`, `skipped`, and `neutral`", whereas a
  # workflow skipped by path/branch filtering leaves its check "Pending"
  # forever and blocks merging. That asymmetry is exactly why `pull_request`
  # above still carries no path filter (comment further up) while this gate
  # uses `needs:`/`if:` on individual jobs instead.
  stack-position:
    runs-on: ubuntu-latest
    name: stack position
    permissions:
      pull-requests: read
    outputs:
      heavy: ${{ steps.judge.outputs.heavy }}
    steps:
      - id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -uo pipefail
          # 判定順: 非 PR イベント → bottom(base==default) → ci:full ラベル
          # → 子 PR 件数(この PR の head を base にした open PR が無ければ
          # tip)。gh api 失敗は fail-open。heavy=false になるのは
          # 「非 bottom かつ非 tip かつ ci:full 無し」の一本道だけ。
          heavy=true
          reason=""
          if [ "$EVENT_NAME" != "pull_request" ]; then
            reason="event=$EVENT_NAME"
          elif [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
            reason="bottom"
          elif case ",$LABELS," in *,ci:full,*) true ;; *) false ;; esac; then
            reason="label ci:full"
          else
            children="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$HEAD_REF&per_page=100" --jq 'length' 2>/dev/null)"
            if [ -z "$children" ]; then
              reason="api-failure (fail-open)"
            elif [ "$children" -eq 0 ]; then
              reason="tip (children=0)"
            else
              heavy=false
              reason="intermediate (children=$children)"
            fi
          fi
          echo "heavy=$heavy ($reason)"
          echo "heavy=$heavy" >>"$GITHUB_OUTPUT"

  flake-check:
    runs-on: ubuntu-latest
    name: nix flake check
    steps:
      - uses: actions/checkout@v4
      # Determinate Systems installer (ADR-0001).
      - uses: DeterminateSystems/nix-installer-action@main
      # NOTE: magic-nix-cache (named in #208) was sunset by Determinate Systems
      # in Feb 2025. We rely on cache.nixos.org substituters here; a FlakeHub
      # cache action can be added later once a token is provisioned.
      #
      # --no-build: `checks.${system}` (flake.nix) maps every host to its
      # activationPackage, so a full `nix flake check` here would rebuild all
      # hosts a second time — build-host below already does that as a
      # matrix. This job stays evaluation-only (module type errors, missing
      # source paths, ...); the real build coverage lives in build-host.
      #
      # --all-systems: darwin (altair, ADR-0018) has no runner here — this is
      # the cheap eval-only check that catches a darwin module type error
      # (e.g. an unguarded Linux-only option) without needing a macOS runner.
      # The corresponding aarch64-darwin build.host matrix row below is the
      # real build coverage for that system.
      - run: nix flake check --all-systems --no-build --print-build-logs

  # The Rust hook/CLI workspace (Cargo.toml, crates/*; ADR-0024, #391).
  # clippy (--deny warnings) and rustfmt run as crane derivations from
  # flake.nix's checks, in the build sandbox. cargo test runs through
  # `nix develop` instead, outside the sandbox: crates/fixture-oracle executes
  # the bash originals (#!/usr/bin/env bash, jq, the rest of the repo tree),
  # and migration-audit reads config/, scripts/ and home/ — neither is
  # available inside a crane derivation's cleaned cargo source.
  rust:
    runs-on: ubuntu-latest
    name: rust workspace
    needs: stack-position
    # `!= 'false'` (not `== 'true'`) + `!cancelled()`: if stack-position
    # itself fails or is cancelled, `needs.*.outputs.heavy` comes back empty,
    # and `needs:`'s own default (skip when a dependency job failed) would
    # otherwise silently turn this into fail-closed — the opposite of the
    # gate's own fail-open branch (ADR-468).
    if: ${{ !cancelled() && needs.stack-position.outputs.heavy != 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build package + clippy + rustfmt (crane)
        run: |
          nix build --print-build-logs --no-link \
            .#checks.x86_64-linux.dotfiles-tools \
            .#checks.x86_64-linux.dotfiles-tools-clippy \
            .#checks.x86_64-linux.dotfiles-tools-fmt
      - name: cargo test (fixture oracles + allowlist audit)
        run: nix develop --command cargo test --workspace --locked

  build-host:
    runs-on: ${{ matrix.runner }}
    name: build ${{ matrix.host }}
    # cache-nix-action's purge-created/purge-last-accessed need `actions:
    # write` on the token to delete caches via the REST API (action README,
    # 取得 2026-09-23) — the repo default (no permissions: block anywhere
    # else in this repo) doesn't grant it, so purge attempts fail with
    # "Resource not accessible by integration" and stale caches accumulate
    # silently. contents: read keeps actions/checkout working.
    permissions:
      contents: read
      actions: write
    needs: stack-position
    # Same fail-open rationale as the `rust` job above.
    if: ${{ !cancelled() && needs.stack-position.outputs.heavy != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: vega
            runner: ubuntu-latest
          - host: arcturus
            runner: ubuntu-latest
          # altair (2022 M2 MacBook Air, aarch64-darwin — ADR-0018).
          # macos-latest is Apple Silicon (M-series, arm64) — matches
          # aarch64-darwin without any cross/emulation concern.
          - host: altair
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # cache.nixos.org never substitutes two classes of package this repo
      # builds: herdr (patches/herdr-worktree-names.patch, ADR-0001
      # Amendment, invalidates the substitutable derivation) and bws
      # (Bitwarden Secrets Manager CLI, unfree — Hydra never builds unfree
      # packages, so no substitutable output can ever exist upstream;
      # vega (the personal host) only, via home/modules/obsidian.nix). Both are
      # permanent per-run costs unless this cache actually retains them.
      #
      # The primary-key hashes home/** and config/** (the same set that
      # gates nix.yml's own `push.paths` above) in addition to the flake
      # inputs, and includes matrix.host: a key that only tracks
      # flake.lock/flake.nix/patches/** stays byte-identical across changes
      # to home/modules/obsidian.nix, so cache-nix-action's own "exact hit
      # on primary-key -> skip saving" rule (nix-community/cache-nix-action
      # README, 取得 2026-09-23) silently discarded every bws build this
      # cache ever produced. A host-scoped key additionally stops
      # vega's bws-bearing closure and arcturus's bws-less closure from
      # overwriting each other under one shared key.
      #
      # A key that changes on every home/** edit is not a regression:
      # restore-prefixes-first-match still restores the nearest prior cache
      # for this host, so bws comes back from the store instead of
      # rebuilding — a key miss is not a cache miss.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.host }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'patches/**', 'home/**', 'config/**', 'Cargo.lock', 'crates/**') }}
          restore-prefixes-first-match: nix-${{ matrix.host }}-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          gc-max-store-size-macos: 1G
          purge: true
          purge-prefixes: nix-${{ matrix.host }}-${{ runner.os }}-
          purge-primary-key: never
          # ISO 8601 durations (nix-community/cache-nix-action README, 取得
          # 2026-09-23: "a non-negative number or a string in the ISO 8601
          # duration format" — plain "30d"/"14d" is neither and was silently
          # treated as an immediate cutoff in testing).
          purge-created: P30D
          purge-last-accessed: P14D
      - name: Build activation package
        run: |
          nix build \
            ".#homeConfigurations.${{ matrix.host }}.activationPackage" \
            --print-build-logs --no-link
      # cache-nix-action does not create GC roots itself (its own README:
      # "users must manage this separately"), so anything without a root is
      # collected before the cache is saved. Rather than hand-listing every
      # non-substitutable package (the herdr-only root here is exactly how
      # bws went unnoticed), derive the set from fact: every store path this
      # runner actually compiled (`ultimate: true`) that the just-built
      # activationPackage or herdr still reference. New non-substitutable
      # packages are covered automatically, with no list to remember to edit.
      #
      # `home-manager-generation` (the activationPackage's own top-level
      # output) is itself always `ultimate: true` — it is host-specific glue,
      # never substitutable — but its closure IS the entire user environment
      # (~8.5 GiB locally). A GC root is closure-transitive by Nix's own
      # semantics, so rooting it verbatim would protect (and upload) the
      # whole environment instead of just bws/herdr. Filter by each
      # candidate's OWN closure size: bws/herdr sit under 100 MiB, the
      # aggregate output sits in the GiB range, so a generous threshold well
      # below "whole environment" and well above "one compiled package"
      # separates them without naming either by hand.
      - name: Root every locally built, non-aggregate path still in the closure
        run: |
          set -euo pipefail
          nix path-info --json --all \
            | jq -r 'to_entries[] | select(.value.ultimate == true) | .key' \
            | sort > /tmp/ultimate.txt
          nix-store -qR \
            "$(nix eval --raw ".#homeConfigurations.${{ matrix.host }}.activationPackage.outPath")" \
            "$(nix eval --raw ".#herdr.outPath")" \
            | sort > /tmp/closure.txt
          mkdir -p /tmp/nix-gcroots
          max_closure_bytes=$((500 * 1024 * 1024))
          i=0
          while read -r p; do
            [ -n "$p" ] || continue
            size=$(nix path-info -S "$p" | awk '{print $2}')
            if [ "$size" -gt "$max_closure_bytes" ]; then
              echo "skipping $p (own closure ${size} bytes, looks like an aggregate output)"
              continue
            fi
            nix-store --add-root "/tmp/nix-gcroots/$i" --indirect --realise "$p" >/dev/null
            i=$((i + 1))
          done < <(comm -12 /tmp/ultimate.txt /tmp/closure.txt)
          echo "rooted $i locally built paths"
