name: PR Title

# PR タイトルを commit-message 契約(ADR-0031, docs/claude/pr-title-contract.md)
# として強制する required check。判定は scripts/pr-title-check 1 本に一元化
# されており、この workflow はその呼び出しに徹する(文法は checker 側にしか
# 存在しない)。
#
# dotfiles 自身は下の pull_request トリガーで直接自己適用する — job 名が
# そのまま required check context "PR title" になる。他リポジトリは
# `workflow_call` からこの workflow を呼ぶ(#325 Stage 5/6、播きの準備)。
# その場合の連結名は「呼び出し側 **job** の name / 呼び出される job の
# name」(呼び出し側 **workflow** の name ではない — telepath#243 で実測、
# 2026-09-26。当初「呼び出し側 workflow の name」という誤った理論で
# ADR-0031 D2 追補を書き、#337 の播きが満たせない required check context
# を作った)。呼び出し側テンプレート(config/claude/skills/
# repo-governance-common/templates/.github/workflows/pr-title.yml)は
# job に `name: PR Title` を固定しているため、連結名は常に
# "PR Title / PR title" になる。末尾の `Validate required-check contexts`
# step がこれを実行時に自己照合する — ADR-0000-rulesets-declaration-in-repo
# により、対象は「PR title」1 context だけでなく、呼び出し元リポジトリの
# `.github/rulesets/quality.json` 宣言および live な required_status_checks
# の全 context に一般化されている。
on:
  workflow_call:
    inputs:
      title:
        description: >-
          検査対象の PR タイトル。省略時はこの workflow を直接トリガーした
          pull_request イベント自身のタイトルを使う(dotfiles 自己適用時の
          既定経路)。他リポジトリから呼ぶ場合は呼び出し側の
          github.event.pull_request.title を明示的に渡す。
        required: false
        type: string
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: PR title
    permissions:
      # merge 設定フィールド(squash_merge_commit_title 等)は GitHub REST API
      # ドキュメント上「contents:read と contents:write の両方」が必要と
      # 明記されている(admin 権限ではない。GITHUB_TOKEN に administration
      # スコープは存在しない)。実測(この workflow 自身の最初の実行、
      # 2026-09-24)で contents:read 単体では該当フィールドがレスポンスから
      # 欠落し、pr-merge-settings-check が誤って全項目 drift と判定した。
      # このジョブは実際には何も書き込まない — 読み取りのためだけに
      # write を要求する GitHub 側の仕様上の制約。
      contents: write
      # 末尾の `Validate required-check contexts` step が自 run の jobs を
      # 読むために必要(scripts/rulesets-context-check、
      # ADR-0000-rulesets-declaration-in-repo、ADR-0031 Amendment
      # 2026-09-26 が対象を PR title 1 本に限っていたのを一般化した)。
      # workflow_call 経由の呼び出しでは、呼び出し側テンプレート
      # の job 側でも同じ scope を明示しないとこの job 自体が
      # startup_failure になる(bleep#33 で実測 — 呼び出し側の permissions
      # 宣言が無いとリポジトリ既定に丸められ、既定が read だと足りない)。
      actions: read
    steps:
      # 文法検査の単一ソース(scripts/pr-title-check)を取得する。dotfiles
      # 自身のトリガー(github.repository == tarotene/dotfiles)では、この
      # PR 自身の head SHA から取得する — pr-title-check 自体を変更する PR
      # を、まだ main に乗っていない版で検査できる(これをしないと main に
      # checker が乗るまでどの自己適用 PR も「ファイルが無い」で fail する
      # 鶏卵問題になる、Stage 3 実装時に実測)。workflow_call 経由の他
      # リポジトリでは常に main の安定版を使う — 呼び出し元の checkout とは
      # 独立させ、判定根拠が全リポジトリで揃うことを保証する。scripts/
      # github-audit / scripts/pr-merge-settings-check(ADR-0031 Amendment、
      # 2026-09-24)も同じ理由でここに含める — pr-merge-settings-check は
      # github-audit の judge_settings() を re-source するため、単独では
      # 動かない。
      - uses: actions/checkout@v4
        with:
          repository: tarotene/dotfiles
          ref: ${{ github.repository == 'tarotene/dotfiles' && github.sha || 'main' }}
          sparse-checkout: |
            scripts/pr-title-check
            scripts/github-audit
            scripts/pr-merge-settings-check
            scripts/rulesets-context-check
          sparse-checkout-cone-mode: false

      - name: Validate PR title
        env:
          TITLE: ${{ inputs.title || github.event.pull_request.title }}
        run: |
          set -euo pipefail
          chmod +x scripts/pr-title-check
          ./scripts/pr-title-check "$TITLE"

      # ADR-0031 Amendment(2026-09-24): PR タイトル契約は「squash merge
      # した結果、PR タイトルがそのまま main の commit subject になる」と
      # いう merge 設定の上に乗った proxy であり、その設定が drift すると
      # 契約全体が無声でバイパスされる(PRIVATE リポで実際に直近 25 PR
      # 全件がバイパスされていた実例、docs/claude/pr-title-contract.md 参照)。
      # ここで前提の生存を required check として検査し、drift を検出では
      # なく防止に変える。GITHUB_TOKEN の contents:write(上記 permissions
      # 参照)で merge 設定フィールドが返ることを実測済み。
      - name: Validate merge settings prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/pr-merge-settings-check
          ./scripts/pr-merge-settings-check "${{ github.repository }}"

      # ADR-0031 Amendment(2026-09-26)で「PR title」1 context に限って
      # 実装した実測照合(#337 の事故の再発防止)を、
      # ADR-0000-rulesets-declaration-in-repo が全 required_status_checks
      # context に一般化した。呼び出し元(caller)リポジトリの
      # `.github/rulesets/quality.json` 宣言と live な branch ruleset の
      # 両方を、この PR の head で実際に報告される job 名(Actions API)と
      # 突合する — 宣言側の不一致は required context が対象リポジトリの
      # 実際のジョブ名と一致しないまま播かれる BLOCKED 事故と同型、live 側の
      # 不一致は #337 の "Expected" 固定事故と同型で、どちらもここで検出する。
      - name: Validate required-check contexts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/rulesets-context-check
          ./scripts/rulesets-context-check \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.event.repository.default_branch }}"
