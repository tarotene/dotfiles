name: PR Title

# PR タイトルを commit-message 契約(ADR-0031, docs/claude/pr-title-contract.md)
# として強制する required check。判定は crates/pr-title-check 1 本に一元化
# されており、この workflow はその呼び出しに徹する(文法は checker 側にしか
# 存在しない)。
#
# ADR-591(docs/adr/591-ci-workflow-naming.md D3)以降、dotfiles 自身は
# `pr-title`(下の第2 job)が `.github/actions/pr-title` composite action
# を直接呼んで自己適用する — connected-name concatenation が構造的に発生
# しない(job 自身の `name: PR title` がそのまま required check context)。
#
# 他リポジトリは、この workflow を `workflow_call` で呼ぶのをやめ、同じ composite
# action を直接呼ぶ(config/claude/skills/repo-governance-common/templates/
# .github/workflows/pr-title.yml)。reusable workflow は必ず「呼び出し側 job の
# name / 呼ばれる job の name」の連結名を作り、その誤解が required check context の
# 不一致事故(#337)を生んだ — composite action にはこの連結が発生しない
# (ADR-591 D3)。移行は全リポジトリで終わったので、旧 `workflow_call` 互換の
# `check` ジョブ(ADR-591 Stage 6)は撤去した。
#
# As a side effect: since this check only fires on pull_request events, it
# will never be reported for direct pushes to __DEFAULT_BRANCH__ — those are
# blocked by the Quality Ruleset's required_status_checks instead (context
# never reported → push rejected). This effectively enforces a PR-only
# workflow.

# pipeline-node: pr-title-check
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # dotfiles 自身の required check(ADR-591 D3)。composite action 自身が
  # `github.repository == 'tarotene/dotfiles'` かを判定して checkout ref
  # を選ぶため(.github/actions/pr-title/action.yml 参照)、この job 側は
  # そこを気にする必要がない。
  pr-title:
    if: github.repository == 'tarotene/dotfiles'
    runs-on: ubuntu-latest
    name: PR title
    permissions:
      contents: write
      actions: read
    steps:
      # ローカルの composite action(`uses: ./...`)を解決するには、その
      # 定義ファイル自体がこのジョブの workspace 上に無ければならない —
      # composite action 自身が行う checkout(tarotene/dotfiles を別
      # ディレクトリへ)とは別に、まずこのリポジトリ自身を素の checkout
      # する必要がある(実測: これを忘れると "Can't find 'action.yml' ...
      # under '.../.github/actions/pr-title'" で startup_failure になる、
      # PR #596)。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/pr-title
        with:
          title: ${{ github.event.pull_request.title }}
