name: CI

# ADR-591(docs/adr/591-ci-workflow-naming.md)がこのリポジトリ自身に
# 移行させた統合 workflow: escape-hatch shell 層のチェック(gitleaks/
# shellcheck/dry-run — 常時実行が要件)と、旧 `.github/workflows/nix.yml`
# の宣言的コア検証(flake 評価・per-host activation build・rust
# workspace)を1本にまとめ、`ci-passed` 集約 job だけを required status
# check にする(個別 job は required から外れる)。macOS(altair)の
# ビルドは advisory として `darwin-build.yml` に分離している —
# `.github/actions/stack-position` を両ファイルで共有する。
on:
  push:
    branches: [ main, "feat/home-manager", "feat/hm-**" ]
  # No branches filter here (unlike push above): these checks are required
  # status checks (pr-gate ruleset, docs/claude/pr-gate.md), and a required check
  # that never gets reported on a stacked PR (base != main/feat/hm-*) leaves
  # that PR's Stop gate permanently blocked on a check that will never exist.
  #
  # `labeled` is added (旧 nix.yml から引き継ぐ) so the `ci:full` manual
  # escape hatch (stack-position job below) actually re-triggers this
  # workflow when applied to an already-open PR — without it, labeling a
  # stale-heavy intermediate stage would leave the heavy jobs stuck at
  # their last (skipped) conclusion.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    name: Secret scan (gitleaks)
    steps:
      # Full history, not just the PR diff: .gitleaks.toml's allowlists are
      # path- and line-regex-based only (no commit allowlist), so they mean the
      # same thing in either scan mode, and the public history is rewritten
      # (orphan, ADR-0004) rather than grown forever — a full scan stays cheap.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Built from the Go module proxy at a pinned version rather than via
      # gitleaks-action (which requires a license key for organization-owned
      # repositories): the module checksum database pins the source, and no
      # secret is needed. Bump the version here deliberately.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install gitleaks v8.30.1
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks git (full history)
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml \
            --redact --no-banner --exit-code 1 .

  shellcheck:
    runs-on: ubuntu-latest
    name: Shell script validation
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck surviving scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          # Scans every remaining shell script (bootstrap.sh + scripts/*.sh +
          # tests/*.sh). The procedural symlink/dev-tool/keybase installers were
          # removed in Phase 4 (#218); scripts/ now mixes home-manager-deployed
          # user-environment tools with true escape-hatch/diagnostic scripts.
          scandir: '.'
          # config/ holds zsh modules and the fcitx5 profile, which shellcheck
          # cannot parse (SC1071). zsh syntax is validated by the step below.
          ignore_paths: config
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      # config/ is excluded above because it holds zsh modules and the fcitx5
      # profile, which shellcheck cannot parse (SC1071).  config/claude/hooks/
      # is genuine bash, though, and it carries the plan-review gate's judge
      # logic, so it gets its own pass with the exclusion lifted.
      - name: ShellCheck Claude Code hooks
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './config/claude/hooks'
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      # config/claude/statusline/ holds claude-statusline.sh and
      # claude-usage.sh, split out of config/claude/hooks/ for source-tree
      # purity (ADR-0007) since neither is a Claude Code hook. Same exclusion
      # reason as the step above, so it gets its own scandir too.
      - name: ShellCheck Claude Code statusline scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './config/claude/statusline'
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      # config/ is excluded above for the same reason as the Claude Code hooks
      # step: config/git/hooks/* is genuine bash (the core.hooksPath pre-push /
      # pre-commit chain), so it gets its own pass with the exclusion lifted.
      - name: ShellCheck git hooks
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './config/git/hooks'
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      # config/codex/hooks/ and config/copilot/hooks/ hold the herdr sidebar
      # metadata reporters for Codex CLI / Copilot CLI panes
      # (docs/claude/herdr-sidebar-metadata.md) — genuine POSIX sh, excluded
      # above for the same reason as the other config/ subdirectories.
      - name: ShellCheck Codex CLI hooks
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './config/codex/hooks'
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      - name: ShellCheck Copilot CLI hooks
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './config/copilot/hooks'
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      - name: Install zsh for syntax validation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Zsh module syntax check
        run: |
          set -euo pipefail
          echo "Checking zsh module syntax..."
          shopt -s nullglob
          fail=0
          for f in config/zsh/modules/*.zsh config/zsh/*.zsh; do
            echo "zsh -n $f"
            if ! zsh -n "$f"; then
              echo "::error file=$f::zsh syntax error"
              fail=1
            fi
          done
          exit "$fail"

  dry-run:
    runs-on: ubuntu-latest
    name: Escape-hatch dry-run
    steps:
      - uses: actions/checkout@v4

      # Every script with a --selftest dispatcher must be invoked from this
      # workflow (#390): a selftest CI never runs is not an oracle, and the Rust
      # migration (ADR-0024, #389) relies on these selftests as its correctness
      # oracle. Any mention of `--selftest` counts: in these directories it
      # only ever appears in files that implement one (bash, POSIX sh, perl,
      # python). `config/claude/skills/*/scripts` (not the whole skills tree)
      # is deliberately scoped to skill code directories — SKILL.md docs
      # elsewhere under config/claude/skills mention `--selftest` in prose
      # without implementing a dispatcher, which would false-positive here.
      - name: Every --selftest is wired into CI
        run: |
          missing=0
          for f in $(grep -rl -- --selftest \
              config/claude/hooks config/claude/statusline config/codex/hooks \
              config/copilot/hooks config/git/hooks config/claude/skills/*/scripts scripts); do
            if ! grep -qF -- "$f --selftest" .github/workflows/ci.yml; then
              echo "::error file=$f::has a --selftest dispatcher but ci.yml never runs it"
              missing=1
            fi
          done
          exit "$missing"

      # stack-position action path gate covers every path the nix code reads
      # (ADR-468 Amendment 2026-09-26, docs/adr/468-stack-aware-heavy-ci.md;
      # moved from nix.yml into .github/actions/stack-position by ADR-591):
      # a change confined to build_host/rust's declared "safe to skip" set
      # can only stay safe as long as flake.nix / home/**/*.nix never start
      # reading a new top-level path without that path being added to the
      # action's `BUILD_INPUTS`/`COPY_ONLY` declarations. This scans every
      # non-comment `../`/`./` relative-path literal in those files, resolves
      # it against the referencing file's own directory, and fails if the
      # resulting top-level repo path is covered by neither list — the same
      # "referenced but not wired in" shape as the --selftest check above.
      # `./.`  (crane's cleanCargoSource taking the whole repo tree as a
      # Cargo source) is a deliberate, explained skip, not a silent one.
      - name: stack-position action path gate covers every path the nix code reads
        run: |
          set -uo pipefail
          build_inputs="$(grep -oP '(?<=BUILD_INPUTS: ")[^"]*' .github/actions/stack-position/action.yml)"
          copy_only="$(grep -oP '(?<=COPY_ONLY: ")[^"]*' .github/actions/stack-position/action.yml)"
          covered="$build_inputs $copy_only"

          fail=0
          while IFS= read -r f; do
            dir="$(dirname "$f")"
            while IFS= read -r tok; do
              [ -n "$tok" ] || continue
              resolved="$(realpath -m --relative-to="$PWD" "$dir/$tok" 2>/dev/null)" || continue
              case "$resolved" in
                .) continue ;;   # ./. — see step comment above
                home|home/*) continue ;;
                ..|../*|/*) continue ;;
              esac
              ok=0
              for c in $covered; do
                case "$c" in
                  */)
                    cdir="${c%/}"
                    case "$resolved" in
                      "$cdir"|"$c"*) ok=1 ;;
                    esac
                    ;;
                  *) [ "$resolved" = "$c" ] && ok=1 ;;
                esac
              done
              if [ "$ok" -eq 0 ]; then
                echo "::error file=$f::references '$tok' (-> $resolved) which stack-position action's BUILD_INPUTS/COPY_ONLY does not cover"
                fail=1
              fi
            done < <(grep -vE '^[[:space:]]*#' "$f" | grep -oE '(\.\./)+[A-Za-z0-9_./-]+|\./[A-Za-z0-9_./-]+')
          done < <(printf '%s\n' flake.nix; find home -name '*.nix')
          exit "$fail"

      - name: bootstrap.sh --dry-run
        run: ./bootstrap.sh --dry-run

      - name: install-packages.sh --dry-run
        run: ./scripts/install-packages.sh --dry-run

      # close-linked-issues.yml (#609): GitHub Actions cannot follow a symlink
      # for a workflow file, so this repo carries a real copy of the template
      # that the governance skills distribute (docs/claude/stacked-pr.md).
      # Keep the two byte-identical.
      - name: close-linked-issues template is in sync
        run: |
          diff -u \
            config/claude/skills/repo-governance-common/templates/.github/workflows/close-linked-issues.yml \
            .github/workflows/close-linked-issues.yml

      # hms.sh (docs/adr/0034-machine-state-wrapper-flake.md Amendment
      # 2026-09-25): private wrapper flake 経由の適用でも、wrapper の
      # flake.lock が古い dotfiles rev を pin していれば override して
      # pushed main を適用する判定ロジックの selftest。ネットワーク不使用
      # (フィクスチャの `nix flake metadata --json` 相当を直接与える)。
      - name: hms.sh --selftest
        run: ./scripts/hms.sh --selftest

      # setup-firewall.sh (ADR-471): the Linux branch is the one this
      # runner can actually exercise; the darwin branch is only shellchecked
      # (above) since ubuntu-latest has no socketfilterfw.
      - name: setup-firewall.sh --dry-run
        run: ./scripts/setup-firewall.sh --dry-run

      # adr-number-check (ADR-380, docs/claude/adr-numbering.md): ADR 番号を
      # 導入 PR の番号にすることで採番衝突を構造的に不可能にする決定の判定
      # エンジン。selftest はネットワーク不使用。pull_request イベントでは
      # base SHA を追加 fetch した上で base 差分限定の判定(1 PR = 最大 1 ADR、
      # PR-number era の番号一致)も走らせる — push イベント(base/PR 番号が
      # 無い)ではリポジトリ全体の判定(重複なし・0000 残存なし・
      # filename==H1・README 索引網羅)のみ。
      - name: adr-number-check --selftest
        run: ./scripts/adr-number-check --selftest

      # check-language-mixing.sh の selftest(ADR-0016 Amendment 2026-10-01):
      # LANG_MIX_PATHS による対象指定と、CJK 統合漢字の範囲指定の回帰を
      # 固定する。ネットワーク不使用。
      - name: check-language-mixing.sh --selftest
        run: bash config/claude/skills/repo-governance-common/templates/scripts/check-language-mixing.sh --selftest

      - name: adr-number-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_SHA" --depth=1
            ./scripts/adr-number-check --base "$BASE_SHA" --pr "$PR_NUMBER"
          else
            ./scripts/adr-number-check
          fi

      # decision-colocation-check (docs/adr/<番号>-decision-colocation.md):
      # 決定成果物(ADR/設計文書/skill)の新規追加、または既存 ADR への
      # `## Amendment` 追加に、その決定を執行する実ファイルの同梱を要求する
      # 判定エンジン。base ref は adr-number-check のステップで既に fetch
      # 済み。push イベント(base が無い)では比較対象が無いため skip する
      # — この検査は PR の diff に対してのみ意味を持つ。
      - name: decision-colocation-check --selftest
        run: ./scripts/decision-colocation-check --selftest

      - name: decision-colocation-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ./scripts/decision-colocation-check --base "$BASE_SHA"
          else
            echo "decision-colocation-check: push イベントには base が無いため skip"
          fi

      # patches/herdr-worktree-names.patch の hololive タレント名配列(worktree
      # 名生成の正本)と config/herdr/oshi-marks.tsv のキー集合を双方向突合する。
      # patch にあって TSV に無い名前は行欠落、TSV にあって patch に無い名前は
      # 死んだエントリ — mark 列が空(未確証)なのは許容するが、行自体の欠落・
      # 余剰は許さない(docs/claude/herdr-sidebar-metadata.md)。
      - name: oshi-marks.tsv matches herdr-worktree-names.patch talent list
        run: |
          set -euo pipefail
          awk '/^\+        "sora"/{f=1} f{print} /"frienda"/{if(f)exit}' \
            patches/herdr-worktree-names.patch \
            | grep -oE '"[a-z]+"' | tr -d '"' | sort -u \
            > /tmp/patch-names.txt
          awk -F'\t' '!/^#/ && NF {print $1}' config/herdr/oshi-marks.tsv \
            | sort -u > /tmp/tsv-names.txt
          missing_in_tsv="$(comm -23 /tmp/patch-names.txt /tmp/tsv-names.txt)"
          extra_in_tsv="$(comm -13 /tmp/patch-names.txt /tmp/tsv-names.txt)"
          fail=0
          if [ -n "$missing_in_tsv" ]; then
            echo "::error::patch にあって oshi-marks.tsv に無い名前: $missing_in_tsv"
            fail=1
          fi
          if [ -n "$extra_in_tsv" ]; then
            echo "::error::oshi-marks.tsv にあって patch に無い名前: $extra_in_tsv"
            fail=1
          fi
          exit "$fail"

      # The key-trace tool's fixtures are the log excerpts quoted in
      # docs/ime-chrome-diagnosis.md, so this step fails if the detector and the
      # document ever disagree about what those traces mean.  It also guards the
      # redaction rules, which are what keep a lock-screen password out of a
      # trace file (see the header comment in the script).  Perl is preinstalled
      # on ubuntu-latest; shellcheck ignores .pl, so the file needs no exclusion.
      - name: fcitx5-key-trace.pl --selftest
        run: perl ./scripts/fcitx5-key-trace.pl --selftest

      # The plan-review gate's acceptance decision is deterministic shell +
      # jq, so it is testable without calling GitHub Copilot CLI. The selftest
      # runs the judge over fixtures and drives the hook end to end against a
      # fake copilot in a throwaway REVIEW_DIR (docs/claude/copilot-plan-review.md).
      - name: copilot-plan-review output schema is valid JSON
        run: jq empty config/claude/assets/copilot-plan-review.schema.json

      - name: copilot-plan-review.sh --selftest
        run: bash ./config/claude/hooks/copilot-plan-review.sh --selftest

      # The wrap-up inbox gate is deterministic shell + jq end to end: the
      # degradation gates, the flock-guarded --add/--mark-filed mutations, and
      # the --check-dup verdict (against a stub gh) are all exercised in a
      # throwaway state dir, plus the SessionStart injection it pairs with
      # (docs/claude/wrapup-inbox.md).
      - name: wrapup-stop-gate.sh --selftest
        run: bash ./config/claude/hooks/wrapup-stop-gate.sh --selftest

      # plan-view only renders and launches, so its selftest drives the hook and
      # CLI paths against a fake browser in a throwaway view dir.  The invariant
      # it guards is that the hook never writes to stdout (anything there would
      # be read as a permissionDecision and would interfere with the approval
      # dialog), plus the CSS ordering that keeps light-theme code readable
      # (docs/claude/plan-view.md).  Cases needing pandoc skip themselves when the
      # runner has none, so this step does not depend on the image's tool list.
      - name: plan-view.sh --selftest
        run: bash ./config/claude/hooks/plan-view.sh --selftest

      # plan-precedent-gate is deterministic shell + jq end to end, no gh/network:
      # the section-vs-exemption-line branch, the per-Dn required-element checks
      # (citation token, retrieval date, diff verdict), and duplicate-Dn
      # detection are all exercised directly against the judge function
      # (docs/adr/0012-precedent-grounding-over-prompted-adversarial-review.md,
      # docs/claude/precedent-grounding.md).
      - name: plan-precedent-gate.sh --selftest
        run: bash ./config/claude/hooks/plan-precedent-gate.sh --selftest

      # plan-scope-gate is deterministic shell + jq end to end, no gh/network
      # (gh is stubbed): 経路A(Issue起点、sub-issues→checkboxフォールバックの
      # 順で子項目を集めて処分の有無を検査)と経路B(`## 要求インベントリ` 内の
      # 各 Rn に処分があるか・タグが妥当か・重複がないか)の両方を、fixtures に
      # 対して直接判定関数へ通す (docs/claude/scope-inventory.md)。
      - name: plan-scope-gate.sh --selftest
        run: bash ./config/claude/hooks/plan-scope-gate.sh --selftest

      # codex-plan-gate (ADR-0032 Amendment #531, docs/claude/
      # codex-plan-gate.md) is Codex's Stop-hook analogue of ExitPlanMode:
      # it detects a `<proposed_plan>` block in the prior assistant message
      # and calls the two gates above against stubbed versions of them —
      # no new judgment logic, no gh/network.
      - name: codex-plan-gate.sh --selftest
        run: bash ./config/codex/hooks/codex-plan-gate.sh --selftest

      # slot-hit.sh is the deterministic judgment core behind the
      # slot-availability skill (docs/claude/slot-availability.md): matching
      # candidate slots against calendar busy/soft-day events, and (finalize)
      # reconciling a decided subset against existing markers into an
      # update/create/delete plan. bash + yq + jq only (no Python runtime —
      # a design revisited via a private person-state repository's own
      # ADR-0010 D13). No network, no filesystem writes other than
      # --out-plan.
      - name: Install yq (single static binary, version-pinned)
        run: |
          wget -q "https://github.com/mikefarah/yq/releases/download/v4.53.2/yq_linux_amd64" \
            -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      - name: slot-hit.sh --selftest
        run: bash ./config/claude/skills/slot-availability/scripts/slot-hit.sh --selftest

      # performance-hub resolves another private person-state repository's
      # path for the performance-planning skill
      # (docs/claude/performance-planning.md, that repository's own
      # ADR-0010). Same marker-file/env-var indirection as writing-style-hub;
      # its selftest is deterministic shell only, isolated from the real
      # $HOME/$XDG_CONFIG_HOME, no network.
      - name: performance-hub --selftest
        run: ./scripts/performance-hub --selftest

      # venue-urls.sh is the deterministic candidate-service enumerator behind
      # the venue-search skill (docs/claude/venue-search.md): reads a fixture
      # state/places.toml, no network, and checks the needs=grand-piano
      # branching (SpaceMarket/Instabase included only then), the
      # registered-only facility filter, and the url:null fallback for an
      # unknown service/system.
      - name: venue-urls.sh --selftest
        run: bash ./config/claude/skills/venue-search/scripts/venue-urls.sh --selftest

      # plan-fresh-gate is deterministic shell + git + jq end to end, no gh/network:
      # the pristine-ff-then-deny path, the dirty/non-pristine no-move path, the
      # branch==base no-move path, the denied-SHA session-state convergence (same
      # SHA re-allows, base advancing re-checks only the increment), the
      # full-path/basename intersection match, and the no-truncation guarantee
      # over a 250-file diff are all exercised against throwaway fixture repos
      # (docs/claude/plan-fresh-gate.md).
      - name: plan-fresh-gate.sh --selftest
        run: bash ./config/claude/hooks/plan-fresh-gate.sh --selftest

      # issue-index is deterministic shell + jq end to end against a stub gh:
      # the git-only/binary-existence gates, the mine→all fallback with its
      # asymmetric failure classification (R2-C-2: "whichever side was
      # adopted" rather than "both failed"), incomplete_results handling
      # (R2-C-1), title sanitization, and the PR-row status distinction are
      # all exercised in a throwaway fixture repo (docs/claude/issue-index.md).
      - name: issue-index.sh --selftest
        run: bash ./config/claude/hooks/issue-index.sh --selftest

      # handoff.sh is deterministic shell + a stubbed gh end to end: labels-missing/
      # create-labels/block, including the issue number → id resolution the
      # dependencies API requires (docs/claude/handoff.md).
      - name: handoff.sh --selftest
        run: bash ./config/claude/skills/handoff/scripts/handoff.sh --selftest

      # routines-plan.sh is deterministic bash + jq end to end, no network:
      # the 7-way classification (in-sync/declared-ahead/live-drift/conflict/
      # suspended/refuse/new), unmanaged-cron detection, and the run-once/
      # webhook rejection (cron_utc required) are all exercised against
      # placeholder fixtures built inline (docs/claude/claude-routines.md).
      - name: routines-plan.sh --selftest
        run: bash ./config/claude/skills/claude-routines/scripts/routines-plan.sh --selftest

      # sign-prewarm is deterministic shell + a stubbed gpg end to end: the
      # cwd-independent global-config gating, the field-15 on-disk/card/stub
      # classification, the warm/cold branch, and the local-override
      # regression (starting from a repo with commit.gpgsign=false locally
      # must not suppress warming when the global value is enabled) are all
      # exercised against a throwaway HOME (docs/claude/sign-prewarm.md).
      - name: sign-prewarm.sh --selftest
        run: bash ./config/claude/hooks/sign-prewarm.sh --selftest

      # gpg-subkey (absorbed from an archived private predecessor tool) is
      # exercised against real GnuPG operations in an isolated
      # GNUPGHOME with a throwaway empty-passphrase fixture key — not a
      # stubbed gpg — since the addkey/revkey --command-file mechanics are
      # exactly what needs validating. Covers generate, rotate --revoke-old,
      # status, remind's threshold/exit-code contract, export's diff
      # detection + next-step message, and sync's drift detection/--fix
      # convergence against GitHub + keys.openpgp.org (`gh`/`curl` are
      # stubbed for sync specifically — this step must never touch a real
      # GitHub account or the real keyserver) (docs/operations.md).
      - name: gpg-subkey --selftest
        run: ./scripts/gpg-subkey --selftest

      # tailscale-prefs (ADR-471) is deterministic shell end to end: the
      # pure build_set_args core (valid/empty/comment/unknown-key/malformed/
      # missing-file cases) plus apply()'s three warn-only skip paths
      # (missing prefs file, tailscale absent from PATH, tailscale present
      # but not logged in via a stub binary) — no network, no real
      # tailscaled involved.
      - name: tailscale-prefs --selftest
        run: ./scripts/tailscale-prefs --selftest

      # A mode here is a *pair* (plan side / execution side), so the interesting
      # failures are combinations: a transition that leaves the other half
      # behind, a .model guard that fires after the write (which is how an
      # "inert" switch silently rewrote every request), a `sync` that drags a
      # deliberate mode back to the default. The catalog is stubbed so the test
      # does not depend on which claude is installed
      # (docs/claude/opusplan-model-aliases.md).
      - name: claude-plan-model --selftest
        run: ./scripts/claude-plan-model --selftest

      # esa-mcp-launcher is deterministic shell end to end against stubbed
      # gpg/npx: the missing-token-file diagnostic, decrypt failure, empty
      # token, missing npx, and the ESA_ACCESS_TOKEN handoff to the exec'd
      # server are exercised without network or real credentials
      # (docs/claude/esa-mcp.md).
      - name: esa-mcp-launcher --selftest
        run: ./scripts/esa-mcp-launcher --selftest

      # ポインタ整合検査(#115): マーカー未設定・存在しないパス・レイアウト
      # 不一致のいずれも無音で失敗せず明示メッセージを出すことを検査する。
      - name: writing-style-hub --selftest
        run: ./scripts/writing-style-hub --selftest

      # ホストローカル・マーカー(host/private-hub/style-hub)の欠落検出器
      # (#368)。実値は書かない、検出のみ。
      - name: dotfiles-doctor --selftest
        run: ./scripts/dotfiles-doctor --selftest

      # obsidian-backup is exercised end to end against stubbed
      # restic/bws/secret-tool/herdr: init/backup/maintenance/restore-test's
      # restic invocations, the unsafe-relative-path rejection, the
      # missing-keyring-token fail-closed path, and the notify_failure
      # warning for herdr's toast-disabled response are all covered without
      # touching a real Backblaze B2 repository or Bitwarden Secrets Manager
      # account (docs/operations.md).
      - name: obsidian-backup --selftest
        run: ./scripts/obsidian-backup --selftest

      # A deleted checkout must be detected without deleting its branch; hook
      # registration must remain idempotent beside Herdr's own Codex hook.
      # git-audit-worktrees/git-prune-worktrees each run two selftest
      # functions internally (upstream-tracking + --evidence/--auto);
      # git-prune-branches --selftest is new here (ADR, auto-prune).
      - name: Worktree lifecycle self-tests
        run: |
          ./scripts/git-audit-worktrees --selftest
          ./scripts/git-prune-worktrees --selftest
          ./scripts/git-prune-branches --selftest
          ./scripts/git-worktree-create-guard --selftest
          ./scripts/register-codex-hooks --selftest
          ./scripts/register-copilot-hooks --selftest

      # Git/worktree PreToolUse and SessionStart hooks plus the parent-checkout
      # freshness timer (#390). Each selftest builds its own throwaway git
      # repositories (or a HERDR_WORKTREES_DIR fixture) — no network involved.
      - name: git-stash-guard.sh --selftest
        run: bash ./config/claude/hooks/git-stash-guard.sh --selftest

      # ADR-0032 Amendment (#531): the Codex adapter sources the engine above
      # and translates Codex's PreToolUse I/O the same way attribution-guard's
      # adapter does.
      - name: git-stash-guard.sh (codex adapter) --selftest
        run: bash ./config/codex/hooks/git-stash-guard.sh --selftest

      - name: git-worktree-allow.sh --selftest
        run: bash ./config/claude/hooks/git-worktree-allow.sh --selftest

      - name: worktree-fresh-base.sh --selftest
        run: bash ./config/claude/hooks/worktree-fresh-base.sh --selftest

      - name: git-checkout-freshness --selftest
        run: ./scripts/git-checkout-freshness --selftest

      # pr-gate is the PR completion barrier (docs/claude/pr-gate.md): its central
      # invariant is "never read an incomplete check set as green" against a
      # stub gh, including the R2 regression where `gh pr checks --watch`
      # exits 0 early on a partial subset (cli/cli#9973) — the selftest
      # re-fetches --json and judges with jq regardless of --watch's exit
      # code, so this step is what actually guards that invariant.
      - name: pr-gate.sh --selftest
        run: bash ./config/claude/hooks/pr-gate.sh --selftest

      # attribution-guard (docs/claude/attribution-guard.md) is deterministic
      # bash end to end against fixture commands — no gh/network involved.
      - name: attribution-guard.sh --selftest
        run: bash ./config/claude/hooks/attribution-guard.sh --selftest

      # The Codex / Copilot adapters (#192) translate each agent's PreToolUse
      # payload and decision output around the shared engine above.
      - name: attribution-guard.sh (codex adapter) --selftest
        run: bash ./config/codex/hooks/attribution-guard.sh --selftest

      - name: attribution-guard.sh (copilot adapter) --selftest
        run: bash ./config/copilot/hooks/attribution-guard.sh --selftest

      # stack-base-guard (ADR-0027, docs/claude/stack-base-guard.md) sources
      # attribution-guard.sh's command-position/tokenizer engine and adds its
      # own gh stub against a throwaway git repo with real commits (ancestry
      # checks need real objects for `git merge-base --is-ancestor`) — no
      # network involved.
      - name: stack-base-guard.sh --selftest
        run: bash ./config/claude/hooks/stack-base-guard.sh --selftest

      # ADR-0027/ADR-0032 Amendment (#531): Codex adapter, same minimalist
      # smoke test as the pr-title-guard/attribution-guard Codex adapters
      # (exhaustive decision coverage stays in the Claude selftest above).
      - name: stack-base-guard.sh (codex adapter) --selftest
        run: bash ./config/codex/hooks/stack-base-guard.sh --selftest

      # decision-colocation-guard (ADR-396, docs/claude/decision-colocation.md)
      # sources attribution-guard.sh's command-position/tokenizer engine the
      # same way stack-base-guard/pr-title-guard do, and stubs the checker
      # binary to exercise base resolution, the escape hatch, and degradation
      # paths without gh/network.
      - name: decision-colocation-guard.sh --selftest
        run: bash ./config/claude/hooks/decision-colocation-guard.sh --selftest

      # pr-title-check (ADR-0031, docs/claude/pr-title-contract.md) is the
      # single-source grammar checker shared by the client guard and the
      # required check below — its selftest is grep + bash string matching
      # end to end, no gh/network involved.
      - name: pr-title-check --selftest
        run: ./scripts/pr-title-check --selftest

      # pr-merge-settings-check (ADR-0031 Amendment, 2026-09-24) sources
      # scripts/github-audit's judge_settings()/fetch_repo_settings() (no
      # new judgement logic) and stubs GH_BIN to exercise the ok/drifted/
      # fetch-failed paths without gh/network.
      - name: pr-merge-settings-check --selftest
        run: ./scripts/pr-merge-settings-check --selftest

      # rulesets-context-check (ADR-0000-rulesets-declaration-in-repo,
      # generalizing ADR-0031 Amendment 2026-09-26's PR-title-only check)
      # sources scripts/github-audit's fetch_head_sha_job_names() (no new
      # judgement logic) and stubs GH_BIN to exercise the match/mismatch/
      # no-declaration/apply-pending/fetch-failed paths without gh/network.
      # Its selftest also cross-checks the repo-governance-common
      # template's job name against all four quality.json seed files and
      # dotfiles' own .github/rulesets/quality.json (the #337 incident's
      # root cause was exactly this pair going out of sync).
      - name: rulesets-context-check --selftest
        run: ./scripts/rulesets-context-check --selftest

      # workflow-naming-check(ADR-591, docs/adr/591-ci-workflow-naming.md):
      # judge_workflows()(scripts/github-audit)を REST API 実測データに
      # 対して呼び出す薄い層。judge_workflows() 自体のロジックテストは
      # github-audit --selftest 側にある — ここは REST→JSON 組み立てと
      # exit code のみを検査する。
      - name: workflow-naming-check --selftest
        run: ./scripts/workflow-naming-check --selftest

      # pr-title-guard (ADR-0031) sources attribution-guard.sh's
      # command-position/tokenizer engine the same way stack-base-guard does,
      # and stubs the checker binary to exercise the owner-scope, escape
      # hatch, and degradation paths without gh/network.
      - name: pr-title-guard.sh --selftest
        run: bash ./config/claude/hooks/pr-title-guard.sh --selftest

      - name: pr-title-guard.sh (codex adapter) --selftest
        run: bash ./config/codex/hooks/pr-title-guard.sh --selftest

      - name: pr-title-guard.sh (copilot adapter) --selftest
        run: bash ./config/copilot/hooks/pr-title-guard.sh --selftest

      # pr-confirm-guard (docs/claude/pr-confirm-guard.md) sources
      # attribution-guard.sh's command-position/tokenizer engine the same way
      # pr-title-guard does. Deterministic bash + jq/awk end to end over
      # fixture PR bodies (unchecked task lists, `## 要確認` Issue refs) —
      # no gh/network involved.
      - name: pr-confirm-guard.sh --selftest
        run: bash ./config/claude/hooks/pr-confirm-guard.sh --selftest

      - name: pr-confirm-guard.sh (codex adapter) --selftest
        run: bash ./config/codex/hooks/pr-confirm-guard.sh --selftest

      # external-send-guard (docs/claude/external-send-guard.md) is
      # deterministic bash + jq end to end against fixture MCP tool_input
      # JSON — no gh/network involved. Covers the self-vs-external address
      # match, cc/bcc leakage, reply's implicit-recipient deny, non-target
      # tools (create_draft, get_thread), case-insensitive matching, and
      # the fail-closed default when self.txt is absent.
      - name: external-send-guard.sh --selftest
        run: bash ./config/claude/hooks/external-send-guard.sh --selftest

      # adr-number.sh (ADR-380, docs/claude/adr-numbering.md) is
      # deterministic bash + jq end to end with gh/adr-number-check both
      # stubbed — no network involved. Covers the early-exit-without-draft
      # path, gh pr create detection at command position, gh pr view
      # failure (no crash), and the non-Bash-tool passthrough.
      - name: adr-number.sh --selftest
        run: bash ./config/claude/hooks/adr-number.sh --selftest

      # feedback-target-guard.sh (ADR-543 段3) is deterministic bash + jq
      # end to end, no network involved — sources attribution-guard.sh for
      # its heredoc-splitting tokenizer the same way adr-number.sh does.
      - name: feedback-target-guard.sh --selftest
        run: bash ./config/claude/hooks/feedback-target-guard.sh --selftest

      # repo-create-guard.sh (ADR-0013 Amendment 2026-09-29) is deterministic
      # bash end to end, no network involved — sources attribution-guard.sh
      # for its command-position tokenizer the same way feedback-target-
      # guard.sh does. Covers gh repo create / gh api -X POST user/repos
      # detection and the settings-PATCH/rulesets-POST/GET-listing pass-
      # through cases (docs/claude/repo-create-guard.md).
      - name: repo-create-guard.sh --selftest
        run: bash ./config/claude/hooks/repo-create-guard.sh --selftest

      # ADR-380/ADR-0032 Amendment (#531): Codex adapter, same minimalist
      # smoke test as the other Codex adapters above.
      - name: adr-number.sh (codex adapter) --selftest
        run: bash ./config/codex/hooks/adr-number.sh --selftest

      # apply-repo-settings.sh (docs/adr/0000-renovate-automerge-shared-
      # preset.md D5b) is deterministic bash end to end against a stubbed
      # gh — covers the default (PATCH + vulnerability-alerts PUT +
      # automated-security-fixes DELETE), --no-dependabot (both Dependabot
      # calls skipped), and --dry-run (no gh api calls at all) paths.
      - name: apply-repo-settings.sh --selftest
        run: bash ./config/claude/skills/repo-governance-common/scripts/apply-repo-settings.sh --selftest

      # github-audit (ADR-0015) is deterministic shell + jq end to end
      # against a stubbed gh (repo list, REST rulesets API, and GraphQL
      # batch): rule-type union judgement, the README/CONTRIBUTING schema
      # and routing checks (ADR-0016), naming class declaration/pattern
      # match (ADR-0014), settings, and renovate applicability — including
      # the regression that clearing overrides makes the same repo fall
      # back to its own (drifted) judgement rather than coincidentally
      # staying green (docs/github-audit.md).
      - name: github-audit --selftest
        run: ./scripts/github-audit --selftest

      # github-app-snapshot (ADR-590 D3): the only
      # script allowed to hold GitHub App PEMs. Its
      # selftest builds a real RS256 JWT with openssl and verifies the
      # signature against a matching pubkey, plus a stubbed-curl/gh
      # snapshot-assembly pass asserting no PEM ever lands in the
      # output JSON — network-free.
      - name: github-app-snapshot --selftest
        run: ./scripts/github-app-snapshot --selftest

      # github-app-registry-check (ADR-436 Amendment 2026-09-30):
      # account-level Manifest ⇔ live-registration drift, reading only the
      # snapshot github-app-snapshot already wrote — no secrets, no
      # network in its selftest.
      - name: github-app-registry-check --selftest
        run: ./scripts/github-app-registry-check --selftest

      # github-rulesets-apply (ADR-0000-rulesets-declaration-in-repo, #153)
      # is a thin multi-repo loop over scripts/apply-rulesets.sh — 対象
      # リポジトリの「型」は引数に取らない(旧: rust/typst/astro/core/
      # dotfiles の 5 型 + 型ごとの apply-rulesets.sh、D4「還元」で撤去)。
      # selftest は apply-rulesets.sh をスタブし、複数 repo ループとフラグ
      # 透過、1 repo の失敗が他を止めないことを検証する。
      - name: github-rulesets-apply --selftest
        run: ./scripts/github-rulesets-apply --selftest

      # apply-rulesets.sh (ADR-0000-rulesets-declaration-in-repo): 任意の
      # リポジトリ自身が持つ宣言(<repo>/.github/rulesets/*.json)を、その
      # リポジトリの live な branch ruleset に適用する。PUT/POST 直前に
      # quality.json の required_status_checks[].context を実測 job 名
      # (Actions API)と突合し、報告不能な context があれば拒否する(D5)。
      # config/claude/skills/*-repo-governance の配布テンプレートはもう
      # apply ロジックを持たず、宣言のコピー(seed)だけを担う。
      - name: apply-rulesets.sh --selftest
        run: ./scripts/apply-rulesets.sh --selftest

      # public-publish-guard's selftest now lives in its own repository
      # (tarotene/bleep, formerly tarotene/publish-guard, ADR-0009) and runs
      # in that repo's own CI — this repo no longer carries the source, so
      # there is nothing to selftest here.

      # claude-usage is not a Claude Code hook (herdr's tab_bar_right command
      # runs it) but lives in config/claude/statusline/ alongside
      # claude-statusline.sh, covered by the shellcheck step above.
      # The selftest exercises label mapping over limits[], the burn-rate
      # prediction (endpoint slope, min-span, reset-crossing), series reset on
      # resets_at change / percent drop, and the token-never-leaks assertion —
      # all against fixtures and a stubbed curl, without network or real
      # credentials (docs/claude/claude-usage.md).
      - name: claude-usage.sh --selftest
        run: sh ./config/claude/statusline/claude-usage.sh --selftest

      # The Claude and Codex Herdr metadata producers read their JSON payload
      # through a shared parse_payload() shape.  They used to read a single-line
      # `@tsv` row with one `read`, which silently collapsed consecutive tabs
      # (a tab is IFS whitespace in POSIX) and shifted every field by one as
      # soon as an optional field was empty — that is what killed $branch and
      # $oshi on every Claude pane (#305).  Each selftest feeds synthetic
      # payloads with missing/empty optional fields and asserts the
      # field-to-variable mapping, so the regression cannot come back quietly.
      - name: herdr-claude-metadata.sh --selftest
        run: sh ./config/claude/hooks/herdr-claude-metadata.sh --selftest

      - name: herdr-codex-metadata.sh --selftest
        run: sh ./config/codex/hooks/herdr-codex-metadata.sh --selftest

      # The Copilot producer gets its action from argv and its model from
      # ~/.copilot/settings.json (no event/model in the payload), so its
      # selftest covers the action filter, cwd extraction, settings read, and
      # the worktree-name -> oshi-mark lookup instead.
      - name: herdr-copilot-metadata.sh --selftest
        run: sh ./config/copilot/hooks/herdr-copilot-metadata.sh --selftest

      - name: claude-statusline.sh --selftest
        run: sh ./config/claude/statusline/claude-statusline.sh --selftest

      # Build a fixture package so the dry-run really reads package metadata
      # with dpkg-deb.  Pointing --package at a path that does not exist made
      # this step pass without validating anything.  The runner is not
      # arcturus, so the host checks warn instead of failing.
      - name: install-falcon-sensor.sh --dry-run
        run: |
          fixture="$(mktemp -d)/falcon-sensor"
          mkdir -p "$fixture/DEBIAN"
          printf '%s\n' \
            'Package: falcon-sensor' \
            'Version: 0.0.0-ci' \
            'Architecture: amd64' \
            'Maintainer: ci <ci@example.invalid>' \
            'Description: CI fixture for the company-provided package' \
            > "$fixture/DEBIAN/control"
          dpkg-deb -b "$fixture" /tmp/falcon-sensor.deb
          ./scripts/install-falcon-sensor.sh \
            --dry-run \
            --package /tmp/falcon-sensor.deb

      - name: install-falcon-sensor.sh --dry-run rejects a missing package
        run: |
          if ./scripts/install-falcon-sensor.sh \
               --dry-run --package /tmp/does-not-exist.deb; then
            echo "::error::dry-run accepted a missing package"
            exit 1
          fi

  # 以下、旧 .github/workflows/nix.yml から ADR-591 で統合した4 job
  # (stack-position/flake-check/rust/build-host)。ジョブ本体は変更なし
  # (stack-position の判定ロジックのみ .github/actions/stack-position
  # へ抽出)。

  stack-position:
    runs-on: ubuntu-latest
    name: Stack position
    permissions:
      pull-requests: read
    outputs:
      build_host: ${{ steps.judge.outputs.build_host }}
      rust: ${{ steps.judge.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: judge
        uses: ./.github/actions/stack-position

  flake-check:
    runs-on: ubuntu-latest
    name: Nix flake check
    steps:
      - uses: actions/checkout@v4
      # Determinate Systems installer (ADR-0001).
      - uses: DeterminateSystems/nix-installer-action@main
      # NOTE: magic-nix-cache (named in #208) was sunset by Determinate Systems
      # in Feb 2025. We rely on cache.nixos.org substituters here; a FlakeHub
      # cache action can be added later once a token is provisioned.
      #
      # --no-build: `checks.${system}` (flake.nix) maps every host to its
      # activationPackage, so a full `nix flake check` here would rebuild all
      # hosts a second time — build-host below already does that as a
      # matrix. This job stays evaluation-only (module type errors, missing
      # source paths, ...); the real build coverage lives in build-host.
      #
      # --all-systems: darwin (altair, ADR-0018) has no runner here — this is
      # the cheap eval-only check that catches a darwin module type error
      # (e.g. an unguarded Linux-only option) without needing a macOS runner.
      # The corresponding aarch64-darwin build.host matrix row lives in
      # darwin-build.yml (advisory) and is the real build coverage for that
      # system.
      - run: nix flake check --all-systems --no-build --print-build-logs

      # docs/adr/0000-renovate-automerge-shared-preset.md D4: the shared
      # preset (renovate/policy.json) and this repo's own renovate.json
      # (which extends it) are the only Renovate config in this repo — the
      # governance skill templates are structurally similar but not valid
      # standalone config (they carry placeholder tokens), so they are not
      # validated here. --no-global tells the validator these are repo
      # config files, not a self-hosted global config; --strict also fails
      # on migration warnings (e.g. a deprecated option).
      - run: |
          nix shell --inputs-from . nixpkgs#renovate -c \
            renovate-config-validator --strict --no-global \
              renovate/policy.json renovate.json

  # The Rust hook/CLI workspace (Cargo.toml, crates/*; ADR-0024, #391).
  # clippy (--deny warnings) and rustfmt run as crane derivations from
  # flake.nix's checks, in the build sandbox. cargo test runs through
  # `nix develop` instead, outside the sandbox: crates/fixture-oracle executes
  # the bash originals (#!/usr/bin/env bash, jq, the rest of the repo tree),
  # and migration-audit reads config/, scripts/ and home/ — neither is
  # available inside a crane derivation's cleaned cargo source.
  rust:
    runs-on: ubuntu-latest
    name: Rust workspace
    needs: stack-position
    # `!= 'false'` (not `== 'true'`) + `!cancelled()`: if stack-position
    # itself fails or is cancelled, `needs.*.outputs.rust` comes back empty,
    # and `needs:`'s own default (skip when a dependency job failed) would
    # otherwise silently turn this into fail-closed — the opposite of the
    # gate's own fail-open branch (ADR-468).
    if: ${{ !cancelled() && needs.stack-position.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build package + clippy + rustfmt (crane)
        run: |
          nix build --print-build-logs --no-link \
            .#checks.x86_64-linux.dotfiles-tools \
            .#checks.x86_64-linux.dotfiles-tools-clippy \
            .#checks.x86_64-linux.dotfiles-tools-fmt
      - name: cargo test (fixture oracles + allowlist audit)
        run: nix develop --command cargo test --workspace --locked

  build-host:
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.host }}
    # cache-nix-action's purge-created/purge-last-accessed need `actions:
    # write` on the token to delete caches via the REST API (action README,
    # 取得 2026-09-23) — the repo default (no permissions: block anywhere
    # else in this repo) doesn't grant it, so purge attempts fail with
    # "Resource not accessible by integration" and stale caches accumulate
    # silently. contents: read keeps actions/checkout working.
    permissions:
      contents: read
      actions: write
    needs: stack-position
    # Same fail-open rationale as the `rust` job above.
    if: ${{ !cancelled() && needs.stack-position.outputs.build_host != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: vega
            runner: ubuntu-latest
          - host: arcturus
            runner: ubuntu-latest
          # altair (2022 M2 MacBook Air, aarch64-darwin — ADR-0018) builds
          # in darwin-build.yml instead (advisory, ADR-591 Q13: dotfiles'
          # own required checks stay Linux-only so a bottleneck in the
          # shared macOS runner queue never blocks a merge).
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # cache.nixos.org never substitutes two classes of package this repo
      # builds: herdr (patches/herdr-worktree-names.patch, ADR-0001
      # Amendment, invalidates the substitutable derivation) and bws
      # (Bitwarden Secrets Manager CLI, unfree — Hydra never builds unfree
      # packages, so no substitutable output can ever exist upstream;
      # vega (the personal host) only, via home/modules/obsidian.nix). Both are
      # permanent per-run costs unless this cache actually retains them.
      #
      # The primary-key hashes home/** and config/** (the same set that
      # gates nix.yml's own `push.paths` above) in addition to the flake
      # inputs, and includes matrix.host: a key that only tracks
      # flake.lock/flake.nix/patches/** stays byte-identical across changes
      # to home/modules/obsidian.nix, so cache-nix-action's own "exact hit
      # on primary-key -> skip saving" rule (nix-community/cache-nix-action
      # README, 取得 2026-09-23) silently discarded every bws build this
      # cache ever produced. A host-scoped key additionally stops
      # vega's bws-bearing closure and arcturus's bws-less closure from
      # overwriting each other under one shared key.
      #
      # A key that changes on every home/** edit is not a regression:
      # restore-prefixes-first-match still restores the nearest prior cache
      # for this host, so bws comes back from the store instead of
      # rebuilding — a key miss is not a cache miss.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.host }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'patches/**', 'home/**', 'config/**', 'Cargo.lock', 'crates/**') }}
          restore-prefixes-first-match: nix-${{ matrix.host }}-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          gc-max-store-size-macos: 1G
          purge: true
          purge-prefixes: nix-${{ matrix.host }}-${{ runner.os }}-
          purge-primary-key: never
          # ISO 8601 durations (nix-community/cache-nix-action README, 取得
          # 2026-09-23: "a non-negative number or a string in the ISO 8601
          # duration format" — plain "30d"/"14d" is neither and was silently
          # treated as an immediate cutoff in testing).
          purge-created: P30D
          purge-last-accessed: P14D
      - name: Build activation package
        run: |
          nix build \
            ".#homeConfigurations.${{ matrix.host }}.activationPackage" \
            --print-build-logs --no-link
      # #602: the Codex/Copilot adapters `source` the Claude hook engines.
      # Running their --selftest from the source tree cannot catch a broken
      # source path, because there ../../claude/hooks exists; in the deployed
      # home-files layout it does not (~/.codex/hooks vs ~/.claude/hooks are
      # flat siblings). Run them from the built activationPackage with HOME
      # pointed at its home-files, i.e. the deployed shape.
      - name: Adapter selftests in the deployed layout
        run: |
          set -euo pipefail
          out="$(nix build \
            ".#homeConfigurations.${{ matrix.host }}.activationPackage" \
            --no-link --print-out-paths)"
          for f in "$out"/home-files/.codex/hooks/*.sh "$out"/home-files/.copilot/hooks/*.sh; do
            [ -e "$f" ] || continue
            echo "== $f"
            # PATH gets the deployed ~/.local/bin too: pr-title-guard's
            # adapters resolve `pr-title-check` from there (the source-tree
            # relative candidate does not exist in this layout).
            HOME="$out/home-files" PATH="$out/home-files/.local/bin:$PATH" bash "$f" --selftest
          done
      # #604: the flake.lock pin of `bleep` decides which hook is deployed,
      # but nothing exercised the *deployed* artifacts (the bash body under
      # .claude/hooks/bleep/ plus the crane-built .claude/hooks/bleep-hook),
      # so a stale pin — the pre-bump one read only `gh -R X issue create`,
      # and knew nothing of unresolved shell variables — went unnoticed.
      # Feed the deployed hook the same env the registered command sets
      # (bleepEnvPrefix in home/modules/claude.nix) with an isolated
      # denylist and a stub gh (every repo a private cwd, except pub/repo).
      - name: Deployed bleep hook canary
        run: |
          set -euo pipefail
          out="$(nix build \
            ".#homeConfigurations.${{ matrix.host }}.activationPackage" \
            --no-link --print-out-paths)"
          H="$out/home-files/.claude/hooks"
          T="$(mktemp -d)"
          mkdir -p "$T/config" "$T/state" "$T/cwd"
          printf 'acme\n' > "$T/config/orgs.txt"
          printf 'acme/secret-project\n' > "$T/config/repos.txt"
          cat > "$T/bin-gh" <<'STUB'
          #!/usr/bin/env bash
          case "$1 $2" in
            "repo list") printf 'my-private-tool\n' ;;
            "repo view") if [[ "$*" == *pub/repo* ]]; then printf 'PUBLIC'; else printf 'PRIVATE'; fi ;;
            "api user") printf 'test-owner' ;;
            *) exit 1 ;;
          esac
          STUB
          chmod +x "$T/bin-gh"
          decide() {
            (cd "$T/cwd" && \
              BLEEP_HOOK_BIN="$H/bleep-hook" BLEEP_LEX_BIN="$H/bleep-hook" \
              BLEEP_CONFIG_DIR="$T/config" BLEEP_STATE_DIR="$T/state" \
              BLEEP_ORGS_FILE="$T/config/orgs.txt" BLEEP_REPOS_FILE="$T/config/repos.txt" \
              BLEEP_OWNER=test-owner BLEEP_GH_BIN="$T/bin-gh" BLEEP_LEDGER_DIR="$T/ledger" \
              bash "$H/bleep/hooks/bleep.sh" --host=claude <<<"$1") \
              | sed -n 's/.*"permissionDecision":"\([a-z]*\)".*/\1/p'
          }
          fail=0
          expect() { # $1=label $2=expected decision ("" = pass) $3=hook input JSON
            got="$(decide "$3")"
            if [ "$got" = "$2" ]; then echo "ok   $1 -> ${got:-pass}"; else
              echo "::error::canary '$1': expected '${2:-pass}', got '${got:-pass}'"; fail=1; fi
          }
          expect "gh -R before subcommand" deny '{"tool_name":"Bash","tool_input":{"command":"gh -R pub/repo issue create --title t --body \"acme/secret-project\""}}'
          expect "gh -R after subcommand" deny '{"tool_name":"Bash","tool_input":{"command":"gh issue create -R pub/repo --title t --body \"acme/secret-project\""}}'
          expect "gh --repo after subcommand" deny '{"tool_name":"Bash","tool_input":{"command":"gh pr create --repo pub/repo --title t --body \"acme/secret-project\""}}'
          expect "MCP GitHub post" deny '{"tool_name":"mcp__github__create_issue","tool_input":{"owner":"pub","repo":"repo","title":"t","body":"acme/secret-project"}}'
          expect "unresolved shell variable" ask '{"tool_name":"Bash","tool_input":{"command":"gh issue create -R $TARGET --title t --body x"}}'
          expect "unrelated command" "" '{"tool_name":"Bash","tool_input":{"command":"ls -la"}}'
          exit $fail
      # cache-nix-action does not create GC roots itself (its own README:
      # "users must manage this separately"), so anything without a root is
      # collected before the cache is saved. Rather than hand-listing every
      # non-substitutable package (the herdr-only root here is exactly how
      # bws went unnoticed), derive the set from fact: every store path this
      # runner actually compiled (`ultimate: true`) that the just-built
      # activationPackage or herdr still reference. New non-substitutable
      # packages are covered automatically, with no list to remember to edit.
      #
      # `home-manager-generation` (the activationPackage's own top-level
      # output) is itself always `ultimate: true` — it is host-specific glue,
      # never substitutable — but its closure IS the entire user environment
      # (~8.5 GiB locally). A GC root is closure-transitive by Nix's own
      # semantics, so rooting it verbatim would protect (and upload) the
      # whole environment instead of just bws/herdr. Filter by each
      # candidate's OWN closure size: bws/herdr sit under 100 MiB, the
      # aggregate output sits in the GiB range, so a generous threshold well
      # below "whole environment" and well above "one compiled package"
      # separates them without naming either by hand.
      - name: Root every locally built, non-aggregate path still in the closure
        run: |
          set -euo pipefail
          nix path-info --json --all \
            | jq -r 'to_entries[] | select(.value.ultimate == true) | .key' \
            | sort > /tmp/ultimate.txt
          nix-store -qR \
            "$(nix eval --raw ".#homeConfigurations.${{ matrix.host }}.activationPackage.outPath")" \
            "$(nix eval --raw ".#herdr.outPath")" \
            | sort > /tmp/closure.txt
          mkdir -p /tmp/nix-gcroots
          max_closure_bytes=$((500 * 1024 * 1024))
          i=0
          while read -r p; do
            [ -n "$p" ] || continue
            size=$(nix path-info -S "$p" | awk '{print $2}')
            if [ "$size" -gt "$max_closure_bytes" ]; then
              echo "skipping $p (own closure ${size} bytes, looks like an aggregate output)"
              continue
            fi
            nix-store --add-root "/tmp/nix-gcroots/$i" --indirect --realise "$p" >/dev/null
            i=$((i + 1))
          done < <(comm -12 /tmp/ultimate.txt /tmp/closure.txt)
          echo "rooted $i locally built paths"

  # 集約 required check(ADR-591)。上の job を1つでも追加・削除したら
  # needs: をここで同期させること — workflow-naming-check(tarotene/
  # dotfiles 自身の composite action 経由、この PR で新規配線)が
  # この不変条件を機械検査する。
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [gitleaks, shellcheck, dry-run, stack-position, flake-check, rust, build-host]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
