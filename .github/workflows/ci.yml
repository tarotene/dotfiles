name: CI

# ADR-591(docs/adr/591-ci-workflow-naming.md)がこのリポジトリ自身に
# 移行させた統合 workflow: escape-hatch shell 層のチェック(gitleaks/
# shellcheck/dry-run — 常時実行が要件)と、旧 `.github/workflows/nix.yml`
# の宣言的コア検証(flake 評価・per-host activation build・rust
# workspace)を1本にまとめ、`ci-passed` 集約 job だけを required status
# check にする(個別 job は required から外れる)。macOS(altair)の
# ビルドは advisory として `darwin-build.yml` に分離している —
# `.github/actions/stack-position` を両ファイルで共有する。
# pipeline-node: ci
on:
  push:
    branches: [ main, "feat/home-manager", "feat/hm-**" ]
  # No branches filter here (unlike push above): these checks are required
  # status checks (pr-gate ruleset, docs/agents/pr-gate.md), and a required check
  # that never gets reported on a stacked PR (base != main/feat/hm-*) leaves
  # that PR's Stop gate permanently blocked on a check that will never exist.
  #
  # `labeled` is added (旧 nix.yml から引き継ぐ) so the `ci:full` manual
  # escape hatch (stack-position job below) actually re-triggers this
  # workflow when applied to an already-open PR — without it, labeling a
  # stale-heavy intermediate stage would leave the heavy jobs stuck at
  # their last (skipped) conclusion.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  codex-review-diff:
    name: Codex review diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- crates/codex-launcher/reviewed.toml; then
            echo 'value=false' >> "$GITHUB_OUTPUT"
          else
            echo 'value=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Generate complete upstream review diff
        if: steps.changed.outputs.value == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          manifest=crates/codex-launcher/reviewed.toml
          git show "$BASE_SHA:$manifest" > /tmp/codex-old.toml 2>/dev/null || cp "$manifest" /tmp/codex-old.toml
          python3 - <<'PY' > /tmp/codex-revisions
          import re, tomllib
          for path in ('/tmp/codex-old.toml', 'crates/codex-launcher/reviewed.toml'):
              with open(path, 'rb') as f:
                  data = tomllib.load(f)
              assert re.fullmatch(r'rust-v\d+\.\d+\.\d+', data['release'])
              assert re.fullmatch(r'[a-f0-9]{40}', data['commit'])
              print(data['release'], data['commit'])
          PY
          read -r old_tag old_commit < /tmp/codex-revisions
          read -r new_tag new_commit < <(tail -n 1 /tmp/codex-revisions)
          git init -q /tmp/codex-source
          git -C /tmp/codex-source remote add origin https://github.com/openai/codex.git
          git -C /tmp/codex-source fetch --quiet --depth=1 origin "$old_commit" "$new_commit" "refs/tags/$new_tag:refs/tags/$new_tag"
          test "$(git -C /tmp/codex-source rev-parse "$new_tag^{commit}")" = "$new_commit"
          mkdir -p /tmp/codex-review
          printf 'Old: %s %s\nNew: %s %s\n' "$old_tag" "$old_commit" "$new_tag" "$new_commit" > /tmp/codex-review/revisions.txt
          git -C /tmp/codex-source diff --no-ext-diff "$old_commit" "$new_commit" -- codex-rs scripts/install > /tmp/codex-review/upstream.diff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.changed.outputs.value == 'true'
        with:
          name: codex-upstream-review
          path: /tmp/codex-review/

  gitleaks:
    runs-on: ubuntu-latest
    name: Secret scan (gitleaks)
    steps:
      # Full history, not just the PR diff: .gitleaks.toml's allowlists are
      # path- and line-regex-based only (no commit allowlist), so they mean the
      # same thing in either scan mode, and the public history is rewritten
      # (orphan, ADR-0004) rather than grown forever — a full scan stays cheap.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Built from the Go module proxy at a pinned version rather than via
      # gitleaks-action (which requires a license key for organization-owned
      # repositories): the module checksum database pins the source, and no
      # secret is needed. Bump the version here deliberately.
      # `cache: false`: this repository has no go.mod, and a single
      # `go install` has nothing worth caching — setup-go's default cache
      # only logs "Dependencies file is not found" as a warning.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
          cache: false

      - name: Install gitleaks v8.30.1
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks git (full history)
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml \
            --redact --no-banner --exit-code 1 .

  shellcheck:
    runs-on: ubuntu-latest
    name: Shell script validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck surviving scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          # Scans every remaining shell script (bootstrap.sh + scripts/*.sh +
          # tests/*.sh). The procedural symlink/dev-tool/keybase installers were
          # removed in Phase 4 (#218); scripts/ now mixes home-manager-deployed
          # user-environment tools with true escape-hatch/diagnostic scripts.
          scandir: '.'
          # config/ holds zsh modules and the fcitx5 profile, which shellcheck
          # cannot parse (SC1071). zsh syntax is validated by the step below.
          ignore_paths: config
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      # config/ is excluded above because it holds zsh modules and the fcitx5
      # profile, which shellcheck cannot parse (SC1071).  config/claude/hooks/
      # is genuine bash, though, and it carries the plan-review gate's judge
      # logic, so it gets its own pass with the exclusion lifted.
      - name: ShellCheck Claude Code hooks
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './config/claude/hooks'
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      # config/ is excluded above for the same reason as the Claude Code hooks
      # step: config/git/hooks/* is genuine bash (the core.hooksPath pre-push /
      # pre-commit chain), so it gets its own pass with the exclusion lifted.
      - name: ShellCheck git hooks
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './config/git/hooks'
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      # config/codex/hooks/ and config/copilot/hooks/ hold the Codex CLI /
      # Copilot CLI hook adapters (the herdr sidebar metadata reporters that
      # used to live here are Rust since #413, crates/herdr-agent-metadata),
      # excluded above for the same reason as the other config/ subdirectories.
      # The Stage 4d hooks/statusline removed from the selftest steps below
      # (#413) run as `cargo test --workspace` in the `rust` job below.
      - name: ShellCheck Codex CLI hooks
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './config/codex/hooks'
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      - name: ShellCheck Copilot CLI hooks
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './config/copilot/hooks'
          severity: error
        env:
          SHELLCHECK_OPTS: -e SC1091

      - name: Install zsh for syntax validation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Zsh module syntax check
        run: |
          set -euo pipefail
          echo "Checking zsh module syntax..."
          shopt -s nullglob
          fail=0
          for f in config/zsh/modules/*.zsh config/zsh/*.zsh; do
            echo "zsh -n $f"
            if ! zsh -n "$f"; then
              echo "::error file=$f::zsh syntax error"
              fail=1
            fi
          done
          exit "$fail"

      # nixGL ラッパーが退避した GL の変数を、対話シェルが戻すモジュールの挙動(#851、
      # ADR-0006 Amendment 2026-10-21)。ネットワーク不使用。
      - name: nixgl-restore module test
        run: zsh config/zsh/tests/nixgl-restore.test.zsh

  dry-run:
    runs-on: ubuntu-latest
    name: Escape-hatch dry-run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every script with a --selftest dispatcher must be invoked from this
      # workflow (#390): a selftest CI never runs is not an oracle, and the Rust
      # migration (ADR-0024, #389) relies on these selftests as its correctness
      # oracle. Any mention of `--selftest` counts: in these directories it
      # only ever appears in files that implement one (bash, POSIX sh, perl,
      # python). `config/agents/skills/*/scripts` (not the whole skills tree)
      # is deliberately scoped to skill code directories — SKILL.md docs
      # elsewhere under config/claude/skills mention `--selftest` in prose
      # without implementing a dispatcher, which would false-positive here.
      - name: Every --selftest is wired into CI
        run: |
          missing=0
          for f in $(grep -rl -- --selftest \
              config/claude/hooks config/codex/hooks \
              config/copilot/hooks config/git/hooks config/agents/skills/*/scripts scripts); do
            if ! grep -qF -- "$f --selftest" .github/workflows/ci.yml; then
              echo "::error file=$f::has a --selftest dispatcher but ci.yml never runs it"
              missing=1
            fi
          done
          exit "$missing"

      # stack-position action path gate covers every path the nix code reads
      # (ADR-468 Amendment 2026-09-26, docs/adr/468-stack-aware-heavy-ci.md;
      # moved from nix.yml into .github/actions/stack-position by ADR-591):
      # a change confined to build_host/rust's declared "safe to skip" set
      # can only stay safe as long as flake.nix / home/**/*.nix never start
      # reading a new top-level path without that path being added to the
      # action's `BUILD_INPUTS`/`COPY_ONLY` declarations. This scans every
      # non-comment `../`/`./` relative-path literal in those files, resolves
      # it against the referencing file's own directory, and fails if the
      # resulting top-level repo path is covered by neither list — the same
      # "referenced but not wired in" shape as the --selftest check above.
      # `./.`  (crane's cleanCargoSource taking the whole repo tree as a
      # Cargo source) is a deliberate, explained skip, not a silent one.
      - name: stack-position action path gate covers every path the nix code reads
        run: |
          set -uo pipefail
          build_inputs="$(grep -oP '(?<=BUILD_INPUTS: ")[^"]*' .github/actions/stack-position/action.yml)"
          copy_only="$(grep -oP '(?<=COPY_ONLY: ")[^"]*' .github/actions/stack-position/action.yml)"
          covered="$build_inputs $copy_only"

          fail=0
          while IFS= read -r f; do
            dir="$(dirname "$f")"
            while IFS= read -r tok; do
              [ -n "$tok" ] || continue
              resolved="$(realpath -m --relative-to="$PWD" "$dir/$tok" 2>/dev/null)" || continue
              case "$resolved" in
                .) continue ;;   # ./. — see step comment above
                home|home/*) continue ;;
                ..|../*|/*) continue ;;
              esac
              ok=0
              for c in $covered; do
                case "$c" in
                  */)
                    cdir="${c%/}"
                    case "$resolved" in
                      "$cdir"|"$c"*) ok=1 ;;
                    esac
                    ;;
                  *) [ "$resolved" = "$c" ] && ok=1 ;;
                esac
              done
              if [ "$ok" -eq 0 ]; then
                echo "::error file=$f::references '$tok' (-> $resolved) which stack-position action's BUILD_INPUTS/COPY_ONLY does not cover"
                fail=1
              fi
            done < <(grep -vE '^[[:space:]]*#' "$f" | grep -oE '(\.\./)+[A-Za-z0-9_./-]+|\./[A-Za-z0-9_./-]+')
          done < <(printf '%s\n' flake.nix; find home -name '*.nix')
          exit "$fail"

      - name: bootstrap.sh --dry-run
        run: ./bootstrap.sh --dry-run

      - name: bootstrap.sh --selftest
        run: ./bootstrap.sh --selftest

      - name: install-packages.sh --dry-run
        run: ./scripts/install-packages.sh --dry-run

      # close-linked-issues.yml (#609): GitHub Actions cannot follow a symlink
      # for a workflow file, so this repo carries a real copy of the template
      # that the governance skills distribute (docs/agents/stacked-pr.md).
      # Keep the two byte-identical, except for this repo's own `pipeline-node:`
      # pointer line (ADR-872): the template is distributed to other repos, so
      # the pointer to this repo's pipeline-map.toml lives only in the copy.
      - name: close-linked-issues template is in sync
        run: |
          diff -u \
            <(grep -v '^# pipeline-node:' config/agents/skills/repo-governance-common/templates/.github/workflows/close-linked-issues.yml) \
            <(grep -v '^# pipeline-node:' .github/workflows/close-linked-issues.yml)

      # kiriban.yml (docs/kiriban.md): same reason as close-linked-issues above —
      # the governance skills distribute the template (symlinked per type), this
      # repo carries a real copy, and only the `pipeline-node:` pointer differs.
      - name: kiriban template is in sync
        run: |
          diff -u \
            <(grep -v '^# pipeline-node:' config/agents/skills/repo-governance-common/templates/.github/workflows/kiriban.yml) \
            <(grep -v '^# pipeline-node:' .github/workflows/kiriban.yml)

      # hms (docs/adr/0034-machine-state-wrapper-flake.md Amendment
      # 2026-09-25) is Rust now (#414, ADR-0024 Stage 4e, crates/hms); the
      # wrapper-lock override / local-routing / downgrade-guard judgments
      # and the stubbed-PATH apply flow run as `cargo test --workspace` in
      # the rust job. No network (nix/home-manager/systemctl are stubs).

      # setup-firewall.sh (ADR-471): the Linux branch is the one this
      # runner can actually exercise; the darwin branch is only shellchecked
      # (above) since ubuntu-latest has no socketfilterfw.
      - name: setup-firewall.sh --dry-run
        run: ./scripts/setup-firewall.sh --dry-run

      # adr-number-check (ADR-380, docs/agents/adr-numbering.md): ADR 番号を
      # 導入 PR の番号にすることで採番衝突を構造的に不可能にする決定の判定
      # エンジン。selftest はネットワーク不使用。pull_request イベントでは
      # base SHA を追加 fetch した上で base 差分限定の判定(1 PR = 最大 1 ADR、
      # PR-number era の番号一致)も走らせる — push イベント(base/PR 番号が
      # 無い)ではリポジトリ全体の判定(重複なし・0000 残存なし・
      # filename==H1・README 索引網羅)のみ。
      - name: adr-number-check --selftest
        run: ./scripts/adr-number-check --selftest

      # ci-consumers: 編集するパスを入力にする CI の検査(消費者)を列挙する(docs/agents/ci-consumers.md)。
      - name: ci-consumers --selftest
        run: scripts/ci-consumers --selftest

      # hook-ask-vs-allow-probe (#1052): Claude の hook の ask と設定の allow の優先順位を、
      # 分離した HOME で実測する確認スクリプト。selftest は claude・認証・ネットワークを使わず、
      # 判定ロジックと設定の生成だけを固定する(実測は本人作業、docs/agents/agent-permissions.md)。
      - name: hook-ask-vs-allow-probe --selftest
        run: scripts/hook-ask-vs-allow-probe --selftest

      # obsidian-backup is exercised end to end against stubbed
      # restic/bws/secret-tool/herdr: init/backup/maintenance/restore-test's
      # restic invocations, the unsafe-relative-path rejection, the
      # missing-keyring-token fail-closed path, and the notify_failure
      # warning for herdr's toast-disabled response are all covered without
      # touching a real Backblaze B2 repository or Bitwarden Secrets Manager
      # account (docs/operations.md). Restored in #1170: #683 removed this step
      # together with the script, but no Rust replacement was ever added.
      - name: obsidian-backup --selftest
        run: ./scripts/obsidian-backup --selftest

      # post-checkout hook (#702): linked-worktree-only, per-repository opt-in,
      # clone never runs the declared script. Needs a git that has
      # `rev-parse --path-format=absolute` (2.31+) — the runner's is newer.
      - name: post-checkout --selftest
        run: ./config/git/hooks/post-checkout --selftest

      # commit-msg hook (#947, #949): bleep scan of the message and the staged
      # lines at commit time. Uses a stand-in bleep under a temporary HOME, so
      # no denylist, network or gh is needed.
      - name: commit-msg --selftest
        run: ./config/git/hooks/commit-msg --selftest

      # check-language-mixing.sh の selftest(ADR-0016 Amendment 2026-10-01):
      # LANG_MIX_PATHS による対象指定と、CJK 統合漢字の範囲指定の回帰を
      # 固定する。ネットワーク不使用。
      - name: check-language-mixing.sh --selftest
        run: bash config/agents/skills/repo-governance-common/templates/scripts/check-language-mixing.sh --selftest

      - name: adr-number-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_SHA" --depth=1
            ./scripts/adr-number-check --base "$BASE_SHA" --pr "$PR_NUMBER"
          else
            ./scripts/adr-number-check
          fi

      # decision-colocation-check (docs/adr/<番号>-decision-colocation.md):
      # 決定成果物(ADR/設計文書/skill)の新規追加、または既存 ADR への
      # `## Amendment` 追加に、その決定を執行する実ファイルの同梱を要求する
      # 判定エンジン。base ref は adr-number-check のステップで既に fetch
      # 済み。push イベント(base が無い)では比較対象が無いため skip する
      # — この検査は PR の diff に対してのみ意味を持つ。
      # #415(ADR-0024 Stage 4a)で Rust(crates/decision-colocation)になった。
      # required check はこの job なので、ここで同じバイナリを build して呼ぶ
      # (ubuntu-latest の既定の stable cargo で足りる。依存は hook-io /
      # guard-core のみで build は数十秒)。旧 --selftest の全ケースは rust job
      # の `cargo test --workspace` が走らせる。
      - name: decision-colocation-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            cargo run --locked --quiet -p decision-colocation \
              --bin decision-colocation-check -- --base "$BASE_SHA"
          else
            echo "decision-colocation-check: push イベントには base が無いため skip"
          fi

      # patches/herdr-worktree-names.patch の hololive タレント名配列(worktree
      # 名生成の正本)と config/herdr/oshi-marks.tsv のキー集合を双方向突合する。
      # patch にあって TSV に無い名前は行欠落、TSV にあって patch に無い名前は
      # 死んだエントリ — mark 列が空(未確証)なのは許容するが、行自体の欠落・
      # 余剰は許さない(docs/agents/herdr-sidebar-metadata.md)。
      - name: oshi-marks.tsv matches herdr-worktree-names.patch talent list
        run: |
          set -euo pipefail
          awk '/^\+        "sora"/{f=1} f{print} /"frienda"/{if(f)exit}' \
            patches/herdr-worktree-names.patch \
            | grep -oE '"[a-z]+"' | tr -d '"' | sort -u \
            > /tmp/patch-names.txt
          awk -F'\t' '!/^#/ && NF {print $1}' config/herdr/oshi-marks.tsv \
            | sort -u > /tmp/tsv-names.txt
          missing_in_tsv="$(comm -23 /tmp/patch-names.txt /tmp/tsv-names.txt)"
          extra_in_tsv="$(comm -13 /tmp/patch-names.txt /tmp/tsv-names.txt)"
          fail=0
          if [ -n "$missing_in_tsv" ]; then
            echo "::error::patch にあって oshi-marks.tsv に無い名前: $missing_in_tsv"
            fail=1
          fi
          if [ -n "$extra_in_tsv" ]; then
            echo "::error::oshi-marks.tsv にあって patch に無い名前: $extra_in_tsv"
            fail=1
          fi
          exit "$fail"

      # The key-trace tool's fixtures are the log excerpts quoted in
      # docs/ime-chrome-diagnosis.md, so this step fails if the detector and the
      # document ever disagree about what those traces mean.  It also guards the
      # redaction rules, which are what keep a lock-screen password out of a
      # trace file (see the header comment in the script).  Perl is preinstalled
      # on ubuntu-latest; shellcheck ignores .pl, so the file needs no exclusion.
      - name: fcitx5-key-trace.pl --selftest
        run: perl ./scripts/fcitx5-key-trace.pl --selftest

      # The plan-review gate's critic output contract (a document; the hook
      # validates the structure itself). The ExitPlanMode plan hooks
      # (copilot-plan-review, plan-view, plan-precedent-gate, plan-scope-gate,
      # plan-fresh-gate) are Rust now (#412, ADR-0024 Stage 4b); their former
      # --selftest cases run as `cargo test --workspace` in the rust job.
      - name: copilot-plan-review output schema is valid JSON
        run: jq empty config/agents/assets/copilot-plan-review.schema.json

      # codex-plan-gate (ADR-0032 Amendment #531) is Rust now (#389, ADR-0024
      # Stage 4b); its former --selftest cases run as `cargo test --workspace`
      # in the rust job (crates/codex-plan-gate/tests/gate.rs).

      # slot-hit.sh is the deterministic judgment core behind the
      # slot-availability skill (docs/agents/slot-availability.md): matching
      # candidate slots against calendar busy/soft-day events, and (finalize)
      # reconciling a decided subset against existing markers into an
      # update/create/delete plan. bash + yq + jq only (no Python runtime —
      # a design revisited via a private person-state repository's own
      # ADR-0010 D13). No network, no filesystem writes other than
      # --out-plan.
      # Keep the version equal to nixpkgs stable's yq-go (home/modules/packages.nix, #813).
      - name: Install yq (single static binary, version-pinned)
        run: |
          wget -q "https://github.com/mikefarah/yq/releases/download/v4.53.2/yq_linux_amd64" \
            -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      - name: slot-hit.sh --selftest
        run: bash ./config/agents/skills/slot-availability/scripts/slot-hit.sh --selftest

      # performance-hub / writing-style-hub / detach-open are Rust now (#414,
      # ADR-0024 Stage 4e, crates/hub-resolve and crates/detach-open); their
      # former --selftest cases run as `cargo test --workspace` in the rust job.

      # venue-urls.sh is the deterministic candidate-service enumerator behind
      # the venue-search skill (docs/agents/venue-search.md): reads a fixture
      # state/places.toml, no network, and checks the needs=grand-piano
      # branching (SpaceMarket/Instabase included only then), the
      # registered-only facility filter, and the url:null fallback for an
      # unknown service/system.
      - name: venue-urls.sh --selftest
        run: bash ./config/agents/skills/venue-search/scripts/venue-urls.sh --selftest

      # handoff.sh is deterministic shell + a stubbed gh end to end: labels-missing/
      # create-labels/block, including the issue number → id resolution the
      # dependencies API requires (docs/agents/handoff.md).
      - name: handoff.sh --selftest
        run: bash ./config/agents/skills/handoff/scripts/handoff.sh --selftest

      # routines-plan.sh is deterministic bash + jq end to end, no network:
      # the 7-way classification (in-sync/declared-ahead/live-drift/conflict/
      # suspended/refuse/new), unmanaged-cron detection, and the run-once/
      # webhook rejection (cron_utc required) are all exercised against
      # placeholder fixtures built inline (docs/claude/claude-routines.md).
      - name: routines-plan.sh --selftest
        run: bash ./config/agents/skills/claude-routines/scripts/routines-plan.sh --selftest

      # The git/worktree CLIs and hooks that used to be tested here
      # (git-audit-worktrees, git-prune-{worktrees,branches}, git-worktree-
      # create-guard, git-stash-guard, git-worktree-allow, worktree-base-sync,
      # git-checkout-sync, git-shelve/unshelve) are Rust now (#416, ADR-0024
      # Stage 4c); their cases run as `cargo test --workspace` in the rust job.
      # The hook/settings registrars (register-{codex,copilot}-hooks and the
      # inline register-claude-* / sync-claude-statusline) are Rust too
      # (crates/agent-settings-reconcile, #414): its fixtures, including the
      # idempotence check beside Herdr's own entries, run in the same job.

      # attribution-guard (docs/agents/attribution-guard.md) is deterministic
      # bash end to end against fixture commands — no gh/network involved.
      # stack-base-guard (ADR-0027) is now the Rust crates/stack-base-guard
      # (#415); its tests (the old Claude + Codex adapter selftests) run in the
      # `rust` job below.

      # pr-merge-settings-check / rulesets-context-check / workflow-naming-check
      # (ADR-0031 Amendment、ADR-503、ADR-591)は、crates/pr-contract-check の
      # 依存ゼロの Rust になった。かつての --selftest(gh のスタブで ok / drifted /
      # fetch-failed の経路を通す、PR title の context がテンプレート間で揃っている
      # ことの整合性の検査)は、同じ crate の `cargo test` として `rust` job で走る。

      # apply-repo-settings.sh (docs/adr/568-renovate-automerge-shared-preset.md D5b) is deterministic bash end to end against a stubbed
      # gh — covers the default (PATCH + vulnerability-alerts PUT +
      # automated-security-fixes DELETE), --no-dependabot (both Dependabot
      # calls skipped), and --dry-run (no gh api calls at all) paths.
      - name: apply-repo-settings.sh --selftest
        run: bash ./config/agents/skills/repo-governance-common/scripts/apply-repo-settings.sh --selftest

      - name: create-repo.sh --selftest
        run: bash ./config/agents/skills/repo-charter/scripts/create-repo.sh --selftest

      - name: irasutoya-search.sh --selftest
        run: bash ./config/agents/skills/repo-charter/scripts/irasutoya-search.sh --selftest

      # github-audit (ADR-0015) は crates/github-audit の Rust で、その検査(gh のスタブ
      # での判定・パイプライン)は `cargo test` として `rust` job で走る。

      # public-publish-guard's selftest now lives in its own repository
      # (tarotene/bleep, formerly tarotene/publish-guard, ADR-0009) and runs
      # in that repo's own CI — this repo no longer carries the source, so
      # there is nothing to selftest here.

      # Build a fixture package so the dry-run really reads package metadata
      # with dpkg-deb.  Pointing --package at a path that does not exist made
      # this step pass without validating anything.  The runner is not
      # arcturus, so the host checks warn instead of failing.
      - name: install-falcon-sensor.sh --dry-run
        run: |
          fixture="$(mktemp -d)/falcon-sensor"
          mkdir -p "$fixture/DEBIAN"
          printf '%s\n' \
            'Package: falcon-sensor' \
            'Version: 0.0.0-ci' \
            'Architecture: amd64' \
            'Maintainer: ci <ci@example.invalid>' \
            'Description: CI fixture for the company-provided package' \
            > "$fixture/DEBIAN/control"
          dpkg-deb -b "$fixture" /tmp/falcon-sensor.deb
          ./scripts/install-falcon-sensor.sh \
            --dry-run \
            --package /tmp/falcon-sensor.deb

      - name: install-falcon-sensor.sh --dry-run rejects a missing package
        run: |
          if ./scripts/install-falcon-sensor.sh \
               --dry-run --package /tmp/does-not-exist.deb; then
            echo "::error::dry-run accepted a missing package"
            exit 1
          fi

  # 以下、旧 .github/workflows/nix.yml から ADR-591 で統合した4 job
  # (stack-position/flake-check/rust/build-host)。ジョブ本体は変更なし
  # (stack-position の判定ロジックのみ .github/actions/stack-position
  # へ抽出)。

  stack-position:
    runs-on: ubuntu-latest
    name: Stack position
    permissions:
      pull-requests: read
    outputs:
      build_host: ${{ steps.judge.outputs.build_host }}
      rust: ${{ steps.judge.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: stage
        uses: ./.github/actions/stack-stage
      - id: judge
        uses: ./.github/actions/stack-position
        with:
          intermediate: ${{ steps.stage.outputs.intermediate }}

  flake-check:
    runs-on: ubuntu-latest
    name: Nix flake check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Determinate Systems installer (ADR-0001).
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      # NOTE: magic-nix-cache (named in #208) was sunset by Determinate Systems
      # in Feb 2025. We rely on cache.nixos.org substituters here; a FlakeHub
      # cache action can be added later once a token is provisioned.
      #
      # --no-build: `checks.${system}` (flake.nix) maps every host to its
      # activationPackage, so a full `nix flake check` here would rebuild all
      # hosts a second time — build-host below already does that as a
      # matrix. This job stays evaluation-only (module type errors, missing
      # source paths, ...); the real build coverage lives in build-host.
      #
      # --all-systems: darwin (altair, ADR-0018) has no runner here — this is
      # the cheap eval-only check that catches a darwin module type error
      # (e.g. an unguarded Linux-only option) without needing a macOS runner.
      # The corresponding aarch64-darwin build.host matrix row lives in
      # darwin-build.yml (advisory) and is the real build coverage for that
      # system.
      - run: nix flake check --all-systems --no-build --print-build-logs

      # docs/adr/568-renovate-automerge-shared-preset.md D4: the shared
      # preset (renovate/policy.json) and this repo's own renovate.json
      # (which extends it) are the only Renovate config in this repo — the
      # governance skill templates are structurally similar but not valid
      # standalone config (they carry placeholder tokens), so they are not
      # validated here. --no-global tells the validator these are repo
      # config files, not a self-hosted global config; --strict also fails
      # on migration warnings (e.g. a deprecated option).
      - run: |
          nix shell --inputs-from . nixpkgs#renovate -c \
            renovate-config-validator --strict --no-global \
              renovate/policy.json renovate.json

  # The Rust hook/CLI workspace (Cargo.toml, crates/*; ADR-0024, #391).
  # clippy (--deny warnings) and rustfmt run as crane derivations from
  # flake.nix's checks, in the build sandbox. cargo test runs through
  # `nix develop` instead, outside the sandbox: several tests read the rest of the
  # repo tree (pipeline-map scans config/, scripts/, home/ and the workflows;
  # pr-contract-check's consistency test reads the governance templates) and run
  # jq, git and gnupg from the devShell — none of that is available inside a
  # crane derivation's cleaned cargo source.
  rust:
    runs-on: ubuntu-latest
    name: Rust workspace
    needs: stack-position
    # `!= 'false'` (not `== 'true'`) + `!cancelled()`: if stack-position
    # itself fails or is cancelled, `needs.*.outputs.rust` comes back empty,
    # and `needs:`'s own default (skip when a dependency job failed) would
    # otherwise silently turn this into fail-closed — the opposite of the
    # gate's own fail-open branch (ADR-468).
    if: ${{ !cancelled() && needs.stack-position.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      # clippy + rustfmt だけ。release の package(`checks.dotfiles-tools`)は、
      # ここでは作らない: build-host の activationPackage が必ず同じ derivation を作る
      # (`home.file.*.source = "${pkgs.dotfiles-tools}/bin/<name>"`)ので、ここで
      # 作ると、同じ release ビルドを 3 つのジョブがやり直すことになる(2026-10-23 の
      # 実測: Rust job の package の段 3 分 40 秒を、vega が 4 分 12 秒かけて再度作っていた)。
      - name: Clippy + rustfmt (crane)
        run: |
          nix build --print-build-logs --no-link \
            .#checks.x86_64-linux.dotfiles-tools-clippy \
            .#checks.x86_64-linux.dotfiles-tools-fmt
      # cargo test の debug ビルドの target を残す(依存と、変えていない crate の
      # 再コンパイルを省く)。キーは Cargo.lock から作られる。cargo test は
      # `nix develop` の rustc で走るので、toolchain が変わったとき(flake.lock の更新)は
      # cargo 自身が fingerprint の不一致で作り直す(誤った再利用は起きない)。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo test (fixture oracles + allowlist audit)
        run: nix develop --command cargo test --workspace --locked

      # pipeline-map の図(ADR-872): manifest から作り直した .d2 / .svg が、コミット済みの
      # ものと一致すること。d2 は flake.lock で pin されていて(devShell)、ELK の出力は
      # 同じ入力に対して同一なので、差分は「manifest を変えたのに図を作り直していない」
      # ことを表す。`git diff` は未追跡の新規ファイルを見ないので、status で見る。
      - name: pipeline-map diagrams are up to date
        run: |
          set -euo pipefail
          nix develop --command cargo run --locked --quiet -p pipeline-map -- render
          if [ -n "$(git status --porcelain -- docs/assets/pipeline-map/)" ]; then
            git status --short -- docs/assets/pipeline-map/
            echo "::error::docs/assets/pipeline-map/ が manifest と食い違っています。ローカルで \`pipeline-map render\` を実行して差分をコミットしてください" >&2
            exit 1
          fi

  build-host:
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.host }}
    # cache-nix-action's purge-created/purge-last-accessed need `actions:
    # write` on the token to delete caches via the REST API (action README,
    # 取得 2026-09-23) — the repo default (no permissions: block anywhere
    # else in this repo) doesn't grant it, so purge attempts fail with
    # "Resource not accessible by integration" and stale caches accumulate
    # silently. contents: read keeps actions/checkout working.
    permissions:
      contents: read
      actions: write
    needs: stack-position
    # Same fail-open rationale as the `rust` job above.
    if: ${{ !cancelled() && needs.stack-position.outputs.build_host != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: vega
            runner: ubuntu-latest
          - host: arcturus
            runner: ubuntu-latest
          # altair (2022 M2 MacBook Air, aarch64-darwin — ADR-0018) builds
          # in darwin-build.yml instead (advisory, ADR-591 Q13: dotfiles'
          # own required checks stay Linux-only so a bottleneck in the
          # shared macOS runner queue never blocks a merge).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      # cache.nixos.org never substitutes two classes of package this repo
      # builds: herdr (patches/herdr-worktree-names.patch, ADR-0001
      # Amendment, invalidates the substitutable derivation) and bws
      # (Bitwarden Secrets Manager CLI, unfree — Hydra never builds unfree
      # packages, so no substitutable output can ever exist upstream;
      # vega (the personal host) only, via home/modules/obsidian.nix). Both are
      # permanent per-run costs unless this cache actually retains them.
      #
      # The primary-key hashes home/** and config/** in addition to the flake
      # inputs, and includes matrix.host: a key that only tracks
      # flake.lock/flake.nix/patches/** stays byte-identical across changes
      # to home/modules/obsidian.nix, so cache-nix-action's own "exact hit
      # on primary-key -> skip saving" rule (nix-community/cache-nix-action
      # README, 取得 2026-09-23) silently discarded every bws build this
      # cache ever produced. A host-scoped key additionally stops
      # vega's bws-bearing closure and arcturus's bws-less closure from
      # overwriting each other under one shared key.
      #
      # A key that changes on every home/** edit is not a regression:
      # restore-prefixes-first-match still restores the nearest prior cache
      # for this host, so bws comes back from the store instead of
      # rebuilding — a key miss is not a cache miss.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.host }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'patches/**', 'home/**', 'config/**', 'Cargo.lock', 'crates/**') }}
          restore-prefixes-first-match: nix-${{ matrix.host }}-${{ runner.os }}-
          # Never save from a pull_request run. A cache created there is
          # scoped to refs/pull/N/merge and "can only be restored by re-runs
          # of the pull request" (GitHub Docs, "Dependency caching
          # reference", 取得 2026-10-25), yet each is ~800 MB and counts
          # against the 10 GB repo limit; past it, eviction is oldest
          # last-access first, i.e. main's restorable caches. 2026-10-25:
          # 11.36 GB used, vega found no cache and rebuilt 346 derivations in
          # 32 min (#1014). Pushes to main still save.
          save: ${{ github.event_name != 'pull_request' }}
          gc-max-store-size-linux: 1G
          gc-max-store-size-macos: 1G
          purge: true
          purge-prefixes: nix-${{ matrix.host }}-${{ runner.os }}-
          purge-primary-key: never
          # ISO 8601 durations (nix-community/cache-nix-action README, 取得
          # 2026-09-23: "a non-negative number or a string in the ISO 8601
          # duration format" — plain "30d"/"14d" is neither and was silently
          # treated as an immediate cutoff in testing).
          purge-created: P30D
          purge-last-accessed: P14D
      - name: Build activation package
        run: |
          nix build \
            ".#homeConfigurations.${{ matrix.host }}.activationPackage" \
            --print-build-logs --no-link
      # #602: the Codex/Copilot adapters `source` the Claude hook engines.
      # Running their --selftest from the source tree cannot catch a broken
      # source path, because there ../../claude/hooks exists; in the deployed
      # home-files layout it does not (~/.codex/hooks vs ~/.claude/hooks are
      # flat siblings). Run them from the built activationPackage with HOME
      # pointed at its home-files, i.e. the deployed shape.
      - name: Adapter selftests in the deployed layout
        run: |
          set -euo pipefail
          out="$(nix build \
            ".#homeConfigurations.${{ matrix.host }}.activationPackage" \
            --no-link --print-out-paths)"
          for f in "$out"/home-files/.codex/hooks/*.sh "$out"/home-files/.copilot/hooks/*.sh; do
            [ -e "$f" ] || continue
            echo "== $f"
            HOME="$out/home-files" bash "$f" --selftest
          done
      # #604: the deployed bleep hook canary is no longer a step here — it is a
      # `home.checks` derivation (home/modules/claude.nix, config/claude/
      # bleep-canary.sh), so the build above already fails on a bleep pin the
      # wiring cannot live with, and so does `hms` before it switches.
      # cache-nix-action does not create GC roots itself (its own README:
      # "users must manage this separately"), so anything without a root is
      # collected before the cache is saved. Rather than hand-listing every
      # non-substitutable package (the herdr-only root here is exactly how
      # bws went unnoticed), derive the set from fact: every store path this
      # runner actually compiled (`ultimate: true`) that the just-built
      # activationPackage or herdr still reference. New non-substitutable
      # packages are covered automatically, with no list to remember to edit.
      #
      # `home-manager-generation` (the activationPackage's own top-level
      # output) is itself always `ultimate: true` — it is host-specific glue,
      # never substitutable — but its closure IS the entire user environment
      # (~8.5 GiB locally). A GC root is closure-transitive by Nix's own
      # semantics, so rooting it verbatim would protect (and upload) the
      # whole environment instead of just bws/herdr. Filter by each
      # candidate's OWN closure size: bws/herdr sit under 100 MiB, the
      # aggregate output sits in the GiB range, so a generous threshold well
      # below "whole environment" and well above "one compiled package"
      # separates them without naming either by hand.
      - name: Root every locally built, non-aggregate path still in the closure
        run: |
          set -euo pipefail
          nix path-info --json --all \
            | jq -r 'to_entries[] | select(.value.ultimate == true) | .key' \
            | sort > /tmp/ultimate.txt
          nix-store -qR \
            "$(nix eval --raw ".#homeConfigurations.${{ matrix.host }}.activationPackage.outPath")" \
            "$(nix eval --raw ".#herdr.outPath")" \
            | sort > /tmp/closure.txt
          mkdir -p /tmp/nix-gcroots
          max_closure_bytes=$((500 * 1024 * 1024))
          i=0
          while read -r p; do
            [ -n "$p" ] || continue
            size=$(nix path-info -S "$p" | awk '{print $2}')
            if [ "$size" -gt "$max_closure_bytes" ]; then
              echo "skipping $p (own closure ${size} bytes, looks like an aggregate output)"
              continue
            fi
            nix-store --add-root "/tmp/nix-gcroots/$i" --indirect --realise "$p" >/dev/null
            i=$((i + 1))
          done < <(comm -12 /tmp/ultimate.txt /tmp/closure.txt)
          echo "rooted $i locally built paths"
      # Rust の依存(crane の buildDepsOnly の出力)は、dotfiles-tools の build 時だけの
      # 入力で、どの activationPackage の closure にも入らない。上の「ultimate かつ
      # closure に残る」の規則では、構造的に root されず、GC で消えてキャッシュに残らない
      # (2026-10-23 の実測: vega が `cargoArtifacts not set` のまま依存を毎回作り直し、
      # deps の段だけで 2 分 48 秒)。flake の checks に名前を付けた
      # `dotfiles-tools-deps` を、名前で root する。Cargo.lock が変わらなければ、
      # buildDepsOnly の derivation は変わらない(crane は crate のソースを空にして
      # 依存だけを作る)ので、次の run はキャッシュから戻る。
      - name: Root the Rust dependency artifacts (crane buildDepsOnly)
        run: |
          set -euo pipefail
          deps="$(nix build ".#checks.x86_64-linux.dotfiles-tools-deps" \
            --no-link --print-out-paths)"
          mkdir -p /tmp/nix-gcroots
          nix-store --add-root /tmp/nix-gcroots/rust-deps --indirect --realise "$deps" >/dev/null
          echo "rooted $deps ($(nix path-info -S -h "$deps" | awk '{print $2, $3}'))"

  # スタック標準の API doc ビルド必須化(ADR-640 stack-standard-api-docs)。
  # dotfiles 自身の Cargo workspace(crates/*)に docs-rust composite action
  # を適用する — 全リポジトリへ強制する規則を、まずこのリポジトリ自身が
  # 満たす。stack-position の heavy 判定は使わない(doc ビルドは軽く、
  # stacked PR の中間段でも壊れた doc を検出したい)。
  docs:
    runs-on: ubuntu-latest
    name: API docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/docs-rust
        with:
          upload: 'false'

  # docs-{rust,python,typescript} composite action 自体の回帰試験。
  # `@main` 参照で全リポジトリへ即時に届くため、strict の基準を変える PR が
  # 他リポジトリの CI を一斉に壊さないよう、tests/docs-fixtures の正常系が
  # 成功し、壊したコピー(未解決リンク)が失敗することをここで固定する。
  docs-actions:
    runs-on: ubuntu-latest
    name: Docs actions (fixtures)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- Rust ---
      - name: Rust fixture builds
        uses: ./.github/actions/docs-rust
        with:
          working-directory: tests/docs-fixtures/rust
          upload: 'false'
      - name: Rust fixture builds with docsrs cfg
        uses: ./.github/actions/docs-rust
        with:
          working-directory: tests/docs-fixtures/rust
          docsrs: 'true'
          upload: 'false'
      - name: Break the Rust fixture (unresolved intra-doc link)
        run: |
          # backticks below are literal rst/rustdoc syntax, not command substitution
          # shellcheck disable=SC2016
          sed -i 's|^pub fn add|/// See [`nope`].\npub fn add|' tests/docs-fixtures/rust/src/lib.rs
      - name: Broken Rust fixture is rejected
        id: rust_broken
        continue-on-error: true
        uses: ./.github/actions/docs-rust
        with:
          working-directory: tests/docs-fixtures/rust
          upload: 'false'
      - name: Assert the broken Rust fixture failed
        env:
          OUTCOME: ${{ steps.rust_broken.outcome }}
        run: test "$OUTCOME" = failure

      # --- Python ---
      - name: Python fixture builds
        uses: ./.github/actions/docs-python
        with:
          working-directory: tests/docs-fixtures/python
          upload: 'false'
      - name: Python fixture with a docs extra builds (MyST page)
        uses: ./.github/actions/docs-python
        with:
          working-directory: tests/docs-fixtures/python-myst
          upload: 'false'
      # python-myst は .python-version(3.13)を持つ。入力が空のとき、action が最新ではなく
      # working-directory のそのファイルの版を選んだことを確かめる(setup-python が PATH を
      # 更新するので、直前の step の python が見える)。ファイルを持たない
      # tests/docs-fixtures/python は、従来どおり最新('3.x')で上の step を通る。
      - name: Python fixture used the version from .python-version
        run: python -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
      - name: Break the Python fixture (unresolved nitpicky reference)
        run: |
          # backticks below are literal rst/rustdoc syntax, not command substitution
          # shellcheck disable=SC2016
          sed -i 's|Add two numbers.|Add two numbers, see :py:func:`docs_fixture.nope`.|' tests/docs-fixtures/python/src/docs_fixture/__init__.py
      - name: Broken Python fixture is rejected
        id: python_broken
        continue-on-error: true
        uses: ./.github/actions/docs-python
        with:
          working-directory: tests/docs-fixtures/python
          upload: 'false'
      - name: Assert the broken Python fixture failed
        env:
          OUTCOME: ${{ steps.python_broken.outcome }}
        run: test "$OUTCOME" = failure

      # --- TypeScript ---
      - name: TypeScript fixture builds
        uses: ./.github/actions/docs-typescript
        with:
          working-directory: tests/docs-fixtures/typescript
          upload: 'false'
      - name: Break the TypeScript fixture (unresolved link)
        run: sed -i 's|/\*\* Add two numbers. \*/|/** Add two numbers, see {@link nope}. */|' tests/docs-fixtures/typescript/src/index.ts
      - name: Broken TypeScript fixture is rejected
        id: typescript_broken
        continue-on-error: true
        uses: ./.github/actions/docs-typescript
        with:
          working-directory: tests/docs-fixtures/typescript
          upload: 'false'
      - name: Assert the broken TypeScript fixture failed
        env:
          OUTCOME: ${{ steps.typescript_broken.outcome }}
        run: test "$OUTCOME" = failure

  # 集約 required check(ADR-591)。上の job を1つでも追加・削除したら
  # needs: をここで同期させること — workflow-naming-check(tarotene/
  # dotfiles 自身の composite action 経由、この PR で新規配線)が
  # この不変条件を機械検査する。
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [gitleaks, shellcheck, dry-run, stack-position, flake-check, rust, build-host, docs, docs-actions, codex-review-diff]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
