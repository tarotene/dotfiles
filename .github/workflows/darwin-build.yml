name: Darwin build

# ADR-591(docs/adr/591-ci-workflow-naming.md D13/Q13): altair(2022 M2
# MacBook Air, aarch64-darwin — ADR-0018)のビルドは advisory とし、
# dotfiles 自身の required check からは外す — 共有 macOS runner キュー
# での待ち行列(実測 4m30s〜13m49s、#419)が required check の一部だと、
# stacked PR の中間段が macOS 待ちだけでブロックされ続けるため
# (ADR-468)。vega/arcturus は `ci.yml`(ブロッキング)に残る。
#
# `.github/actions/stack-position` を `ci.yml` と共有する — stack-aware
# skip(ADR-468)は required/advisory を問わず同じ判定を使う。

# pipeline-node: darwin-build
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: darwin-build-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-altair:
    runs-on: macos-latest
    name: Build altair
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: stack-stage
        uses: ./.github/actions/stack-stage
      - id: stack-position
        uses: ./.github/actions/stack-position
        with:
          intermediate: ${{ steps.stack-stage.outputs.intermediate }}

      # Same fail-open rationale as ci.yml's `rust`/`build-host` jobs. Nix のインストールと
      # キャッシュは、ci.yml の build-host と同じ composite action を使う。
      - uses: ./.github/actions/nix-store-cache
        if: ${{ !cancelled() && steps.stack-position.outputs.build_host != 'false' }}
        with:
          host: altair

      - name: Build activation package
        if: ${{ !cancelled() && steps.stack-position.outputs.build_host != 'false' }}
        run: |
          nix build \
            ".#homeConfigurations.altair.activationPackage" \
            --print-build-logs --no-link

      - name: Build system configuration
        if: ${{ !cancelled() && steps.stack-position.outputs.build_host != 'false' }}
        run: nix build ".#darwinConfigurations.altair.system" --print-build-logs --no-link

      # 非 substitutable な herdr / bws と、crane の Rust の依存を GC root で保護する
      # (理由は .github/actions/nix-gc-roots/action.yml)。
      - uses: ./.github/actions/nix-gc-roots
        if: ${{ !cancelled() && steps.stack-position.outputs.build_host != 'false' }}
        with:
          host: altair
