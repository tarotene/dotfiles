name: Darwin build

# ADR-591(docs/adr/591-ci-workflow-naming.md D13/Q13): altair(2022 M2
# MacBook Air, aarch64-darwin — ADR-0018)のビルドは advisory とし、
# dotfiles 自身の required check からは外す — 共有 macOS runner キュー
# での待ち行列(実測 4m30s〜13m49s、#419)が required check の一部だと、
# stacked PR の中間段が macOS 待ちだけでブロックされ続けるため
# (ADR-468)。vega/arcturus は `ci.yml`(ブロッキング)に残る。
#
# `.github/actions/stack-position` を `ci.yml` と共有する — stack-aware
# skip(ADR-468)は required/advisory を問わず同じ判定を使う。

on:
  push:
    branches: [ main, "feat/home-manager", "feat/hm-**" ]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: darwin-build-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-altair:
    runs-on: macos-latest
    name: Build altair
    permissions:
      contents: read
      actions: write
      pull-requests: read
    outputs:
      build_host: ${{ steps.stack-position.outputs.build_host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: stack-position
        uses: ./.github/actions/stack-position

      # Same fail-open rationale as ci.yml's `rust`/`build-host` jobs.
      - uses: DeterminateSystems/nix-installer-action@main
        if: ${{ !cancelled() && steps.stack-position.outputs.build_host != 'false' }}

      - uses: nix-community/cache-nix-action@v7
        if: ${{ !cancelled() && steps.stack-position.outputs.build_host != 'false' }}
        with:
          primary-key: nix-altair-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'patches/**', 'home/**', 'config/**', 'Cargo.lock', 'crates/**') }}
          restore-prefixes-first-match: nix-altair-${{ runner.os }}-
          gc-max-store-size-macos: 1G
          purge: true
          purge-prefixes: nix-altair-${{ runner.os }}-
          purge-primary-key: never
          purge-created: P30D
          purge-last-accessed: P14D

      - name: Build activation package
        if: ${{ !cancelled() && steps.stack-position.outputs.build_host != 'false' }}
        run: |
          nix build \
            ".#homeConfigurations.altair.activationPackage" \
            --print-build-logs --no-link

      # 集約と同じ根拠(ci.yml の build-host job のコメント参照): 非
      # substitutable な herdr/bws を GC root で保護する。
      - name: Root every locally built, non-aggregate path still in the closure
        if: ${{ !cancelled() && steps.stack-position.outputs.build_host != 'false' }}
        run: |
          set -euo pipefail
          nix path-info --json --all \
            | jq -r 'to_entries[] | select(.value.ultimate == true) | .key' \
            | sort > /tmp/ultimate.txt
          nix-store -qR \
            "$(nix eval --raw ".#homeConfigurations.altair.activationPackage.outPath")" \
            "$(nix eval --raw ".#herdr.outPath")" \
            | sort > /tmp/closure.txt
          mkdir -p /tmp/nix-gcroots
          max_closure_bytes=$((500 * 1024 * 1024))
          i=0
          while read -r p; do
            [ -n "$p" ] || continue
            size=$(nix path-info -S "$p" | awk '{print $2}')
            if [ "$size" -gt "$max_closure_bytes" ]; then
              echo "skipping $p (own closure ${size} bytes, looks like an aggregate output)"
              continue
            fi
            nix-store --add-root "/tmp/nix-gcroots/$i" --indirect --realise "$p" >/dev/null
            i=$((i + 1))
          done < <(comm -12 /tmp/ultimate.txt /tmp/closure.txt)
          echo "rooted $i locally built paths"
