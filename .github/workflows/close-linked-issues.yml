name: Close Linked Issues

# Closes the issues a merged PR references with a closing keyword
# (Closes / Fixes / Resolves #N), regardless of the PR's base branch.
#
# Why this exists: GitHub only acts on closing keywords for a PR that
# targets the default branch. In a stacked PR chain (ADR-0027) every stage
# but the bottom one is created against its parent's branch, and GitHub's
# automatic retarget to the default branch after the parent merges does not
# re-evaluate the body — so `Closes #N` on a stage silently closes nothing
# (tarotene/dotfiles#609, reproduced on tarotene/bleep#59-#63 where even the
# bottom stage's link list came back empty). The keyword is still the
# contract; this workflow makes the merge honour it.
#
# Mirrors GitHub's own rules: keywords inside fenced code blocks and inline
# code spans are ignored, and `owner/repo#N` references to another
# repository are ignored. Issues that are already closed are left alone, so
# running after GitHub's native close is a no-op.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  close:
    name: Close linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues referenced by closing keywords
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Drop fenced blocks (``` / ~~~) and inline `code` — GitHub ignores
          # closing keywords there, so a quoted example must not close anything.
          text="$(printf '%s\n' "$PR_BODY" \
            | awk '/^[[:space:]]*(```|~~~)/ { fenced = !fenced; next } !fenced' \
            | sed -E 's/`[^`]*`//g')"
          refs="$(printf '%s\n' "$text" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+' \
            | awk '{ print $NF }' || true)"
          # GitHub closes only the issue right after a keyword: `Closes #1 #2`
          # closes #1 and nothing else, one keyword per issue is the rule. The
          # rest of such a list would be dropped silently, so name it instead
          # (tarotene/dotfiles#722).
          ref_re='([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'
          dropped="$(printf '%s\n' "$text" \
            | grep -oiE "\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+${ref_re}(([[:space:]]*,|[[:space:]]+and|[[:space:]]*&)?[[:space:]]+${ref_re})+" \
            | while IFS= read -r chain; do
                printf '%s\n' "$chain" | grep -oE "$ref_re" | tail -n +2
              done || true)"
          if [ -n "$dropped" ]; then
            list="$(printf '%s\n' "$dropped" | sort -u | paste -sd ' ' -)"
            echo "::warning::not closed (a closing keyword covers only the issue right after it; write one keyword per issue): $list"
            {
              echo "### Issues not closed by this workflow"
              echo
              echo "A closing keyword covers only the issue right after it. These were listed after another one and were skipped: $list"
              echo "Write one keyword per issue (\`Closes #1\` / \`Closes #2\`) or close them by hand."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          closed=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            repo="${ref%#*}"
            n="${ref##*#}"
            if [ -n "$repo" ] && [ "$repo" != "$GH_REPO" ]; then
              echo "skip $ref: other repository"
              continue
            fi
            state="$(gh issue view "$n" --json state --jq .state 2>/dev/null)" || {
              echo "skip #$n: not readable as an issue"
              continue
            }
            if [ "$state" != "OPEN" ]; then
              echo "skip #$n: already $state"
              continue
            fi
            gh issue close "$n" --reason completed \
              --comment "Closed by #${PR_NUMBER} (merged)."
            closed=$((closed + 1))
          done < <(printf '%s\n' "$refs" | sort -u)
          echo "closed $closed issue(s)"
