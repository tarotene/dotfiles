# するほどの複雑さがなく、既存の writing-style-hub と一貫した扱いにする。
#
# 61 = 上記 60 + grill-me セッション(ADR-543、段3/4)で追加した
# config/claude/hooks/feedback-target-guard.sh の 1 件。attribution-
