# 移植対象集合の machine-checkable allowlist(#389 の完了定義、#391)。
#
# crates/migration-audit のテストがこのファイルと実体を突き合わせる:
#   - [scan].dirs 配下の全ファイルが target / excluded のどちらかに分類済み
#     であること(未分類の新規ファイルは fail — 新しい hook/CLI は Rust 既定、
#     ADR-0024)
#   - home/ 配下の nix に埋め込まれた inline シェル(writeShellScript の
#     '' リテラル本体)が [[inline]] の宣言と一致すること
#   - 残っている bash/sh の target + inline の件数が max_remaining 以下
#     であること
#
# 移植で bash を 1 本消したら、その [[target]] 行を消して max_remaining を
# 同じだけ下げる(下げ忘れは「上限が緩い」だけで fail しないが、テストが
# 出力する現在値と比べてレビューで気づける)。max_remaining = 0 かつ
# target / inline が空になった時点で #389 の完了定義を満たす。

[scan]
dirs = [
  "config/claude/hooks",
  "config/claude/statusline",
  "config/codex/hooks",
  "config/copilot/hooks",
  "config/git/hooks",
  "scripts",
]
# スキャン対象外だが分類を明示しておくルート直下のファイル
extra = ["bootstrap.sh"]

[limits]
# 56 = 現行 52 + このコミットで追加する 2 件(decision-colocation-guard.sh /
# decision-colocation-check) + #402/#404(段2・段4)がそれぞれ追記する
# dotfiles-doctor / apply-rulesets.sh の先取り分。後続段は max_remaining を
# 再度書き換えない(stacked-pr スキル §2「同じ行を2段以上が書き換える切り方は
# しない」— [[target]] の追記のみで済ませる)。
#
# 57 = 上記 56 + 別セッション(#325 グリルセッション由来)で追加した
# scripts/pr-merge-settings-check の 1 件。既存の judge_settings()/
# fetch_repo_settings()(scripts/github-audit、巨大な既存 bash 資産)を
# source して再利用する設計上、この新スクリプトも bash のまま追加した —
# github-audit 自体が Rust 化されるまでは、判定ロジックの単一正本を保つ
# ために bash 側で揃える方が ADR-0035 D1(単一正本 > 複写+同期)に適う。
#
# 58 = 上記 57 + grill-me セッション(ADR-471)で追加した
# scripts/tailscale-prefs の 1 件。他の home-manager 配備済み CLI
# (gpg-subkey / dotfiles-doctor / hms.sh 等)と同じ扱いで、いずれ Rust
# 化する対象として stage 4e に積む。scripts/setup-firewall.sh は同じ ADR
# 由来だが root escape hatch なので上の [[excluded]] 側。
#
# 59 = 上記 58 + grill-me セッション(ADR-0031 Amendment, 2026-09-26)で
# 追加した scripts/pr-title-context-check の 1 件(件数は同じセッションの
# 別 stacked PR で scripts/rulesets-context-check に改称・一般化 —
