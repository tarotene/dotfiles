# hook: 段指定・閉じたタグとも OK → 素通し
bin.name = "plan-scope-gate"
stdin = '''
{"session_id": "s1", "cwd": "/", "hook_event_name": "PreToolUse", "tool_name": "ExitPlanMode", "tool_input": {"plan": "## 要求インベントリ\n\n- R1: 段1で実装\n- R2: Obsolete: もう不要\n- **R3:** Stage 2 で実装\n- R4) Blocked-Upstream: 待ち\n- R5. User-Excluded: 除外\n"}}'''
status.code = 0
stdout = ""
[env.add]
CLAUDE_PLAN_SCOPE_GATE_DIR = "/nonexistent/plan-scope-gate"
[env]
remove = ["SKIP_PLAN_SCOPE_GATE"]
