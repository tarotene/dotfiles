# hook: 節は次の見出しで終わる → 素通し
bin.name = "plan-scope-gate"
stdin = '''
{"session_id": "s1", "cwd": "/", "hook_event_name": "PreToolUse", "tool_name": "ExitPlanMode", "tool_input": {"plan": "## 要求インベントリ\n\n- R1: 段1で実装\n## 次の節\n- R2: 処分なしだが節の外\n"}}'''
status.code = 0
stdout = ""
[env.add]
CLAUDE_PLAN_SCOPE_GATE_DIR = "/nonexistent/plan-scope-gate"
[env]
remove = ["SKIP_PLAN_SCOPE_GATE"]
