[package]
name = "codex-plan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-observations = { path = "../agent-observations" }
codex-launcher = { path = "../codex-launcher" }
github-command = { path = "../github-command" }
model-catalog = { path = "../model-catalog" }
anyhow.workspace = true
futures-util = { workspace = true, features = ["sink"] }
libc.workspace = true
process-env = { version = "0.1.0", path = "../process-env" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "net", "io-util", "signal", "time"] }
tokio-tungstenite.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
toml = { workspace = true, features = ["default"] }
