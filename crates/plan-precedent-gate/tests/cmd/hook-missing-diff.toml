# hook: 差分欠落 → deny
bin.name = "plan-precedent-gate"
stdin = '''
{"session_id": "s1", "cwd": "/", "hook_event_name": "PreToolUse", "tool_name": "ExitPlanMode", "tool_input": {"plan": "## 先行例との対比\n\n- D1: 判断\n  先行例: https://example.com/x (取得 2026-09-15)\n"}}'''
status.code = 0
stdout = """
{
  "hookSpecificOutput": {
    "hookEventName": "PreToolUse",
    "permissionDecision": "deny",
    "permissionDecisionReason": "先行例との対比の検査で問題が見つかりました。precedent-grounding スキルの手順に従って計画を修正してください。/n/nD1: 先行例の記載に不足があります — 差分:(一致|異なる)、軸:(表現不可能|還元|検出のみ)/n/nそのまま構造を写し、山括弧の中身だけ事実に置き換えれば書式検査は通ります:/n/n## 先行例との対比/n/n- D1: <採った設計判断を1文で>/n  先行例: <著者/組織, タイトル> https://example.com/doc (取得 2000-01-01)/n  差分: 一致/n  軸: 表現不可能 | 還元 | 検出のみ — <1句>/n- D2: <採った設計判断を1文で>/n  先行例なし: <どこを・何のキーワードで・一次/二次のどちらまで探したか>/n  軸: 表現不可能 | 還元 | 検出のみ — <1句>/n- D3: <外部依存の新設・置換・撤去を伴う設計判断を1文で>/n  本命: 憧れ駆動 | なし — <理由>/n  対抗馬: <候補> (<本命と共通の評価軸>)/n  既存手段: <path> — 採用: <ツール名/URL> | 拡張: <既存パス> | 自前 — 却下: <候補> (<理由>) | 探索: <どこを・何のキーワードで>/n  先行例: <著者/組織, タイトル> https://example.com/doc (取得 2000-01-01)/n  差分: 一致/n  戻せない: データ | 外部契約 | 人手 — <内容。戻せないものが無ければこの行ごと省く>/n  軸: 表現不可能 | 還元 | 検出のみ — <1句>/n/n`軸:` は全 Dn に必須(precedent-grounding スキル §3、selection-grounding/nスキル参照)。出典は URL のほか #123 / owner/repo#123 / リポジトリ内パス/nでも可。先行例から意図的に外れた場合は「差分: 異なる — <理由>」。技術・/n仕組みの選択で外部依存の新設・置換・撤去、新しい道具・単位の実装言語の選択、/nまたは戻せないもの(データの損失・外部契約・人手の作業)が生じるときは、/n加えて「本命:」「対抗馬:」(揃えて書く)「外した候補:」/n「既存手段:」(自前なら却下:/探索: 必須、ADR-543)も書く/n(selection-grounding スキル参照)。裁定は「コード 0 行の白紙から選ぶなら/n何を採るか」だけで下し、書き直しの作業量と過去の経緯は理由にしない。/n戻せないものがあるときだけ「戻せない: データ | 外部契約 | 人手 — <内容>」の/n1 行で書く(これ以外の書き方でコストを理由にすると deny)。設計判断を含まない/nプランなら、/n節の代わりに次の1行だけ:/n/n先行例: 該当なし — <理由(例: typo 修正で設計判断を含まない)>"
  }
}
"""
[env.add]
CLAUDE_PLAN_PRECEDENT_GATE_DIR = "/nonexistent/plan-precedent-gate"
[env]
remove = ["SKIP_PLAN_PRECEDENT_GATE"]
