# ---------------------------------------------------------------- discovery
# `model-catalog fetch-aa --write` が、AA の応答から手登録でない提供元・モデルを、生成ブロックの
# 中へ自動で登録する範囲。この日(含む)以降に公開されたモデルだけを新しく載せる。古いモデルまで
# 載せると候補が膨らむため。既に登録したものは、日付の外に出ても残る。手登録の行は書き換えない。

[discovery]
aa_release_since = "2026-07-01"

# -------------------------------------------------------------- equivalence
# 同等性の判定(model-equivalence)。能力は差の 90% 区間(Newcombe 1998)が ±δ の内側に収まること、
# 速さは点推定の比が 1/(1+δ)〜(1+δ) に収まること。区間を作れないものは「データ不足」になる。

# capability_margin_points は能力の許容幅の「下限」。役ごとの既定は、役の判定に使うベンチの分解能の最大値
# (点数 0.5 のとき)を 0.5pt に切り上げた値と、この値の大きい方になる(#1150)。許容幅が分解能より狭いと、
# 差が無くても「同等」と言えず、行の多くが「データ不足」になるため。速さは区間を持たないので、この値のまま。

[equivalence]
capability_margin_points = 5.0
speed_margin_ratio = 0.2
history_share_min = 0.1

# 役ごとに判定する。Plan 役は種類を問わず設計・推論・長い文脈の読解に効く力、実行役は
# 種類ごとの仕事(コードを直し、端末を操作する)に効く力なので、履歴の内訳に従ってベンチを絞る。

[role.plan]
name = "Plan 役"
note = "設計・推論・長い文脈の読解に効く力。仕事の種類を問わず同じベンチで判定する。"
order = 1
follows_history = false
benchmarks = ["lcr", "hle"]
reference_benchmarks = ["artificial_analysis_intelligence_index"]

[role.execute]
name = "実行役"
note = "コードを直し、端末を操作して仕事を進める力。履歴の内訳で、対応するベンチだけに絞る。"
order = 2
follows_history = true
benchmarks = ["terminalbench_v4_0", "scicode"]

# 履歴の課題の種類と、測っているベンチの対応。種類は次の順で、決定論的に決める(LLM は使わない)。
#   1. PR タイトルの conventional prefix(`prefixes`)。型の一覧は Conventional Commits 1.0.0
#      (https://www.conventionalcommits.org/en/v1.0.0/、取得 2026-10-28)が `fix`・`feat` に加えて
#      推奨する `build`・`chore`・`ci`・`docs`・`style`・`refactor`・`perf`・`test` に、`revert`
#      (取り消し)と、慣用の別名(`feature`・`bugfix`・`hotfix`・`doc`・`tests`)を足したもの。
#      prefix は大文字小文字を区別せず、2 つの種類が同じ prefix を持つと読み込みで拒否する。
#   2. prefix で決まらなかった PR(prefix が無い、または未知)だけ、変更ファイルの名前(`files`)。
#      全ファイルが同じ 1 つの種類に当たるときだけ、その種類にする。混在・どれにも当たらない
#      ファイルがある・取得に失敗したときは `other`。`dirs` が先(最も長い一致が勝つ)、無ければ拡張子。
#   3. どちらでも決まらなければ `other`。
# fit = direct は、その仕事そのものを測っているベンチ。proxy は近い力を測っているだけの代理。
# SWE-bench 系は、現行モデルに値のある行が無い(更新停止)ので載せられない。ベンチが空の種類は、
# 現行モデルに値のある公開ベンチで測れていない領域として、ページに帯で見せる。

[category.feature]
name = "機能追加"
note = "既存の仕組みに機能を足す仕事。直接測るベンチは無く、端末での作業とコード生成を代理にする。"
prefixes = ["feat", "feature"]
benchmarks = [
  { id = "terminalbench_v4_0", fit = "proxy" },
  { id = "scicode", fit = "proxy" },
]

[category.bugfix]
name = "バグ修正"
note = "不具合の原因を調べて直す仕事(取り消し `revert` も、壊れた変更を戻す修正として含める)。SWE-bench 系が直接のベンチだが現行モデルの行が無いので、代理にする。"
prefixes = ["fix", "bugfix", "hotfix", "revert"]
benchmarks = [
  { id = "terminalbench_v4_0", fit = "proxy" },
  { id = "scicode", fit = "proxy" },
]

[category.refactor]
name = "リファクタ・性能"
note = "動作を変えずに構造・書式・性能を直す仕事(`style` も含める)。"
prefixes = ["refactor", "perf", "style"]
benchmarks = [
  { id = "terminalbench_v4_0", fit = "proxy" },
  { id = "scicode", fit = "proxy" },
]

[category.test]
name = "テスト"
note = "テストを足す・直す仕事。コード生成と端末での作業を代理にする。"
prefixes = ["test", "tests"]
files = { dirs = ["tests/", "test/", "__tests__/", "spec/"] }
benchmarks = [
  { id = "terminalbench_v4_0", fit = "proxy" },
  { id = "scicode", fit = "proxy" },
]

[category.config]
name = "設定・インフラ"
note = "Nix・CI・シェルなどの設定、依存・ビルド・雑務(`chore`)を端末で直す仕事。Terminal-Bench が仕事の形に近い。"
prefixes = ["ci", "build", "chore"]
files = { dirs = [".github/", "scripts/"], extensions = ["nix", "toml", "yaml", "yml", "sh", "zsh", "lock"] }
benchmarks = [{ id = "terminalbench_v4_0", fit = "direct" }]

[category.docs]
name = "文書・設計"
note = "文書や設計を書く仕事。文章を書く力を測る公開ベンチは無く、長い文脈の読解を代理にする。"
prefixes = ["docs", "doc"]
files = { dirs = ["docs/", "doc/"], extensions = ["md", "rst", "adoc"] }
benchmarks = [{ id = "lcr", fit = "proxy" }]

[category.other]
name = "その他"
note = "prefix でも変更ファイルでも種類を決められなかった PR(prefix の無いタイトルで、変更ファイルが混在しているものなど)。"

# ------------------------------------------------- 純正ハーネスで測られた値
# Terminal-Bench 公式の leaderboard にある、各社の純正ハーネス(Claude Code・Codex)での値。
# AA の mini-swe-agent での値とは別物として、補正せずに注記として並べる。ハーネスによる差の向きが
