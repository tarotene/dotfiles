# Vendor-neutral model catalog — the single source of truth (D4).
#
# - 価格・文脈長・出典(`[[provider]]` / `[[model]]`)は codex-plan の費用比較が読む。
#   旧 crates/codex-plan/src/catalog.rs の直書きをここへ移した。
# - ベンチの定義(`[benchmark.*]`)と測定値(末尾の生成ブロック)は model-equivalence が読む。
# - 生成ブロックは `model-catalog fetch-aa --write` だけが書く。手で編集しない。ここには測定値のほか、
#   AA から自動で登録した提供元・モデルも入る(範囲は `[discovery]`)。
# - 他社・新モデルを足すときは、`[[provider]]` と `[[model]]` の行を足す。コードは変えない。
# - エフォートは各社の公式の段階名のまま持つ。他社の段階名へ読み替えない。
schema_version = 1

[pricing]
# 価格・文脈長の出典を最後に読んだ日。測定値の取得日は、各 [[measurement]] が別に持つ。
retrieved = "2026-10-26"

