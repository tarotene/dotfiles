# --------------------------------------------------------------- benchmarks
# AA の API が現行モデルに値を返す評価だけを持つ(2026-10-27 の実測: 15 行すべてで非 null)。
# コード指数・tau2・terminalbench_hard は同じ行で null だったので載せない。
# unit: fraction = 0..1 の割合 / index_points = 指数の点(0..100)。
# n: 課題数。公開の信頼区間が無いベンチの区間を、n からの二項区間で計算するのに使う。
#    n が無いベンチは区間を作れず、判定は「データ不足」になる。

[benchmark.terminalbench_v4_0]
name = "Terminal-Bench 4.0"
unit = "fraction"
harness = "mini-swe-agent"
n = 66
n_unit = "tasks"
trials = 3
note = "pass@1 を課題ごとに 3 回の平均で採点。端末操作が中心。"

[benchmark.terminalbench_v4_0.source]
author = "Artificial Analysis"
title = "Artificial Analysis Intelligence Benchmarking Methodology"
url = "https://artificialanalysis.ai/methodology/intelligence-benchmarking"
retrieved = "2026-10-27"

[benchmark.scicode]
name = "SciCode"
unit = "fraction"
n = 288
n_unit = "subproblems"
note = "コードを実行して pass@1 でサブ問題ごとに採点。科学計算のコード。"

[benchmark.scicode.source]
