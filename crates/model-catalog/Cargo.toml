[package]
name = "model-catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ベンダー中立のモデルカタログ(価格・文脈長・ベンチの測定値)の宣言的な正本と、その読み書き"

# HTTP は新しい依存を足さず、github-app-snapshot と同じく curl を呼ぶ(鍵は標準入力で渡す)。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
