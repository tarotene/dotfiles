[package]
name = "detect-drift"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# ADR-0025 レジストリのスキーマ(Registry/Tool)とパーサ(parse_registry)を
# 再定義せず update-own-tools のものをそのまま使う — 単一正本(#4 の
# --file-issue が cargo/npm/pipx の drift から ADR-0025 対象を除外するのに
# 使う、fail-closed)。
update-own-tools = { path = "../update-own-tools" }
