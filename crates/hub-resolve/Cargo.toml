[package]
name = "hub-resolve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "writing-style-hub / performance-hub(scripts/ 配下の bash 版の Rust 移植、ADR-0024)と desk-hub(机の正本の解決)"

# writing-style-hub と performance-hub は同じ「マーカーファイル + 環境変数で private ハブの
# 絶対パスを解決する」薄いポインタで、差分は環境変数名・マーカー名・存在確認する README・
# 文言だけ(bash 版は片方をコピーして作られていた)。1 クレートに bin をまとめて単一正本にする。
# desk-hub は、同じ型で、机の正本のファイルまで解決する(`resolve_desk`)。
[[bin]]
name = "writing-style-hub"
path = "src/bin/writing-style-hub.rs"

[[bin]]
name = "performance-hub"
path = "src/bin/performance-hub.rs"

[[bin]]
name = "desk-hub"
path = "src/bin/desk-hub.rs"

[dev-dependencies]
tempfile.workspace = true

[dependencies]
process-env = { version = "0.1.0", path = "../process-env" }
