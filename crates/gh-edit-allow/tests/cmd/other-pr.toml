# PreToolUse: 台帳に無い PR は何も出さない(通常の確認フローに落ちる)
bin.name = "gh-edit-allow"
stdin = '{"hook_event_name":"PreToolUse","session_id":"sess-1","tool_name":"Bash","tool_input":{"command":"gh pr edit 11 -R octo/hello --title x"}}'
status.code = 0
stdout = ""
fs.sandbox = true
[env.add]
GH_EDIT_ALLOW_DIR = "."
