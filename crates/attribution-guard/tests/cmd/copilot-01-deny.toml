# copilot adapter selftest 1: フッター無しのコメントは deny(ラップ無しの直下 JSON)
bin.name = "attribution-guard"
args = ["--agent", "copilot"]
stdin = "{\"sessionId\": \"s\", \"cwd\": \"/x\", \"toolName\": \"bash\", \"toolArgs\": {\"command\": \"gh pr comment 1 --body '確認しました。'\"}}"
status.code = 0
stdout = """
{
  "permissionDecision": "deny",
  "permissionDecisionReason": "GitHub に投稿する本文に attribution がありません(deny)。本文の末尾に「🤖 Generated with [GitHub Copilot CLI](https://docs.github.com/en/copilot/how-tos/copilot-cli)」を追記してください。本文が Claude 生成でない場合(ユーザーの逐語をそのまま代理投稿する等)は、本文に「No-Attribution: <理由>」と書いて明示的に抜けてください。"
}
"""
