[package]
name = "github-audit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# lib + bin(#414): 依存側の bash(rulesets-context-check / workflow-naming-check /
# pr-merge-settings-check / apply-rulesets.sh)が source して再利用していた
# judge_* / fetch_* を、後続の移植で Rust から呼べるよう pub なライブラリ API に
# する。bin はその上の薄い CLI。
[lib]
path = "src/lib.rs"

[[bin]]
name = "github-audit"
path = "src/main.rs"

[dependencies]
hook-io = { version = "0.1.0", path = "../hook-io" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
