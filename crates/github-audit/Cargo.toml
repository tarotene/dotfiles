[package]
name = "github-audit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# lib + bin(#414): judge_* / fetch_* を pub なライブラリ API にし、bin はその上の薄い CLI。
# 依存側の bash(rulesets-context-check / workflow-naming-check / pr-merge-settings-check)が
# source していた判定は、crates/pr-contract-check に移した(settings / workflows の判定は
# そこが単一正本で、ここはその入力を組み立てる)。
[lib]
path = "src/lib.rs"

[[bin]]
name = "github-audit"
path = "src/main.rs"

[dependencies]
jq-json-compat = { version = "0.1.0", path = "../jq-json-compat" }
process-control = { version = "0.1.0", path = "../process-control" }
# settings / workflows の判定の単一正本(依存ゼロ。他リポジトリの required check も同じ関数を使う)。
pr-contract-check = { version = "0.1.0", path = "../pr-contract-check" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
