[package]
name = "ja-polish"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "日本語の文書を llm 経由で Gemini に書き直させ、通した段落の記録を残す(ja-polish)"

# 記録の型と「どの段落が未通過か」の判定を lib に置く。CLI(`ja-polish`)は書き直しを行い、
# 投稿の関所(PreToolUse、hook-router の規則)と文書ファイルの関所(Stop)は同じ lib の
# 判定を呼ぶ。記録の形式を 1 か所に保つため(docs/agents/ja-polish.md)。
[dependencies]
agent-session = { version = "0.1.0", path = "../agent-session" }
command-inspection = { version = "0.1.0", path = "../command-inspection" }
github-command = { version = "0.1.0", path = "../github-command" }
hub-resolve = { version = "0.1.0", path = "../hub-resolve" }
process-control = { version = "0.1.0", path = "../process-control" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
