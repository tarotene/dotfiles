# selftest 7 forward 外部宛 → deny
bin.name = "external-send-guard"
stdin = '{"tool_name":"mcp__claude_ai_Gmail__forward","tool_input":{"to":["stranger@example.com"]}}'
status.code = 0
stdout = """
{
  "hookSpecificOutput": {
    "hookEventName": "PreToolUse",
    "permissionDecision": "ask",
    "permissionDecisionReason": "外部宛のメールを、下書きを介さずに直接送ろうとしています(宛先: stranger@example.com)。この確認が本人の明示的な許可になり、許可すると送信されます(取り消せません)。宛先・件名・本文を確認してください。許可しないときは、create_draft で下書きにして、Gmail で本人が送ってください。"
  }
}
"""
fs.cwd = "self-cfg"
[env]
remove = ["EXTERNAL_SEND_GUARD_ALLOW"]
add = { XDG_CONFIG_HOME = "." }
