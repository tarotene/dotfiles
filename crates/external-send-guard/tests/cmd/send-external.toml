# 外部宛の send_message は deny(self.txt が無い = 自分宛 0 件、fail-closed)
bin.name = "external-send-guard"
stdin = '{"tool_name":"mcp__claude_ai_Gmail__send_message","tool_input":{"to":["someone@example.com"],"subject":"s","body":"b"}}'
status.code = 0
stdout = """
{
  "hookSpecificOutput": {
    "hookEventName": "PreToolUse",
    "permissionDecision": "deny",
    "permissionDecisionReason": "外部宛のメール送信は直接実行せず、Gmail の下書き作成(create_draft。返信は replyToMessageId 付き)を使ってください(deny)。宛先: someone@example.com。下書きを作成したら、ユーザーが Gmail 上で内容を確認・編集して送信します。あわせて、宛先アドレスが公式の一般問い合わせ窓口として文脈まで確認済みか(求人・採用等の別目的窓口の転用ではないか)を確認し、出典 URL・取得日を送信記録に残してください。"
  }
}
"""
[env]
remove = ["EXTERNAL_SEND_GUARD_ALLOW"]
add = { XDG_CONFIG_HOME = "/nonexistent/fixture-oracle" }
