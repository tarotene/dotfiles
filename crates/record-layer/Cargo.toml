[package]
name = "record-layer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# 記録の層(L0〜L4)の宣言 `.config/record-layers.toml` を読み、パスの層を引く lib(#1310)。
# hook-router の Write の拒否と、promotion-detect の日次のずれ検出の、両方が同じ宣言と同じ判定を使う
# (単一ソース)。bin は持たない: 拒否はルータの規則、検出は promotion-detect が呼ぶ。
[dependencies]
agent-session = { version = "0.1.0", path = "../agent-session" }
git-repository = { version = "0.1.0", path = "../git-repository" }
globset = "0.4.16"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.151"
