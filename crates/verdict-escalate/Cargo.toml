[package]
name = "verdict-escalate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-session = { version = "0.1.0", path = "../agent-session" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# 鍵ファイルの指紋(key_id)用。agent-settings-reconcile と同じ版(workspace の lock に既にある)。
sha2 = "0.10.9"
# レコード契約(docs/schemas/agent-verdict.schema.json)の正本を Rust の型に
# 置き、Schema はそこからの生成物にする(ADR-478 D8)。
schemars = "1.0"

[dev-dependencies]
tempfile = "3.27.0"
trycmd = "1.2.1"
