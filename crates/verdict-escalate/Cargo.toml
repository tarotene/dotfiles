[package]
name = "verdict-escalate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-session = { version = "0.1.0", path = "../agent-session" }
civil-time = { version = "0.1.0", path = "../civil-time" }
process-env = { version = "0.1.0", path = "../process-env" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# 鍵ファイルの指紋(key_id)用。agent-settings-reconcile と同じ版(workspace の lock に既にある)。
sha2.workspace = true
# レコード契約(docs/schemas/agent-verdict.schema.json)の正本を Rust の型に
# 置き、Schema はそこからの生成物にする(ADR-478 D8)。
schemars.workspace = true

[dev-dependencies]
tempfile.workspace = true
trycmd.workspace = true
