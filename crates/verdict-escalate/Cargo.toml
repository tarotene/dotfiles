[package]
name = "verdict-escalate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hook-io = { version = "0.1.0", path = "../hook-io" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# レコード契約(docs/schemas/agent-verdict.schema.json)の正本を Rust の型に
# 置き、Schema はそこからの生成物にする(ADR-0000 D8)。
schemars = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
trycmd = "1.2.1"
