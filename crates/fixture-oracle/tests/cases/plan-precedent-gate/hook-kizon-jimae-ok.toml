# hook: 既存手段: 自前 — 却下: あり → 素通し
bin.name = "plan-precedent-gate"
stdin = '''
{"session_id": "s1", "cwd": "/", "hook_event_name": "PreToolUse", "tool_name": "ExitPlanMode", "tool_input": {"plan": "## 先行例との対比\n\n- D1: 判断\n  本命: なし — 理由\n  対抗馬: 候補A (同じ軸)\n  既存手段: crates/foo — 自前 — 却下: jq (要件を満たせない)\n  先行例なし: 探索範囲\n  軸: 還元 — 理由\n"}}'''
status.code = 0
stdout = ""
[env.add]
CLAUDE_PLAN_PRECEDENT_GATE_DIR = "/nonexistent/plan-precedent-gate"
[env]
remove = ["SKIP_PLAN_PRECEDENT_GATE"]
