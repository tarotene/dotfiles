# 宛先未指定の reply はスレッド由来で判定不能 → deny
bin.name = "external-send-guard"
stdin = '{"tool_name":"mcp__claude_ai_Gmail__reply","tool_input":{"messageId":"m1","body":"b"}}'
status.code = 0
stdout = """
{
  "hookSpecificOutput": {
    "hookEventName": "PreToolUse",
    "permissionDecision": "deny",
    "permissionDecisionReason": "外部宛のメール送信は直接実行せず、Gmail の下書き作成(create_draft。返信は replyToMessageId 付き)を使ってください(deny)。宛先: (宛先未指定・スレッド由来のため判定不能)。下書きを作成したら、ユーザーが Gmail 上で内容を確認・編集して送信します。あわせて、宛先アドレスが公式の一般問い合わせ窓口として文脈まで確認済みか(求人・採用等の別目的窓口の転用ではないか)を確認し、出典 URL・取得日を送信記録に残してください。"
  }
}
"""
[env]
remove = ["EXTERNAL_SEND_GUARD_ALLOW"]
add = { XDG_CONFIG_HOME = "/nonexistent/fixture-oracle" }
