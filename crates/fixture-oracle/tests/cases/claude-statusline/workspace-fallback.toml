# project_dir → current_dir → cwd の順で解決(実在しない dir は repo なし)
bin.name = "claude-statusline"
stdin = '{"model":{"display_name":"M"},"workspace":{"current_dir":"/nonexistent/fixture-oracle/b"},"cwd":"/nonexistent/x"}'
status.code = 0
stdout = """
◆ \u001B[1;38;2;245;194;231mM\u001B[0m
"""
[env]
remove = ["HERDR_ENV", "HERDR_SOCKET_PATH", "HERDR_PANE_ID"]
add = { XDG_RUNTIME_DIR = "/nonexistent/fixture-oracle", COLUMNS = "80" }
