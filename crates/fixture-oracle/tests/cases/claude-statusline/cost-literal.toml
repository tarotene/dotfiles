# cost の数値リテラル(指数表記)も %.2f で整形する
bin.name = "claude-statusline"
stdin = '{"model":{"display_name":"M"},"cost":{"total_cost_usd":1.5E+1}}'
status.code = 0
stdout = """
◆ \u001B[1;38;2;245;194;231mM\u001B[0m \u001B[38;2;108;112;134m·\u001B[0m \u001B[38;2;148;226;213m$15.00\u001B[0m
"""
[env]
remove = ["HERDR_ENV", "HERDR_SOCKET_PATH", "HERDR_PANE_ID"]
add = { XDG_RUNTIME_DIR = "/nonexistent/fixture-oracle", COLUMNS = "80" }
