# 自動発火する機構の地図(manifest)。図(docs/pipeline-map.md と docs/assets/pipeline-map/)は
# このファイルだけから作る。手描きの複写を持たない。
#
# 検査(crates/pipeline-map、`cargo test` の tests/coverage.rs が走らせる):
#   - 登録箇所からのポインタ: Claude Code の hook 宣言(home/modules/agents.nix の
#     claudeHookDeclarations)は nix 属性 `node = "<id>";`(nix 評価時にも検査される)。
#     ルータ(hook-router)が走らせる検査は、Claude Code への登録を持たず、規則の表
#     (crates/hook-router/src/rules.rs)の `node: "<id>",` が登録箇所。
#     それ以外の登録箇所(Codex/Copilot の登録呼び出し・timer / launchd agent・workflow・
#     git hook・herdr の command 行・statusline の定義)は、直前のコメント
#     `pipeline-node: <id>`。
#   - auto = true のノードは登録箇所から 1 つ以上ポインタされていること。
#     auto = false のノード(skill・手動 CLI・外部サービス・状態ファイル)は
#     hand-off 先として描くだけで、ポインタを要求しない(ポインタされていたら fail)。
#   - label は ASCII のみ(図のフォントは CJK を持たない。日本語の説明は md の散文に書く)。
#
# 実値の扱い(ADR-0034): このリポジトリは公開。private なリポジトリ名・bucket 名などの
# 実値は書かず、役割で呼ぶ(private-issue-repo など)。
#
# 自動発火する機構を足したら: ここにノードを足し(auto = true)、登録箇所にポインタを書く。

# ---------------------------------------------------------------- lanes
# 概観図のレーン = 発火のきっかけ。order が左→右(セッションの時間軸、後半は常駐系)。
# session = true のレーンは、hub(エージェントセッション)の中で発火する(hook の event)。
# 図ではハブのコンテナの中に描き、ハブとそのレーン内のノードの間のエッジは描かない
# (deny を持つノードは枠の色で示す)。row は概観図の段(1 = セッションと一連の流れ、
# 2 = 常駐・手動・外部。省略時は 1)。
lane = [
  { id = "session-start", label = "SessionStart", order = 1, session = true },
  { id = "plan-approval", label = "Plan approval", order = 2, session = true },
  { id = "tool-call", label = "Tool call", order = 3, session = true },
  { id = "stop", label = "Turn end / Stop", order = 4, session = true },
  { id = "git-hook", label = "git hooks", order = 5 },
  { id = "ci", label = "CI (GitHub Actions)", order = 6 },
  { id = "timer", label = "Timers / periodic", order = 7, row = 2 },
  { id = "cloud", label = "Cloud / LLM", order = 8, row = 2 },
  { id = "manual", label = "Manual / skills", order = 9, row = 2 },
  { id = "external", label = "Sessions / services / state", order = 10, row = 2 },
]

# ------------------------------------------------------------ pipelines
# 詳細図の単位。1 つのノードは複数に属してよい(bleep は実装→PR と気づき→Issue の両方)。
pipeline = [
  { id = "plan-approval", label = "Plan approval", order = 1 },
  { id = "implement-to-pr", label = "Implement to PR", order = 2 },
  { id = "wrapup-to-issue", label = "Findings to Issue", order = 3 },
