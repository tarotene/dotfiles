# managed by home-manager — edit config/herdr/config.toml in the dotfiles repo,
# then `home-manager switch`. This file is a read-only store symlink, so
# in-app settings writes fail by design (ADR-0001: home-manager is the source
# of truth; ADR-0002: literal config deployed verbatim, like alacritty.toml).

onboarding = false

# 既定は delivery = "off"(トースト非表示)。stale worktree 監査
# (docs/worktree-lifecycle.md)の Herdr 通知が `{"shown":false,"reason":
# "disabled"}` を返し続けていたのはこれが原因 — 誰にも見えない状態で
# 毎分リトライしていた。in-app トーストで有効化する(アクティブタブでは
# Herdr 自身が抑制するので、作業中の割り込みは無い)。
[ui.toast]
delivery = "herdr"

[theme]
# Match the alacritty palette (Catppuccin Mocha) so panes and chrome read as
# one UI. See docs/claude/herdr-sidebar-metadata.md for the full role→color
# table shared by this file, claude-statusline.sh and alacritty.toml.
name = "catppuccin"

[theme.custom]
# 地を crust まで暗化して不透明に塗る案(旧 sidebar_bg = #11111B)は、Alacritty の
# window.opacity が「既定背景色のセルにしか適用されない」仕様(man
# alacritty.toml(5); alacritty/alacritty PR #847)と噛み合わず、サイドバーだけ
# 透過しない黒い板になってしまった。地は端末側の透過(config/alacritty/
# alacritty.toml の opacity)に任せ、theme.custom は明示 bg セル(常に不透明)側の
# 意匠だけを担当する。sidebar_bg は "reset" を明示し、テーマ既定の透過を herdr
# 0.9.x の regression(herdrdev/herdr#3773)からも守る。矩形は surface1 案の
# グレー階調(旧 active_row_bg = #45475A、矩形 vs 地 1.9:1、WCAG 非テキスト基準
# 3:1 未達)でなく accent と同系の青紫タイントにして色相差でも目立たせる
# (VS Code 標準 dark テーマの list.activeSelectionBackground が同じくグレーでは
# なく青系タイントである先行例に倣う)。selection_bg(navigate モードのカーソル行)
# もテーマ既定の surface0 より一段明るい旧 active_row_bg 相当(surface1)に引き上げる。
# 詳細は docs/claude/herdr-sidebar-metadata.md「アクティブ行の視認性」節。
sidebar_bg = "reset"       # 端末透過に委ねる(テーマ既定と同値。#3773 保険の明示)
# panel_bg も同じ保険として明示するが、chrome(サイドバー等 herdr 自身の描画)側
# にしか効かない。pane 内で動くプログラム(vt ランタイムのセル)の透過は
# herdrdev/herdr#3773 のコメントで「reattach 時にホスト端末の OSC 11 背景で
# 上書きされ、config では回避不能」と実証されている(stock default config でも
# 再現、0.9.1 での解消可否は未確認)。#314 参照。
panel_bg = "reset"         # chrome 側限定の保険。pane 側は config で回避不能
active_row_bg = "#52567A"  # lavender #B4BEFE を base に ~35% ブレンド(非純正)
selection_bg = "#45475A"   # Mocha surface1
accent = "#B4BEFE"         # Mocha lavender

[ui]
agent_panel_sort = "spaces"
# ボーダーレス化: 枠線ではなく gap + 背景階調でペインを分ける(2020年代後半の
# TUI 潮流。Catppuccin の base/mantle/crust 3 層背景もこの前提)。
pane_borders = false
pane_outer_borders = false
pane_gaps = true
# 状態は色だけでなく形でも区別する(色覚多様性対策)。
status_indicators = "symbols"
# タブバー右側: Claude の usage(5h / 週間 rate limit)+ どのマシン/時刻かを常時表示。
# usage セグメントは ~/.claude/hooks/claude-usage.sh(home/modules/claude.nix が
# 配備、Claude Code hook ではない)が非公開 API(/usage コマンドの内部エンドポイント)
# から取る。壊れたときの症状は「タブバーからこのセグメントが消える」だけ(herdr の
# command 仕様: 失敗・空出力・timeout は表示クリア)。詳細は
# docs/claude/claude-usage.md。
tab_bar_right = [
  { type = "command", command = "\"$HOME/.claude/hooks/claude-usage.sh\"", interval_seconds = 60, timeout_seconds = 10 },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = "·"

# workspace(space)行。herdr 既定の 2 行(state_icon+workspace / branch+git_status)
# を再現し、1 行目末尾にそのリポジトリの open Issue 数(PR 除く)を足す。
# $issues は ~/.local/bin/herdr-issue-counts(crates/herdr-issue-counts、
# home/modules/herdr.nix のタイマーで 5 分毎)が workspace metadata で報告する
# (ttl 15 分)。値は nf-oct-issue_opened(U+F41B)+ 件数で、0 件も表示する。
# GitHub remote の無い workspace には出ない。色は控えめ情報の subtext0。
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace", { token = "$issues", fg = "#A6ADC8" }],
  ["branch", "git_status"],
]

# Claude ペインのサイドバー行。$mode_* は config/claude/hooks/herdr-claude-metadata.sh、
# $model/$ctx/$cost/$effort は config/claude/statusline/claude-statusline.sh、$branch も
# herdr-claude-metadata.sh が(git 由来で)pane.report_metadata で注入する。トークンの
# 色は静的指定しかできないので、permission mode の色分けは「モード毎に別トークン +
# 非アクティブは reporter 側で null クリア」で表現する(1 行に 4 トークン並ぶが、
# 値を持つのは常に 1 つ)。
#
# Codex / Copilot ペインの $branch/$model は
# config/codex/hooks/herdr-codex-metadata.sh /
# config/copilot/hooks/herdr-copilot-metadata.sh がそれぞれ報告する
# (mode/ctx/cost/effort 相当は無い — 確実に取れるデータだけに絞っている。
# 詳細・見送った理由は docs/claude/herdr-sidebar-metadata.md)。
#
# $oshi(推しマーク絵文字)は 3 エージェントすべての metadata hook が、
# worktree ディレクトリ名(worktree-<name>-<hex4>、
# patches/herdr-worktree-names.patch の hololive タレント名)から
# config/herdr/oshi-marks.tsv を引いて注入する。未確証タレント・非 worktree
# ペインでは値が無く非表示。
#
# fg を明示しているのは、カラー字形が引けなかった場合の保険。カラー絵文字は
# fg を無視するので通常は効かないが、FiraCode Nerd Font 自身がモノクロ字形を
# 持つ数文字(☠ ☺ ♀ ⚡)はモノクロで描画され、fg 未指定だと既定の控えめ色に
# なって選択行の背景(#45475A)とほぼ同色になり消える。カラー化そのものは
# config/fontconfig/conf.d/75-color-emoji-fallback.conf が担当する二重防御。
#
# 配色は Catppuccin Mocha の役割トークン(詳細は docs/claude/herdr-sidebar-metadata.md):
#   blue #89B4FA(plan) / mauve #CBA6F7(default) / green #A6E3A1(accept) /
#   red #F38BA8(bypass) / pink #F5C2E7(model) / subtext0 #A6ADC8(控えめ情報)。
# 控えめ情報は旧 overlay1 #7F849C(矩形上 2.5:1)から subtext0 に引き上げ済み
# (矩形上 3.2:1)。dim はレンダラ依存で実効輝度が不定なため、暗さの表現は
# fg の明示色だけで行い dim 修飾は使わない。
[ui.sidebar.agents]
row_gap = 0

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", { token = "$oshi", fg = "#CDD6F4" }, "tab"],
  [
    { token = "$branch", fg = "#A6ADC8" },
    { token = "terminal_title_stripped", fg = "#A6ADC8" },
  ],
  [
    { token = "$mode_plan", fg = "#89B4FA", bold = true },
    { token = "$mode_default", fg = "#CBA6F7", bold = true },
    { token = "$mode_accept", fg = "#A6E3A1", bold = true },
    { token = "$mode_bypass", fg = "#F38BA8", bold = true },
    { token = "$model", fg = "#F5C2E7" },
  ],
  [
    { token = "$ctx", fg = "#A6ADC8" },
    { token = "$cost", fg = "#A6ADC8" },
    { token = "$effort", fg = "#A6ADC8" },
  ],
]
codex = [
  ["state_icon", "workspace", { token = "$oshi", fg = "#CDD6F4" }, "tab"],
  [
    { token = "$branch", fg = "#A6ADC8" },
    { token = "terminal_title_stripped", fg = "#A6ADC8" },
  ],
  [ { token = "$model", fg = "#F5C2E7" } ],
]
copilot = [
  ["state_icon", "workspace", { token = "$oshi", fg = "#CDD6F4" }, "tab"],
  [
    { token = "$branch", fg = "#A6ADC8" },
    { token = "terminal_title_stripped", fg = "#A6ADC8" },
  ],
  [ { token = "$model", fg = "#F5C2E7" } ],
]

# マウス中心の操作からキーボード操作へ移行するための未設定バインド有効化。
# 既存の既定ニーモニック(pane 移動 = prefix+hjkl、tab 切替 = prefix+p/n)の
# alt 修飾ミラーとして揃えることで記憶コストを最小化する(herdr 0.8.2
# default config のコメント例に倣う)。既定バインドとの衝突なし。
#
# 現在有効なバインド一覧は prefix+?(組み込み help overlay、この設定を反映)で
# いつでも確認できる。help 自体は既定バインドのまま未設定。
[keys]
next_agent = "prefix+alt+j"
previous_agent = "prefix+alt+k"
focus_agent = "prefix+alt+1..9"
next_workspace = "prefix+alt+n"
previous_workspace = "prefix+alt+p"
switch_workspace = "prefix+shift+1..9"
last_pane = "prefix+backtick"
