# 内蔵カメラ(IPU7)を、アプリが /dev/video40 として開ける仮想カメラにするための
# v4l2loopback のオプション(システム層)。scripts/install-packages.sh が
# /etc/modprobe.d/ へ配る。中継(v4l2-relayd)は home-manager 側の
# home/modules/webcam-builtin.nix が持つ。
#
# 各オプションの意味(`modinfo v4l2loopback` の parm、取得 2026-11-05):
#   devices=1         起動時に仮想カメラを 1 台作る。
#   video_nr=40       /dev/video40 に固定する。IPU7 の取り込み口は /dev/video0〜31 を使うので、
#                     重ならない番号にする。
#   exclusive_caps=1  OUTPUT と CAPTURE の能力を排他にして、ブラウザなどがカメラと認識する。
#   card_label        アプリのカメラ選択に出る名前。
#
# `devices=1` で GStreamer の caps 交渉が壊れる報告(NixOS の v4l2-relayd モジュールのコメント)
# があったが、この機体で 1920x1080 YUY2 を 90 枚、28.57 fps で流せたので、`devices=0` +
# `v4l2loopback-ctl add` は要らない(実測 2026-11-05)。
options v4l2loopback devices=1 video_nr=40 exclusive_caps=1 card_label="Built-in Camera"
