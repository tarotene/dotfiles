name: CI

on:
  push:
    branches: [__DEFAULT_BRANCH__]
  pull_request:
    branches: [__DEFAULT_BRANCH__]

# ADR-591(tarotene/dotfiles, docs/adr/591-ci-workflow-naming.md): only the
# `ci-passed` aggregate job (below, `needs:` all other jobs) is a required
# status check — individual job `name:` values are display labels and no
# longer need to match anything in rulesets/quality.json.
#
# ADJUST: If this project has no custom MDX content-lint scripts, remove the
# "Content lint" job here AND its entry in `ci-passed`'s `needs:`.

jobs:
  biome:
    name: Format & Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: __NODE_VERSION__
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome CI (format-check + lint + imports)
        run: npm run ci:biome

  content-lint:
    name: Content lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: __NODE_VERSION__
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and content lint (astro check + abbr + style)
        run: npm run check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: __NODE_VERSION__
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: __NODE_VERSION__
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

  # 集約 required check(ADR-591)。上の job を1つでも追加・削除したら
  # needs: をここで同期させること — tarotene/dotfiles の
  # workflow-naming-check がこの不変条件を機械検査する。
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [biome, content-lint, unit-tests, build]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
