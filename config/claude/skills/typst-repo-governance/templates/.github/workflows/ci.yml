name: CI

# ADR-591(tarotene/dotfiles, docs/adr/591-ci-workflow-naming.md): 全 PR
# ゲート job をこの1ファイルにインラインし、`ci-passed` 集約 job(全 job を
# `needs:` で束ねる)だけを required status check にする。
#
# `ci-passed` を除く全ての job を追加・削除したら、`ci-passed` の `needs:`
# も必ず同期させること(tarotene/dotfiles の `workflow-naming-check`
# required check がこの不変条件を機械検査する)。

on:
  push:
    branches: [__DEFAULT_BRANCH__]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skip heavy work when nothing relevant changed, but always report the
      # required status check so the Ruleset context is never "missing".
      - name: Detect relevant changes
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch origin "$BASE" --depth=1 2>/dev/null || true
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$MERGE_BASE" ]]; then
            echo "::warning::merge-base unavailable; defaulting to run."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$CHANGED" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ADJUST: Update PATTERNS to match your source file locations.
          PATTERNS='^(src/|lib/|data/|i18n/|fonts/|typst\.toml$|Justfile$|\.github/(workflows/ci\.yml|actions/typst-setup/))'
          if echo "$CHANGED" | grep -qE "$PATTERNS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No build-relevant changes; skipping."
          fi

      - name: Set up Typst environment
        if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/typst-setup
        with:
          cache-key: build

      - name: Build PDFs
        if: steps.guard.outputs.run == 'true'
        run: just build

      - name: Verify PDFs (ATS gate)
        if: steps.guard.outputs.run == 'true'
        run: just verify

      - name: Upload PDFs as artifact
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs-${{ github.sha }}
          path: dist/*.pdf
          retention-days: 14

  fmt:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch origin "$BASE" --depth=1 2>/dev/null || true
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$MERGE_BASE" ]]; then
            echo "::warning::merge-base unavailable; defaulting to run."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$CHANGED" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ADJUST: Update to match your source layout and config files.
          PATTERNS='^(src/|lib/|data/.*\.yml$|i18n/.*\.yml$|\.yamllint$|Justfile$|\.github/(workflows/ci\.yml|actions/typst-setup/))'
          if echo "$CHANGED" | grep -qE "$PATTERNS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No fmt-relevant changes; skipping."
          fi

      # typstyle ships as a bare binary (no archive). Download to ~/.local/bin and chmod +x.
      - name: Install typstyle
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          tag=$(gh api repos/typstyle-rs/typstyle/releases/latest --jq .tag_name)
          gh release download "$tag" --repo typstyle-rs/typstyle \
            --pattern 'typstyle-x86_64-unknown-linux-gnu' \
            --output "$HOME/.local/bin/typstyle"
          chmod +x "$HOME/.local/bin/typstyle"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install just
        if: steps.guard.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # typstyle: --check exits 1 if any file needs reformatting.
      # ADJUST: Update paths to match your Typst source layout.
      - name: Check Typst formatting
        if: steps.guard.outputs.run == 'true'
        run: typstyle --check lib/ src/

      - name: Check YAML files
        if: steps.guard.outputs.run == 'true'
        run: yamllint .

      - name: Check Justfile formatting
        if: steps.guard.outputs.run == 'true'
        run: just --fmt --check --unstable

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch origin "$BASE" --depth=1 2>/dev/null || true
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$MERGE_BASE" ]]; then
            echo "::warning::merge-base unavailable; defaulting to run."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$CHANGED" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PATTERNS='^\.github/'
          if echo "$CHANGED" | grep -qE "$PATTERNS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No lint-relevant changes; skipping."
          fi

      # actionlint validates workflow YAML syntax, expression types, and shell scripts.
      # metrics-reminder.yml is excluded via the 'files' glob negation: its heredoc
      # contains Markdown code fences (```bash) that YAML parsers cannot handle.
      # The -ignore flag matches error *messages* not file paths, so glob exclusion
      # via 'files' is the correct mechanism here.
      # ADJUST: Update the negation pattern if your excluded file has a different name.
      - name: Run actionlint
        if: steps.guard.outputs.run == 'true'
        uses: raven-actions/actionlint@v2
        with:
          files: .github/workflows/*.yml,!.github/workflows/metrics-reminder.yml

      - name: Install uv
        if: steps.guard.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5

      # zizmor audits workflows for security issues (token permissions, injection, etc.)
      - name: Run zizmor
        if: steps.guard.outputs.run == 'true'
        run: uvx zizmor .

  min-typst:
    name: Min Typst (__MIN_TYPST__)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch origin "$BASE" --depth=1 2>/dev/null || true
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$MERGE_BASE" ]]; then
            echo "::warning::merge-base unavailable; defaulting to run."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$CHANGED" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Same patterns as the build job: any source change could affect minimum-version compatibility.
          # ADJUST: Update to match your source file locations.
          PATTERNS='^(src/|lib/|data/|i18n/|fonts/|typst\.toml$|Justfile$|\.github/(workflows/ci\.yml|actions/typst-setup/))'
          if echo "$CHANGED" | grep -qE "$PATTERNS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No source changes; skipping min-Typst check."
          fi

      # Install Typst at the MINIMUM supported version, not the pinned CI version.
      # If this job fails, it means the project uses language features not available
      # in __MIN_TYPST__ — bump 'compiler' in typst.toml and __MIN_TYPST__ accordingly.
      - name: Set up Typst at minimum version (__MIN_TYPST__)
        if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/typst-setup
        with:
          typst-version: '__MIN_TYPST__'
          cache-key: min-typst

      - name: Build PDFs (min-version check)
        if: steps.guard.outputs.run == 'true'
        run: just build

  # 集約 required check(ADR-591)。上の job を1つでも追加・削除したら
  # needs: をここで同期させること — tarotene/dotfiles の
  # workflow-naming-check がこの不変条件を機械検査する。
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [build, fmt, lint, min-typst]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
