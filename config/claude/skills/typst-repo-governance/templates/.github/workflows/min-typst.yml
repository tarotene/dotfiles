name: Min Typst

on:
  push:
    branches: [__DEFAULT_BRANCH__]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  min-typst:
    # IMPORTANT: This name must exactly match the 'context' string in rulesets/quality.json.
    # Both are placeholder-substituted simultaneously — if you rename this job, update quality.json too.
    name: Min Typst (__MIN_TYPST__)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch origin "$BASE" --depth=1 2>/dev/null || true
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$MERGE_BASE" ]]; then
            echo "::warning::merge-base unavailable; defaulting to run."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$CHANGED" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Same patterns as build.yml: any source change could affect minimum-version compatibility.
          # ADJUST: Update to match your source file locations.
          PATTERNS='^(src/|lib/|data/|i18n/|fonts/|typst\.toml$|Justfile$|\.github/(workflows/min-typst\.yml|actions/typst-setup/))'
          if echo "$CHANGED" | grep -qE "$PATTERNS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No source changes; skipping min-Typst check."
          fi

      # Install Typst at the MINIMUM supported version, not the pinned CI version.
      # If this job fails, it means the project uses language features not available
      # in __MIN_TYPST__ — bump 'compiler' in typst.toml and __MIN_TYPST__ accordingly.
      - name: Set up Typst at minimum version (__MIN_TYPST__)
        if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/typst-setup
        with:
          typst-version: '__MIN_TYPST__'
          cache-key: min-typst

      - name: Build PDFs (min-version check)
        if: steps.guard.outputs.run == 'true'
        run: just build
