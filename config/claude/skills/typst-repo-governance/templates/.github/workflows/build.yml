name: Build

on:
  push:
    branches: [__DEFAULT_BRANCH__]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skip heavy work when nothing relevant changed, but always report the
      # required status check so the Ruleset context is never "missing".
      - name: Detect relevant changes
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch origin "$BASE" --depth=1 2>/dev/null || true
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$MERGE_BASE" ]]; then
            echo "::warning::merge-base unavailable; defaulting to run."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$CHANGED" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ADJUST: Update PATTERNS to match your source file locations.
          PATTERNS='^(src/|lib/|data/|i18n/|fonts/|typst\.toml$|Justfile$|\.github/(workflows/build\.yml|actions/typst-setup/))'
          if echo "$CHANGED" | grep -qE "$PATTERNS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No build-relevant changes; skipping."
          fi

      - name: Set up Typst environment
        if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/typst-setup
        with:
          cache-key: build

      - name: Build PDFs
        if: steps.guard.outputs.run == 'true'
        run: just build

      - name: Verify PDFs (ATS gate)
        if: steps.guard.outputs.run == 'true'
        run: just verify

      - name: Upload PDFs as artifact
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs-${{ github.sha }}
          path: dist/*.pdf
          retention-days: 14
