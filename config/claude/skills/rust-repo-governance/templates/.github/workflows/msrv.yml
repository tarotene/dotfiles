name: MSRV

on:
  push:
    branches: [__DEFAULT_BRANCH__]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_TOOLCHAIN: "__MSRV_FULL__"

jobs:
  msrv:
    # IMPORTANT: This job name must exactly match the required status check context
    # in rulesets/quality.json ("MSRV (__MSRV__)"). After seed.sh substitution both
    # become e.g. "MSRV (1.88)".
    name: MSRV (__MSRV__)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE" --depth=1 2>/dev/null || true
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$MERGE_BASE" ]]; then
            echo "::warning::merge-base unavailable; defaulting to run."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$CHANGED" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ADJUST: MSRV check covers all manifest groups. Update paths to match your
          # workspace members, excluded crates, and embedded examples.
          PATTERNS='^(telepath-(wire|server|client|macros)/|examples/(host-pty-server|nrf52840-ping)/|tools/__CLI_CRATE__/|Cargo\.(toml|lock)$|Justfile$|rust-toolchain\.toml$|\.github/(workflows/msrv\.yml|actions/rust-setup/))'
          if echo "$CHANGED" | grep -qE "$PATTERNS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No MSRV-relevant changes; skipping."
          fi

      - name: Setup Rust environment (MSRV __MSRV_FULL__)
        if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/rust-setup
        with:
          toolchain: '__MSRV_FULL__'
          # ADJUST: Remove thumbv7em-none-eabi if not doing embedded cross-compilation.
          targets: thumbv7em-none-eabi
          cache-key: msrv-__MSRV_FULL__
          install-libudev: 'true'

      # ADJUST: The check-all recipe must compile everything under MSRV.
      # Update the Justfile check-all recipe to include/exclude sub-builds as needed.
      - name: Verify MSRV builds (workspace + cli + firmware)
        if: steps.guard.outputs.run == 'true'
        run: just check-all
