# OPTIONAL: Remove this entire workflow (and the "Firmware (cross-compile nRF52840-DK)"
# entry from rulesets/quality.json) if your project does not include embedded firmware.
# If you use a different MCU, update the job name to match your target board — it must
# exactly match the required status check context in rulesets/quality.json.

name: Firmware

on:
  push:
    branches: [__DEFAULT_BRANCH__]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  firmware:
    name: Firmware (cross-compile nRF52840-DK)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE" --depth=1 2>/dev/null || true
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$MERGE_BASE" ]]; then
            echo "::warning::merge-base unavailable; defaulting to run."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD" 2>/dev/null || echo '')"
          if [[ -z "$CHANGED" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ADJUST: Update crate directory names and the embedded example path.
          # Root Cargo.{toml,lock} intentionally excluded: the firmware example is a
          # separate workspace and is unaffected by root manifest changes.
          PATTERNS='^(telepath-(wire|server|macros)/|examples/nrf52840-ping/|rust-toolchain\.toml$|\.github/(workflows/firmware\.yml|actions/rust-setup/))'
          if echo "$CHANGED" | grep -qE "$PATTERNS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No firmware-relevant changes; skipping."
          fi

      - name: Setup Rust environment (embedded target)
        if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/rust-setup
        with:
          # ADJUST: Update target triple for your MCU (e.g. thumbv6m-none-eabi for Cortex-M0).
          targets: thumbv7em-none-eabi
          cache-key: firmware-nrf52840
          # ADJUST: Update to your firmware example directory path.
          cache-workspaces: examples/nrf52840-ping

      # ADJUST: Update the working directory to your firmware example path.
      - name: Build firmware (release)
        if: steps.guard.outputs.run == 'true'
        working-directory: examples/nrf52840-ping
        run: cargo build --release
