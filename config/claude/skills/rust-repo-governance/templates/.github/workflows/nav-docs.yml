name: Navigational documents

on:
  push:
    branches: [__DEFAULT_BRANCH__]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nav-docs:
    name: No materialised trees/inventories in navigational docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check README/CONTRIBUTING/AGENTS.md/CLAUDE.md and subdirectory READMEs
        run: bash scripts/check-nav-docs.sh
