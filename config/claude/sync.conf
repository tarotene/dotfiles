# Claude User Memory Synchronization Configuration
# XDG Base Directory compliant configuration

[sync]
# Enable/disable synchronization
enabled = true

# Synchronization method: rsync, git, or none
method = "rsync"

# Sync frequency: manual, on_change, or periodic
frequency = "on_change"

# Global CLAUDE.md synchronization
sync_global = true

# Project-specific CLAUDE.md synchronization
sync_projects = true

[locations]
# Primary Claude config directory (XDG compliant)
config_dir = "${XDG_CONFIG_HOME}/claude"

# Legacy Claude directory (for backward compatibility)
legacy_dir = "${HOME}/.claude"

# Backup directory for conflict resolution
backup_dir = "${XDG_CONFIG_HOME}/claude/backups"

[remote]
# Remote synchronization targets (comma-separated)
# Format: user@host:path or /path/to/shared/storage
targets = ""

# SSH key for remote sync (optional)
ssh_key = ""

[conflict_resolution]
# Strategy: ask, newer, local, remote, backup
strategy = "ask"

# Automatic backup before sync
auto_backup = true

# Keep backup history (days)
backup_retention = 30

[logging]
# Log level: debug, info, warn, error
level = "info"

# Log file location
log_file = "${XDG_CONFIG_HOME}/claude/sync.log"