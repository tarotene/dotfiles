# Character-type locale for the whole session: makes fontconfig / cosmic-text
# prefer Japanese (Noto CJK JP) glyph fallback for CJK codepoints while the UI
# language stays English (LANG=en_US.UTF-8 from the system).
# Do NOT set LC_ALL here — it would force-override every LC_* category.
LC_CTYPE=ja_JP.UTF-8
