
[window]
# Initial window size (columns and rows)
dimensions = { columns = 100, lines = 30 }

# Window padding (top, bottom, left, right margins)
padding = { x = 10, y = 10 }

# Enable dynamic padding (distribute padding evenly around content)
dynamic_padding = true

# Background opacity (0.0 to 1.0)
opacity = 0.75

# Blur
blur = true

# Window startup mode
startup_mode = "Windowed"

# Window title
title = "Alacritty Terminal"

# Allow terminal applications to change the title
dynamic_title = true

[scrolling]
# Maximum number of lines in scrollback buffer
history = 10000

# Number of lines to scroll
multiplier = 3

[font]
# Normal font
normal = { family = "FiraCode Nerd Font", style = "Regular" }

# Bold font
bold = { family = "FiraCode Nerd Font", style = "Bold" }

# Italic font
italic = { family = "FiraCode Nerd Font", style = "Italic" }

# Bold italic font
bold_italic = { family = "FiraCode Nerd Font", style = "Bold Italic" }

# Font size
size = 13.0

# Character spacing offset
offset = { x = 0, y = 1 }

# Glyph offset
glyph_offset = { x = 0, y = 0 }

# Whether to use built-in box drawing characters
builtin_box_drawing = true


[colors.primary]
# Foreground color
foreground = "#F8F8F2"
# Background color
background = "#282A36" # Dracula theme background

[colors.normal]
# Black
black = "#000000"
# Red
red = "#FF5555"
# Green
green = "#50FA7B"
# Yellow
yellow = "#F1FA8C"
# Blue
blue = "#BD93F9"
# Magenta
magenta = "#FF79C6"
# Cyan
cyan = "#8BE9FD"
# White
white = "#BFBFBF"

[colors.bright]
# Bright black
black = "#4D4D4D"
# Bright red
red = "#FF6E67"
# Bright green
green = "#5AF78E"
# Bright yellow
yellow = "#F4F99D"
# Bright blue
blue = "#CAA9FA"
# Bright magenta
magenta = "#FF92D0"
# Bright cyan
cyan = "#9AEDFE"
# Bright white
white = "#E6E6E6"

[colors.cursor]
# Cursor text color
text = "CellBackground"
# Cursor color
cursor = "#F8F8F2"

[cursor]
# Cursor style
style = { shape = "Underline", blinking = "Always" }

# Cursor blink interval (milliseconds)
blink_interval = 500

# Timeout before cursor stops blinking (seconds)
blink_timeout = 5

[general]
# Alacritty Configuration

# Enable live config reload
live_config_reload = true

# Shift+Return sends ESC sequence followed by carriage return
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"
