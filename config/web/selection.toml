# 作業の種類 → 選び方の対応表(ADR-1703)。
#
# 部品や振る舞いが要るとき、手で作り直す前に、この表で「どの手段を選ぶか」を引く。順序は
#   platform(ブラウザ標準の要素)→ shared(`config/web/` の共有の部品)→ external(外部ライブラリ)
# で、どれにも当てはまらない作業だけが、手書き(handwritten)か、使わない(not-used)になる。
# 表に無い作業が出たら、行を足す(裁定を、この表に残す)。
#
# way(選び方。閉じた語彙):
#   platform     ブラウザ標準の要素で済ませる。`use` に使う要素、`baseline` に Baseline の状態を書く。
#                `baseline` は `widely`(Widely available)だけ書ける。newly の機能は、この行にできない。
#   shared       `config/web/` の共有の部品を使う。`files` に、使う共有のファイル(実在が検査される)。
#   external     外部のライブラリを使う。`pin`(版)と `sha256`(同梱するファイルの値)が要る。
#                読み込みは、同梱して自分のサイトから配る(第三者から読み込まない。ADR-1677 D6)。
#   handwritten  手書きのまま残す。`reason = "few-surfaces"`(使う面が少なく、共有の部品にしない)。
#                使う面が増えたら、共有にするかを裁定し直す。
#   not-used     使わない。`reason` が `requirement` なら、`req` に、その選び方と向きが逆の要件(`page-types.toml` の ID)。
#                `reason` が `no-surface` なら、該当する面が無い(出たら、この表に行を足して裁定する)。
#
# `note` は人が読む補足で、検査しない(Baseline の取得日・面の実測など、日付つきの事実を書く)。

[[task]]
id = "dialog"
title = "ダイアログ"
way = "platform"
use = "`<dialog>` 要素(`showModal()`・`close()`)"
baseline = "widely"
note = "Baseline widely(high_date 2024-09-14)。web-platform-dx の公開 API https://api.webstatus.dev/v1/features/dialog (取得 2026-11-24)。確認ダイアログ(`confirm`)は別の行(F4)"

