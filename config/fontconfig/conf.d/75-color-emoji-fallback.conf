<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  managed by home-manager — edit config/fontconfig/conf.d/75-color-emoji-fallback.conf
  in the dotfiles repo, then `hms`.

  端末(Alacritty + Herdr)で絵文字がカラー字形で出るようにする。

  既定のフォールバック解決順は
    Noto Sans Symbols2(モノクロ) → Unifont Upper(モノクロビットマップ)
    → DejaVu Sans / FreeSerif(モノクロ) → Noto Color Emoji
  で、カラー絵文字フォントが入っているのに最後尾に回る。モノクロ字形は
  前景色を継承するため、Herdr サイドバーの選択行(背景 #45475A)では
  推しマークが背景とほぼ同色になって消えていた
  (docs/claude/herdr-sidebar-metadata.md 系統 B)。

  fontconfig の照合順位は FAMILY_STRONG > LANG > FAMILY_WEAK なので、
  weak な family 追加では lang カバレッジの広い DejaVu Sans などに負ける。
  実測でも weak prepend では推しマーク 94 コードポイント中 18 個がモノクロの
  ままだった。strong binding で追加すると解決する。

  ただし strong binding を全パターンに効かせると、generic family
  (monospace / sans-serif / serif)の弱いエイリアスにも勝ってしまい、
  `fc-match monospace` が Noto Color Emoji を返すようになる。そこで
  **端末のフォント(FiraCode Nerd Font)を明示要求したパターンに限定**する。
  これで影響範囲は端末だけに収まり、Chrome や COSMIC の文字送りは変わらない。

  append なので FiraCode 自身が持つ字形(✓ / powerline / Nerd Font アイコン)と
  CJK フォールバックは従来どおり優先される。副作用として、FiraCode が
  モノクロ字形を持つ ☠ ☺ ♀ ⚡ の 4 つだけは引き続きモノクロで出る —
  config/herdr/config.toml 側で $oshi に fg を明示しているのはこのため。

  検証: fc-match "FiraCode Nerd Font:charset=1f3a7" が Noto Color Emoji、
        fc-match monospace / sans-serif / serif が変わらないこと。
-->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>FiraCode Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
