# managed by home-manager — edit config/wireplumber/wireplumber.conf.d/51-bluez-sbc-xq.conf
# in the dotfiles repo, then `hms`. WirePlumber の読み直しには
# `systemctl --user restart wireplumber` が要る。
#
# Bluetooth ヘッドホンの A2DP を、SBC でなく SBC-XQ(SBC の高ビットレート版)で
# 鳴らす。
#
# 既定では a2dp-sink(SBC、priority 132)が a2dp-sink-sbc_xq(priority 131)に
# 勝つ。コーデックの順位が固定表で SBC が先頭のため
# (pipewire 1.5.85 spa/plugins/bluez5/codec-loader.c:33-43、
#  bluez5-device.c:2096-2112)。WirePlumber の選択フックは
#   保存済みプロファイル → device.profile.priority.rules → 優先度の最大値
# の順に評価するので(wireplumber 0.5.12 scripts/device/find-preferred-profile.lua)、
# ここで順序を宣言すれば保存値が無い機器に効く。
#
# 通話(HFP/mSBC)への自動切り替えと、通話後に直前のプロファイルへ戻る動作は
# WirePlumber の既定のまま(autoswitch-bluetooth-profile.lua)。
#
# AAC を採らない理由: 本機(Shokz OpenFit Pro)は AAC 対応だが、apt の
# libspa-0.2-bluetooth は fdk-aac が non-free のため AAC プラグインを持たない
# (https://tookmund.com/2024/02/aac-and-debian)。apt の外から .so を足すと
# PipeWire の更新で ABI がずれうる(codec-loader.c:107)うえ、PipeWire 上で AAC が
# SBC-XQ より良いという実測も見つかっていない。SBC-XQ の実測は
# https://soundexpert.org/articles/-/blogs/1452517(551 kbps で aptX HD 相当)。
# 取得 2026-10-21。
#
# SBC-XQ を出さない機器では a2dp-sink にそのまま落ちる。途切れる機器があれば
# この drop-in を外せば元に戻る。

device.profile.priority.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        priorities = [ "a2dp-sink-sbc_xq" "a2dp-sink" ]
      }
    }
  }
]
