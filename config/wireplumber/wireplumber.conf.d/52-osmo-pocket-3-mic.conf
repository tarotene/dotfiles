# managed by home-manager — edit config/wireplumber/wireplumber.conf.d/52-osmo-pocket-3-mic.conf
# in the dotfiles repo, then `hms`. WirePlumber の読み直しには
# `systemctl --user restart wireplumber` が要る。
# 機器側の手順・実測値は docs/webcam-osmo-pocket-3.md。
#
# Osmo Pocket 3 を Webcam モードで刺している間、その USB マイクを既定の入力に
# する。Osmo のマイクには DJI Mic 2 の音も乗る(2026-10-23 に vega で実測)。
#
# 既定では刺しても既定にならない。WirePlumber の既定ノードの選択は、
#   priority.session の最大(find-best-default-node.lua)
#   + 過去に選んだ機器 に 20001-i(state-default-nodes.lua:48)
#   + いま選んでいる機器(default.configured.audio.source)に 30000
#     (find-selected-default-node.lua:55)
# で決まる。Osmo の入力ノードの priority.session は 2009 で、内蔵マイクを
# 手で選んでいると 32009 に負ける。いずれも wireplumber 0.5.8 の
# /usr/share/wireplumber/scripts/default-nodes/ を読んだ(取得 2026-10-23)。
#
# 40000 は上の加点の最大(2009 + 30000)を超えるので、刺さっている間は
# 手で選んだ入力にも、過去に選んだ入力にも勝つ(vega で実機確認、2026-10-23)。
# 抜くと、残りのノードで決め直され、内蔵マイクに戻るはず(実機では未確認)。
#
# 代償: 刺さっている間は、GUI で別のマイクを選んでも効かない。別のマイクを
# 使いたいときは、Osmo を抜くか、Osmo の USB モードを Webcam 以外にする。
#
# OpenFit Pro(#892)との関係: 50-switch-on-connect.conf はヘッドセット接続時に
# 既定の入力をヘッドセットへ移すが、移した先の優先度は上の式で Osmo に負けるはず。
# そうなら Osmo が刺さっていればヘッドセットは出力専用(A2DP のまま)になる
# (ソースから導いた予想。ヘッドセットを繋いだ実機確認はまだ)。
# playback 側(alsa_output.usb-DJI…、priority.session 1009)はここでは触らない。
# 内蔵スピーカーの 2009 のほうが高く、blocklist ^alsa_ は USB の出力を
# 切り替え対象から除いているので、出力は Osmo に移らない。
#
# node.name には機体のシリアルが入る(alsa_input.usb-DJI_DJIPocket3_<serial>-02…)。
# シリアルは書かず、前方の固定部分だけに `.*` で一致させる。書式は apt 同梱の
# /usr/share/wireplumber/wireplumber.conf.d/alsa-vm.conf と同じ。

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-DJI_DJIPocket3.*" }
    ]
    actions = {
      update-props = {
        priority.session = 40000
      }
    }
  }
]
