# browser-settings(#1420)が操作する、サービスごとの設定画面の探索。コードにサービスを足さず、ここに足す。
#
#   [service.<名前>]
#   url   = "<設定画面の URL>"
#   steps = [ { click = "<開くために押す要素の CSS 選択子>" }, { wait = "<出るまで待つ要素の CSS 選択子>" } ]   # 省略できる
#   field = "<読み書きする項目の CSS 選択子(input・textarea・contenteditable)>"
#
# サービスの画面の選択子は、画面を実際に読んで確かめてから足す(未確認の選択子を推測で書かない)。
# 各サービスへのログインは、専用プロファイルで、最初の 1 回だけ人が手で行う: `browser-settings login <名前>`。
# 保存の確定は人が行う。`paste` は入力欄に入れて読み戻すだけで、保存ボタンは押さない。
