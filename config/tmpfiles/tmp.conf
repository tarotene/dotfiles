# /tmp を「再起動を越えて 14 日残る」場所にする(システム層)。
# scripts/install-packages.sh が /etc/tmpfiles.d/tmp.conf へ配る。同名のファイルは
# /usr/lib/tmpfiles.d/tmp.conf を丸ごと置き換える(tmpfiles.d(5))。
#
# 背景: 配布元の規則は `D /tmp 1777 root root 30d`。型 `D` は、起動時に走る
# `systemd-tmpfiles --create --remove --boot`(systemd-tmpfiles-setup.service)で中身を
# 全部消す。コーディングエージェントは一次成果物(計画・下書き・出力)を /tmp に
# 書く癖があり、電源断や再起動で失われる。実例: anthropics/claude-code#92166
# 「Scratchpad directory under /tmp is erased on reboot (systemd-tmpfiles)」
# (取得 2026-10-29)。`$TMPDIR` を差し替えても、`/tmp/...` と直接書かれた分は
# 救えないので、/tmp そのものの意味を替える。
#
# 型を `d` にすると起動時の全消去だけが止まり、日数による掃除(日次の
# systemd-tmpfiles-clean.timer、`--clean`)は残る。FHS 2.3 は /tmp の起動時の
# 消去を「推奨」にとどめ、義務としていない(「it is recommended that files and
# directories located in /tmp be deleted whenever the system is booted」、
# https://www.pathname.com/fhs/pub/fhs-2.3.html、取得 2026-10-29)。
#
# 14 日は ~/Downloads の掃除(home/modules/downloads.nix)と同じ。判定は
# atime・mtime・ctime のいずれか新しければ延命する tmpfiles 既定で、`/` が noatime の
# ため実質「最後の変更から 14 日」。開いて読むだけでは延命しない。
#
# 引き換えに、古いロックファイルやソケットが再起動を越えて残る。
# /tmp/systemd-private-* は /usr/lib/tmpfiles.d/systemd-tmp.conf の別の規則
# (`R!`)が起動時に消すので、この変更の影響を受けない。
d /tmp 1777 root root 14d
