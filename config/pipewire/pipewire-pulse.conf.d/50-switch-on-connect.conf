# managed by home-manager — edit config/pipewire/pipewire-pulse.conf.d/50-switch-on-connect.conf
# in the dotfiles repo, then `hms`. 読み直しには
# `systemctl --user restart pipewire-pulse` が要る。
#
# Bluetooth のヘッドホン・ヘッドセットが接続されたら、既定の出力先と入力先を
# そちらへ移す。
#
# 既定では移らない。WirePlumber は手で選んだ出力先(default.configured.audio.sink)に
# 30000 を足す(wireplumber 0.5.12 scripts/default-nodes/find-selected-default-node.lua:52)
# ので、priority.session が 1010 の Bluetooth sink は、いったんスピーカーを
# 選んだあとの接続では勝てない。
#
# module-switch-on-connect は、新しいノードが現れたときに既定の出力先・入力先を
# 書き込む(pipewire 1.5.85
# src/modules/module-protocol-pulse/modules/module-switch-on-connect.c:135-142)。
# 手で選ぶのと同じ書き込みなので、接続後にスピーカーを手で選べばそちらが効く。
# 取得 2026-10-21。
#
# blocklist は ノード名に対する正規表現。既定の "hdmi" を "^alsa_" に変え、
# 内蔵・USB・HDMI の ALSA 機器では切り替えない(Bluetooth だけに絞る)。
# 内蔵 PCI/ISA の機器は、モジュール側で HDMI sink 以外を既に除外している
# (同ファイル:112-119)。
#
# 入力も Bluetooth のマイクへ移る。マイクを常時開くアプリがあると、通話して
# いなくても通話モード(HFP)に落ちる(autoswitch-bluetooth-profile.lua)。

pulse.cmd = [
  { cmd = "load-module" args = "module-switch-on-connect blocklist=^alsa_" }
]
