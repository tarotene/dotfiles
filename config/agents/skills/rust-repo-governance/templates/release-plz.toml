[workspace]
# crates.io への publish は opt-in。播いた直後は false のままにする。
#
# Trusted Publishing は crate が既に crates.io に存在することを要求するので
# (reference/manual-steps.md「First publish (bootstrap — one time per
# crate)」)、まだ存在しない crate を publish 可能なまま播くと、release job が
# 毎回失敗し続ける。CI job が緑だとこの失敗は一覧で埋もれる
# (tarotene/dotfiles#659 の実例: 失敗に気づくまで 2 日)。
#
# ADJUST: crates.io で配布する repo では、(1) manual-steps.md の bootstrap
# publish を済ませ、(2) Trusted Publishing を登録してから、この行を消す
# (既定の true に戻る)。publish しない repo ではこの行をそのまま残す —
# release-plz は publish = false でも git tag と GitHub Release を作る
# (release-plz docs "Configuration" https://release-plz.dev/docs/config、
# 取得 2026-10-01)。
publish = false
git_release_enable = false
git_tag_enable = false
git_release_name = "v{{ version }}"
changelog_update = true
changelog_path = "./CHANGELOG.md"
pr_labels = ["release"]
dependencies_update = false
release_commits = "^(feat|fix|perf|refactor)"

[changelog]
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] \
{%- if previous %}\
{%- if previous.version %}\
([`{{ version | trim_start_matches(pat="v") }}`](https://github.com/__OWNER__/__REPO__/compare/{{ previous.version }}..{{ version }}))\
{% endif %}\
{% endif %} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits | filter(attribute="merge_commit", value=false) %}
- {% if commit.breaking %}**[BREAKING]** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.remote.pr_number %} \
([#{{ commit.remote.pr_number }}](https://github.com/__OWNER__/__REPO__/pull/{{ commit.remote.pr_number }}))\
{% endif %}
{% endfor %}
{% endfor %}
"""

# Single-tag pattern: __CANONICAL_CRATE__ is the canonical tag owner.
# One vX.Y.Z tag and one GitHub Release cover all workspace members (unified versioning).
[[package]]
name = "__CANONICAL_CRATE__"
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"

# ADJUST: Only needed once you have removed the workspace-level
# `publish = false` above (i.e. this repository does distribute on crates.io)
# and one member should still stay off the registry — e.g. a binary example
# crate or an integration test harness. While the workspace-level default is
# false, this block is redundant; delete it.
[[package]]
name = "host-pty-server"
publish = false

# ADJUST: Add one [[package]] block per additional publishable workspace crate.
# Minimal entry — release-plz handles versioning automatically:
#
# [[package]]
# name = "my-other-crate"
