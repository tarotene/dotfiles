/* 構造: ステップ型(1 件 1 画面 + 全件の概観 + 選ぶと次へ + 最後に確認画面 + 完了画面)。画面の枠は、ページを縦に動かさず、動くのは本体の領域だけ。
   選択肢は固定の格子。「あとで」と「その他」は、どの種類でも下の同じ 2 マス。押す場所は、どの件でも同じ位置(FORMAT.md「ページの並べ方」)。 */
/* design-pin:begin variables.css */
/*
 * Web の面(GitHub Pages・Cloudflare Workers のサイト・claude.ai の Artifact の雛形)が共有する、
 * デザイントークンの正本。基準は ADR-1677、配り方は ADR-1685(docs/adr/)。
 *
 * 層は 2 つ。
 *   1. 原色(`--ref-*`): 16 進の値だけを持つ。このファイルでだけ 16 進を書く。
 *   2. 役割(`--bg` など): 原色を `var()` で指し、明暗は `light-dark()` で 1 回だけ書く。
 * 面ごとのテーマは、このファイルの後に、役割(`--accent`・`--on-accent`・`--accent-text`・`--focus`)の
 * 値だけを上書きする。役割の集合と、状態の色(`--ok`・`--ng`・`--warn`)の意味は変えない。
 *
 * 明暗の切り替えは、OS の設定に追従するだけにする(切り替えの UI を持たない)。claude.ai の Artifact は、
 * ホストが root に `data-theme="light"`・`data-theme="dark"` を付けることがあるので、その契約に
 * `color-scheme` で応える(下の 2 つの規則)。`@media (prefers-color-scheme)` の二重書きは要らない。
 *
 * このファイルの 16 進の値と寸法は、デジタル庁デザインシステム(DADS)のデザイントークンを出発点にした。
 *   出典: https://github.com/digital-go-jp/design-tokens (examples/tokens.css、commit 9891ff60f0b35917eebec66d83094ff43ae24626、
 *         2026-10-20。取得 2026-11-24)
 *   ライセンス: MIT。著作権表示と許諾文は licenses/digital-agency-design-system.MIT に残す。
 * 加工した旨(DADS の「利用上の注意事項」が求める記載): このファイルは、DADS のトークンを編集・加工したもので、
 * デジタル庁が作成したものではない。デジタル庁のロゴ・キーカラーの規定は使わない。
 *
 * DADS から変えた点(理由つき):
 *   - 明暗の役割で書き直した。DADS のトークンは明の画面だけを定める。暗の値は、同じ原色の階調から、
 *     WCAG 2.2 AA(文字 4.5:1、図形 3:1)を満たす階調を選んだ(`crates/repo-structure-check` の `web_variables` が検査する)。
 *   - `--ref-gray-850`(#262626)は DADS に無い。暗の `--surface` を、背景(gray-900)から区別するために足した。
 *   - 警告の文字は、DADS の semantic の orange-800 でなく orange-900 にした。明の面(#ffffff・#f2f2f2)の上で、
 *     余裕を持って 4.5:1 を超えるため。
 *   - 書体は、機体の書体を既定にする(ADR-1677 D6)。Linux の和文の書体名 `Noto Sans CJK JP` を足した。
 *     第三者からの書体の読み込みは禁止(`web_assets` が検査する)。
 */

:root {
  /* ── 層 1: 原色(DADS のトークン名の階調) ─────────────────────────── */
  --ref-white: #ffffff;
  --ref-gray-50: #f2f2f2;
  --ref-gray-200: #cccccc;
  --ref-gray-300: #b3b3b3;
  --ref-gray-400: #999999;
  --ref-gray-536: #767676;
  --ref-gray-700: #4d4d4d;
  --ref-gray-850: #262626;
  --ref-gray-900: #1a1a1a;
  --ref-blue-300: #9db7f9;
  --ref-blue-900: #0017c1;
  --ref-green-50: #e6f5ec;
  --ref-green-300: #71c598;
  --ref-green-800: #197a4b;
  --ref-green-1100: #08351f;
  --ref-red-50: #fdeeee;
  --ref-red-300: #ff9696;
  --ref-red-900: #ce0000;
  --ref-red-1200: #620000;
  --ref-orange-50: #ffeee2;
  --ref-orange-300: #ffa66d;
  --ref-orange-900: #ac3e00;
  --ref-orange-1200: #541e00;

  /* ── 層 2: 役割(明, 暗)。面ごとのテーマが上書きしてよいのは、accent の 4 つだけ ── */
  --bg: light-dark(var(--ref-white), var(--ref-gray-900));
  --surface: light-dark(var(--ref-gray-50), var(--ref-gray-850));
  --text: light-dark(var(--ref-gray-900), var(--ref-gray-50));
  --text-muted: light-dark(var(--ref-gray-700), var(--ref-gray-300));
  --border: light-dark(var(--ref-gray-536), var(--ref-gray-400));
  --border-subtle: light-dark(var(--ref-gray-200), var(--ref-gray-700));
  --accent: light-dark(var(--ref-blue-900), var(--ref-blue-300));
  --on-accent: light-dark(var(--ref-white), var(--ref-gray-900));
  --accent-text: light-dark(var(--ref-blue-900), var(--ref-blue-300));
  --focus: light-dark(var(--ref-blue-900), var(--ref-blue-300));
  --ok: light-dark(var(--ref-green-800), var(--ref-green-300));
  --ok-bg: light-dark(var(--ref-green-50), var(--ref-green-1100));
  --ng: light-dark(var(--ref-red-900), var(--ref-red-300));
  --ng-bg: light-dark(var(--ref-red-50), var(--ref-red-1200));
  --warn: light-dark(var(--ref-orange-900), var(--ref-orange-300));
  --warn-bg: light-dark(var(--ref-orange-50), var(--ref-orange-1200));

  /* ── 尺度 ──────────────────────────────────────────────────────── */
  --font-sans: "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "Noto Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --fs-small: 0.875rem;
  --fs-body: 1rem;
  --fs-lead: 1.125rem;
  --fs-h3: 1.25rem;
  --fs-h2: 1.5rem;
  --fs-h1: 2rem;
  --lh-body: 1.7;
  --lh-tight: 1.4;
  --measure: 40em;
  --radius-s: 0.25rem;
  --radius-m: 0.5rem;
  --radius-l: 0.75rem;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --target-min: 1.5rem;
  --target: 2.75rem;
  --dur-fast: 100ms;
  --dur: 200ms;
  --dur-slow: 400ms;

  color-scheme: light dark;
}

/* claude.ai の Artifact は、ホストが root に data-theme を付けることがある。 */
:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur: 0ms;
    --dur-slow: 0ms;
  }
}
/* design-pin:end variables.css */
/* このページのテーマ: 主色(accent の 4 つ)だけを、この面の値にする(ADR-1677 D3)。ほかの役割と状態の色は、正本のまま。 */
:root {
  --accent: light-dark(#1f6f78, #5fb7bf);
  --on-accent: light-dark(#ffffff, #0c1719);
  --accent-text: light-dark(#1f6f78, #5fb7bf);
  --focus: light-dark(#1f6f78, #5fb7bf);
  --chosen: color-mix(in srgb, var(--accent) 14%, var(--bg));
}
/* design-pin:begin components.css */
/*
 * 共有の部品(ADR-1687)。variables.css の役割と尺度だけを参照する(16 進・原色を直書きしない)。
 * 面ごとのテーマは variables.css の役割を上書きするので、部品は書き換えずに主色が変わる。
 *
 * 置き方の裁定(2026-11-24): 主な操作(次へ)と副の操作(戻る)は、HTML では主を先に書く。
 * PC(幅 40rem 以上)は「戻る」を左端、「次へ」を右端に離して置き、スマートフォンは縦に積んで
 * 「次へ」を上にする(DADS の置き方)。画面の下端に固定する帯は、基準に入れない。
 *
 *   <div class="actions">
 *     <button type="button" class="btn btn-main">次へ</button>
 *     <button type="button" class="btn btn-sub">戻る</button>
 *   </div>
 *
 * 保存の表示は、書き込みの成功を確かめてから data-state を saved にする(UX の型 P1)。
 *
 *   <span class="status" role="status" data-state="saving">保存中…</span>
 */

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* `.status` などは display を持つので、`hidden` 属性が効かなくなる。共有の振る舞い(behavior.js)が出し入れに使う。 */
[hidden] {
  display: none !important;
}

.skip-link {
  position: absolute;
  top: -4rem;
  left: var(--space-2);
  padding: var(--space-2) var(--space-4);
  background: var(--bg);
  color: var(--accent-text);
  border: 2px solid var(--accent);
  border-radius: var(--radius-m);
}

.skip-link:focus {
  top: var(--space-2);
}

.btn {
  min-height: var(--target);
  padding: var(--space-2) var(--space-5);
  border: 2px solid var(--accent);
  border-radius: var(--radius-m);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: background var(--dur) ease;
}

.btn-main {
  background: var(--accent);
  color: var(--on-accent);
}

.btn-sub {
  background: var(--bg);
  color: var(--accent-text);
}

.btn-link {
  min-height: var(--target);
  padding: 0 var(--space-2);
  border: 0;
  background: none;
  color: var(--accent-text);
  font: inherit;
  text-decoration: underline;
  cursor: pointer;
}

.actions {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

@media (min-width: 40rem) {
  .actions {
    flex-direction: row-reverse;
    justify-content: space-between;
    align-items: center;
  }
}

.choices {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  border: 0;
}

.choice {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: var(--target);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
}

.choice:has(input:checked) {
  border: 2px solid var(--accent);
  background: var(--surface);
}

.status {
  display: inline-block;
  font-size: var(--fs-small);
  color: var(--text-muted);
}

.status[data-state="saved"] {
  color: var(--ok);
}

.status[data-state="failed"] {
  color: var(--ng);
}

.alert {
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
}

.alert-ok {
  background: var(--ok-bg);
  color: var(--ok);
  border-color: var(--ok);
}

.alert-ng {
  background: var(--ng-bg);
  color: var(--ng);
  border-color: var(--ng);
}

.alert-warn {
  background: var(--warn-bg);
  color: var(--warn);
  border-color: var(--warn);
}

.empty {
  padding: var(--space-6) var(--space-4);
  color: var(--text-muted);
  text-align: center;
}

/* 表を、狭い画面で 1 行 1 枚に組み替える(列を隠さない)。各欄の名前は data-label から出す。 */
@media (max-width: 40rem) {
  .table-cards thead {
    position: absolute;
    left: -100vw;
  }

  .table-cards tr {
    display: block;
    margin-bottom: var(--space-3);
    padding: var(--space-3);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-m);
  }

  .table-cards td {
    display: flex;
    gap: var(--space-3);
    padding: var(--space-1) 0;
  }

  .table-cards td::before {
    content: attr(data-label);
    min-width: 6rem;
    color: var(--text-muted);
  }
}
/* design-pin:end components.css */
/* ここから、このページだけの規則。色・寸法は、正本の役割と尺度(`var(--…)`)から引く。 */
body { height: 100vh; height: 100dvh; overflow: hidden; }
main { height: 100%; max-width: 760px; margin-inline: auto; padding: var(--space-2) var(--space-3) calc(var(--space-2) + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: var(--space-2); }
h1, h2, h3, p { margin: 0; }
h1 { font-size: var(--fs-lead); line-height: var(--lh-tight); white-space: nowrap; }
h2 { font-size: var(--fs-body); line-height: var(--lh-tight); text-wrap: balance; }
h2[tabindex]:focus { outline: none; }
h3 { font-size: var(--fs-body); }
.sub { color: var(--text-muted); font-size: var(--fs-small); }
.mono { font-family: var(--font-mono); }
.top { display: flex; align-items: baseline; gap: var(--space-3); min-width: 0; }
.top .sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button { font: inherit; color: inherit; }
button:disabled { cursor: not-allowed; }
/* 状態行: 固定高の 1 行。普段は直前の結果だけ。キーが止まったときだけ、理由を目立たせる。 */
.statusbar { min-height: 1.5em; padding: 0 var(--space-1); font-size: var(--fs-small); line-height: 1.5; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.statusbar[data-keys="off"] { color: var(--warn); font-weight: 700; }
#dbstatus { font-size: var(--fs-small); }
.status.bad { color: var(--warn); }
.keyhelp { font-size: var(--fs-small); color: var(--text-muted); text-align: center; }
@media (hover: none), (max-width: 40rem) { .keyhelp { display: none; } }
#alert { display: flex; gap: var(--space-2); align-items: baseline; min-width: 0; padding: var(--space-1) var(--space-3); }
#alert p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-small); min-width: 0; }
/* 全件の概観: 横に送る 1 行の格子。色だけに頼らず、印(✓ あとで ! 空)も出す。押すと、その件へ飛ぶ。 */
#ovnav { display: grid; gap: 2px; }
.overview { display: flex; flex-wrap: nowrap; gap: var(--space-2); margin: 0; padding: 3px 2px 5px; list-style: none; overflow-x: auto; scroll-snap-type: x proximity; }
.overview li { flex: 0 0 auto; scroll-snap-align: center; }
button.cell { min-width: var(--target); min-height: var(--target); padding: 2px 6px; display: grid; place-items: center; line-height: 1.1; font-family: var(--font-mono); font-size: var(--fs-small); border: 2px solid var(--border-subtle); border-radius: var(--radius-m); background: var(--surface); cursor: pointer; }
button.cell .mk { font-size: 0.68rem; display: block; min-height: 0.8em; }
button.cell[data-s="chosen"] { background: var(--chosen); border-color: var(--accent); }
button.cell[data-s="later"] { background: var(--warn-bg); border-color: var(--warn); }
button.cell[data-s="waiting"] { background: var(--ng-bg); border-color: var(--ng); }
button.cell[aria-current="step"] { outline: 3px solid var(--focus); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); font-size: var(--fs-small); color: var(--text-muted); }
@media (max-width: 40rem) { .legend { display: none; } }
/* 本体の領域(動くのは、ここだけ) */
#stage { flex: 1 1 0; min-height: 0; overflow: auto; display: grid; grid-template-rows: minmax(0, 1fr); align-content: stretch; }
.stack { display: grid; gap: var(--space-3); align-content: start; }
.sheet { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: var(--space-2); min-height: 0; height: 100%; }
.sheet-scroll { overflow: auto; min-height: 0; display: grid; align-content: start; gap: var(--space-3); background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-m); padding: var(--space-3) var(--space-4); }
.sheet-scroll[data-d="1"] { background: var(--chosen); }
.sheet-dock { display: grid; gap: var(--space-2); }
.meta { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); align-items: baseline; }
.when { font-family: var(--font-mono); font-size: var(--fs-small); padding: 1px var(--space-2); border-radius: var(--radius-s); border: 1px solid var(--border-subtle); }
.when.urgent { background: var(--ng-bg); color: var(--ng); border-color: transparent; }
.when.near { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.from { font-family: var(--font-mono); font-size: var(--fs-small); color: var(--text-muted); overflow-wrap: anywhere; }
.rec b { color: var(--accent-text); }
.why { font-size: var(--fs-small); color: var(--text-muted); overflow-wrap: anywhere; white-space: pre-line; }
.badge { font-family: var(--font-mono); font-size: var(--fs-small); padding: 1px var(--space-2); border-radius: var(--radius-s); border: 1px solid var(--border-subtle); color: var(--text-muted); }
.badge.stale { background: var(--warn-bg); color: var(--warn); border-color: transparent; font-weight: 700; }
/* 選択肢: 内容の選択肢(2〜5 個)は固定の格子(幅 390px は 2 列、40rem 以上は 3 列)。全ボタンが同じ幅・同じ高さ。 */
.opts { display: grid; gap: var(--space-2); }
.opts.main { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; }
.opts.aside { grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px dashed var(--border-subtle); padding-top: var(--space-2); }
@media (min-width: 40rem) { .opts.main { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.opts button { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: var(--space-2); text-align: left; width: 100%; min-height: 56px; padding: 6px 10px; line-height: 1.3; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-m); font-size: var(--fs-small); cursor: pointer; }
.opts.aside button { min-height: var(--target); border-style: dashed; }
.opts .lab { overflow-wrap: anywhere; }
.opts button .code { font-family: var(--font-mono); font-size: var(--fs-small); padding: 0 5px; border: 1px solid var(--border-subtle); border-radius: var(--radius-s); }
.opts button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.opts button[aria-checked="true"] .code { border-color: var(--on-accent); }
.opts button[data-rec="1"]:not([aria-checked="true"]) { border-color: var(--accent); }
/* 「推奨」の印は、ボタンの右上の角に重ねる(ラベルの幅も、ボタンの高さも変えない) */
.opts button .tag { position: absolute; top: -8px; right: 8px; display: block; font-size: 0.68rem; line-height: 1; padding: 2px 6px; border: 1px solid var(--accent); border-radius: 999px; background: var(--bg); color: var(--accent-text); }
.opts button[aria-checked="true"] .tag { background: var(--on-accent); color: var(--accent); }
@media (hover: hover) { .opts button:hover { border-color: var(--accent); } }
.after { background: var(--bg); border-radius: var(--radius-s); padding: var(--space-2) var(--space-3); display: grid; gap: 2px; font-size: var(--fs-small); }
.after dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px var(--space-3); }
.after dt { color: var(--text-muted); font-family: var(--font-mono); }
.after dd { margin: 0; overflow-wrap: anywhere; }
.after .arow { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; justify-content: space-between; }
.after.hint { color: var(--text-muted); }
textarea, input[type="text"], input:not([type]) { font: inherit; font-size: var(--fs-body); min-height: var(--target); color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-s); padding: var(--space-2) var(--space-3); width: 100%; box-sizing: border-box; line-height: 1.6; }
textarea { min-height: 3.2em; resize: vertical; }
label.note { font-size: var(--fs-small); color: var(--text-muted); display: grid; gap: var(--space-1); }
label.note.must { color: var(--text); }
label.note.must textarea { border-color: var(--accent); border-width: 2px; }
label.note .warn { color: var(--warn); }

  if (c.typing === "memo") return { on: false, text: "メモ欄に入力中です: Esc で次へ" };
  if (c.typing === "field") return { on: false, text: "入力欄の中です: Esc で出ると、キーが使えます" };

  if (c.view === "confirm") return e.key === "Backspace" ? { act: "back-to-steps" } : { act: "ignore", why: "confirm-view" };

function handoffNode() {

    if (OPTIONS.kinds[it.kind].answer) { answered.push([it, o]); continue; }

    dl.append(el("dt", null, "あなた"), el("dd", null, o.you), el("dt", null, "私"), el("dd", null, o.agent));
    const row = el("div", "arow"); row.append(dl);
    const right = el("div", "bar");
    right.append(Object.assign(el("span", "saved"), { id: "s-" + id }));
    const clr = el("button", "btn-link", "選択を外す"); clr.type = "button"; clr.addEventListener("click", () => clearChoice(it));
    right.append(clr); row.append(right);
    after.append(row);
    paintSave(id);
  } else {
    after.className = "after hint";
    after.textContent = "選ぶと、あなたと私の分担がここに出ます。";
  }
  const sk = document.getElementById("skip-note"); if (sk) sk.hidden = !!o;
  const isOther = !!o && o.verdict === "other";
  const nl = document.getElementById("nl-" + id), ta = document.getElementById("n-" + id);
  nl.className = "note" + (isOther ? " must" : "");
  document.getElementById("nt-" + id).textContent = isOther
    ? "その他の指示(必須): どうしたいかを書いてください。この欄が、そのまま次の机への指示になります"
    : "メモ(任意): 理由や、次から変えてほしいこと";
  ta.placeholder = isOther ? "例: 返信は私が送る。ただし先に、副業の可否だけ文面で聞いてほしい。" : "";
  document.getElementById("w-" + id).textContent = isOther && !(s.note && s.note.trim()) ? "指示が空です。書くまで、次の机は動けません" : "";
  if (s && typeof s.note === "string" && document.activeElement !== ta && ta.value !== s.note) ta.value = s.note;
}
/* 状態が変わったとき: いまの画面の部分だけを描き直す(入力中の欄を壊さない)。 */
function paint(id) {
  if (view === "step" && ORDER[cur] === id) paintCard(id);
  if (view === "confirm") { const box = document.getElementById("c-rows"); if (box) rowsInto(box); const ho = document.getElementById("c-handoff"); if (ho) { ho.textContent = ""; ho.append(handoffNode()); } }
  paintOverview(); paintStatus();
}

function typingTarget(t) { return !!t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable === true); }
/* 状態の行: 普段は直前の結果だけ(読み上げの対象はここだけ)。キーが止まったときだけ、理由を出す。毎回、状態から導く(固定の文は持たない)。 */
function paintStatus() {
  const a = document.activeElement;
  const typing = !typingTarget(a) ? null : (a.tagName === "TEXTAREA" && /^n-/.test(a.id || "")) ? "memo" : "field";
  const ks = keyState({ focused: document.hasFocus(), typing, view });
  document.getElementById("statusbar").dataset.keys = ks.on ? "on" : "off";
  const last = document.getElementById("sb-last");
  const line = ks.on ? lastResult : "キー ○ " + ks.text;
  if (last.textContent !== line) last.textContent = line;
}
for (const [t, ev] of [[window, "focus"], [window, "blur"], [document, "focusin"], [document, "focusout"]]) t.addEventListener(ev, () => setTimeout(paintStatus, 0));
function emptyOthers() {
  return ITEMS.filter(it => { const s = state[it.id], o = optionOf(it, s); return !!o && o.verdict === "other" && !(s.note && s.note.trim()); });
}
/* 確定は 1 回だけ。その他で指示が空の項目が残るあいだは確定させず、その件へ戻す。保存は選んだ時にもう済んでいる。 */
function confirmAll() {
  if (view !== "confirm") return;
  const bad = emptyOthers();
  if (bad.length) { lastResult = "その他で指示が空の項目が " + bad.length + " 件あります。書くか、選び直してください(確定していません)"; goStep(ORDER.indexOf(bad[0].id), true); return; }
  view = "done"; lastResult = "確定しました。これ以降のキー入力は受けません"; renderStage();
}
/* キー入力は、decideKey(画面に触れない関数)が決め、ここは、その結果を画面に写すだけ。
   ボタン・要約・リンクなどにフォーカスがあるとき、その標準のキー操作(Enter・Space)を奪わない仕事は、共有の keyguard(config/web/behavior.js)が担う(C12)。
   ハンドラが false を返したキーは、ブラウザの標準の動作を止めない。 */
function onKey(e) {
  const t = e.target;
  const target = !typingTarget(t) ? null : (t.tagName === "TEXTAREA" && /^n-/.test(t.id || "")) ? "memo" : "field";
  const d = decideKey({ order: ORDER, cur, view }, { key: e.key, ctrl: e.ctrlKey, meta: e.metaKey, alt: e.altKey, target });
  if (d.act === "esc-memo") { t.blur(); advanceAfter(); return false; }
  if (d.act === "esc-field") { t.blur(); paintStatus(); return false; }
  if (d.act === "prev") { if (cur > 0) { goStep(cur - 1); lastResult = "№ " + (cur + 1) + " へ戻りました"; paintStatus(); } return; }
  if (d.act === "next") { if (cur >= ORDER.length - 1) showConfirm(); else goStep(cur + 1); return; }
  if (d.act === "back-to-steps") { goStep(ORDER.length - 1, true); return; }
  if (d.act === "choose") {
    if (e.repeat) return; /* 押しっぱなしで、複数の件に選択が入らないようにする */
    pick(ITEM[d.id], d.option); return;
  }
  if (d.why === "nokey" && e.key.length === 1) {
    lastResult = "「" + e.key + "」は、№ " + (cur + 1) + " では使えません(使えるのは " + hintsOf(ITEM[d.id]).map(h => h.key).join("・") + ")";
    paintStatus();
  }
  return false;
}
{
  const keys = {};
  for (let c = 32; c < 127; c++) keys[String.fromCharCode(c)] = onKey;  /* 符号(a・b…)・Space・そのほかの印字できるキー(「使えません」の案内のため) */
  for (const k of ["Backspace", "ArrowLeft", "ArrowRight", "Escape"]) keys[k] = onKey;
  window.pageBehavior.keyguard(keys, { modifiers: true });  /* 修飾キーつきも onKey が受け、decideKey が無視する(Ctrl+A などは、ブラウザに任せる) */
}
/* Ctrl+Enter(確認画面へ・確定): どの要素にフォーカスがあっても効く(入力欄の中でも)。標準のキー操作ではない組み合わせなので、keyguard の外に置く。 */
document.addEventListener("keydown", e => {
  if (e.defaultPrevented || e.isComposing || !(e.ctrlKey && e.key === "Enter")) return;
  const d = decideKey({ order: ORDER, cur, view }, { key: e.key, ctrl: e.ctrlKey, meta: e.metaKey, alt: e.altKey, target: null });
  if (d.act !== "confirm") return;
  e.preventDefault();
  if (view === "step") showConfirm(); else if (view === "confirm") confirmAll();
});

/* ---- 保存 ---- */
/* 項目ごとの保存の表示。「保存済み」は書き込みの成功を確かめてから出す。失敗は、その項目の横に、再保存の操作と一緒に出す(UX の型 P1)。
   db から読み込んだ答えは、保存済みとして扱う(saveSt が未設定のとき)。 */
function paintSave(id) {
  const box = document.getElementById("s-" + id), s = state[id]; if (!box) return;
  box.textContent = ""; box.removeAttribute("data-s");
  if (!s || !s.at) return;
  if (!col) { box.textContent = hhmm(s.at); return; }
  const v = saveSt[id] || "saved";
  box.dataset.s = v;
  if (v === "saving") box.textContent = "保存中…";
  else if (v === "failed") {
    box.append("保存できませんでした ");
    const b = el("button", "btn-link", "もう一度保存"); b.type = "button"; b.addEventListener("click", () => persist(ITEM[id]));
    box.append(b);
  } else box.textContent = "保存済み " + hhmm(s.at);
}
function setDb(text, bad) { const st = document.getElementById("dbstatus"); st.textContent = text; st.hidden = !bad; if (bad) st.className = "status bad"; }
function persist(it) {
  if (!col) return;
  const s = state[it.id]; if (!s) return;
  const body = { key: it.key, verdict: s.verdict || "", owner: s.owner || "", option: s.option || "", note: s.note || "", at: s.at };
  const ref = col.doc(docId(it.key));
  const seq = saveSeq[it.id] = (saveSeq[it.id] || 0) + 1;
  saveSt[it.id] = "saving"; paintSave(it.id);
  const stale = () => saveSeq[it.id] !== seq; /* 後の書き込みが出ているなら、その結果に任せる */
  const run = () => ref.set(body).then(() => {
    if (stale()) return;
    saveSt[it.id] = "saved"; paintSave(it.id);
    if (!Object.values(saveSt).includes("failed")) setDb("", false);
  }).catch(e => {
    if (stale()) return;
    saveSt[it.id] = "failed"; paintSave(it.id);
    setDb("保存できませんでした(" + (e && e.code ? e.code : "エラー") + ")。該当の項目の「もう一度保存」を押すか、確認画面の「回答をまとめる」で貼り付けてください。", true);
  });
  chain[it.id] = (chain[it.id] || Promise.resolve()).then(run);
}
function choose(it, o) {
  const at = new Date().toISOString();
  const prev = state[it.id] || {};
  state[it.id] = { verdict: o.verdict, owner: o.owner || "", option: o.id, at, note: prev.note || "" };
  const i = ORDER.indexOf(it.id);
  const code = codesOf(optsOf(it))[o.id];
  lastResult = "№ " + (i + 1) + " に「" + (code === " " ? "Space" : code) + " " + o.label + "」を選びました";
  paint(it.id); persist(it);
}
/* 画面の操作(キーでもクリックでも)で選ぶとき: 選んで、次へ進む。「その他」は進まず、メモ欄へ。 */
function pick(it, o) {
  choose(it, o);
  if (o.verdict === "other") { const ta = document.getElementById("n-" + it.id); if (ta) ta.focus(); }
  else advanceAfter();
}
function clearChoice(it) {
  const at = new Date().toISOString();
  const prev = state[it.id] || {};
  state[it.id] = { verdict: "", owner: "", option: "", at, note: prev.note || "" };
  lastResult = "№ " + (ORDER.indexOf(it.id) + 1) + " の選択を外しました";
  paint(it.id); persist(it);
}
const timers = {};
function noteInput(it, text) {
  const at = new Date().toISOString();
  const prev = state[it.id] || { verdict: "", owner: "", option: "" };
  state[it.id] = { verdict: prev.verdict || "", owner: prev.owner || "", option: prev.option || "", at, note: text };
  clearTimeout(timers[it.id]);
  const w = document.getElementById("w-" + it.id); if (w) w.textContent = "";
  timers[it.id] = setTimeout(() => { persist(it); paint(it.id); }, 900);
}
let gTimer = null;
/* 「今後の裁定へのフィードバック」は、固定の 1 文書(guidance/standing)で、ページを開くたびに前の入力が読み込まれる。
   「回答をまとめる」には、このページを開いてから書き換えたときだけ含める(古い入力を、毎回の答えとして貼らない。2026-11-19 に、11/11 の入力が出た)。 */
let gEdited = false;
function guidanceInput(text) {
  gEdited = true; gValue = text;
  clearTimeout(gTimer);
  gTimer = setTimeout(() => {
    if (!gdoc) return;
    const at = new Date().toISOString();
    gdoc.set({ text, at }).then(() => { const g = document.getElementById("g-saved"); if (g) g.textContent = "保存済み " + hhmm(at); })
      .catch(e => { const g = document.getElementById("g-saved"); if (g) g.textContent = "保存できませんでした(" + (e && e.code ? e.code : "エラー") + ")"; });
  }, 900);
}
let gdoc = null;
/* 「推奨をすべて採用」: まだ選ばれていない項目のうち、推奨(rec_option)のある項目だけを、推奨の選択肢にする(進まない)。
   すでに選んだ項目と、推奨のない項目、推奨が「その他」の項目は、そのままにする。例外だけを、あとから個別に直せる。 */
function adoptAll() {
  for (const it of ITEMS) {
    if (!it.rec_option || settled(state[it.id])) continue;
    const o = optsOf(it).find(x => x.id === it.rec_option);
    if (o && o.verdict !== "other") choose(it, o);
  }
}
async function summarize(pre, st) {
  const lines = [];
  let picked = 0;
  for (const it of ITEMS) {
    const s = state[it.id]; if (!s) continue;
    const o = optionOf(it, s);
    if (!o && !s.note) continue;
    if (o) picked++;
    lines.push("- " + it.title + (o ? " → " + o.label : "") + (s.note ? "\n  " + (o && o.verdict === "other" ? "指示: " : "メモ: ") + s.note : ""));
  }
  const g = gEdited ? gValue.trim() : "";
  const rest = ITEMS.length - picked;
  const text = (lines.length ? lines.join("\n") + "\n" : "") + "(未選択 " + rest + " 件は推奨どおりでよい)" + (g ? "\n今後へのフィードバック: " + g : "");
  pre.textContent = text; pre.hidden = false;
  try { await navigator.clipboard.writeText(text); st.textContent = "コピーしました。チャットに貼ってください"; }
  catch (e) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); st.textContent = "コピーできませんでした。選択したので、手でコピーしてください"; }
}

/* 起動 */
document.getElementById("run-label").textContent = DATA.run_label || "";
if (DATA.alert && DATA.alert.title) {
  const a = document.getElementById("alert");
  a.append(el("strong", null, DATA.alert.title), el("p", null, DATA.alert.body || ""));
  a.hidden = false;
}
renderStage(false);
(async () => {
  let db = null;
  try { db = await window.claude?.use("db"); } catch (e) { db = null; }
  if (!db) { setDb("保存先に接続できません。選択はこの画面だけに残ります。確認画面の「回答をまとめる」で貼り付けてください。", true); return; }
  col = db.collection("verdicts");
  col.onSnapshot(snap => {
    if (!Object.values(saveSt).includes("failed")) setDb("", false);
    const byKey = new Map(snap.docs.map(d => [d.data().key, d.data()]));
    let changed = false;
    for (const it of ITEMS) {
      const d = byKey.get(it.key);
      if (d && (!state[it.id] || state[it.id].at !== d.at)) { state[it.id] = { verdict: d.verdict || "", owner: d.owner || "", option: d.option || "", at: d.at, note: typeof d.note === "string" ? d.note : "" }; changed = true; }
    }
    if (changed) paint(ORDER[cur]);
  }, e => { setDb("保存先との接続が切れました(" + (e && e.code ? e.code : "エラー") + ")。確認画面の「回答をまとめる」で貼り付けてください。", true); });
  gdoc = db.doc("guidance/standing");
  gdoc.onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    const gt = document.getElementById("g-text");
    if (d && typeof d.text === "string") { if (!gEdited) gValue = d.text; if (gt && document.activeElement !== gt && gt.value !== d.text) gt.value = d.text; }
    const gs = document.getElementById("g-saved"); if (gs && d && d.at) gs.textContent = "保存済み " + hhmm(d.at);
  }, e => { const gs = document.getElementById("g-saved"); if (gs) gs.textContent = "フィードバックの保存先に接続できません(" + (e && e.code ? e.code : "エラー") + ")"; });
})();
